<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content">
<title>포토샷 · 이미지 보정</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/favicon-16.png" sizes="16x16" type="image/png">
<meta name="theme-color" content="#15171a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="포토샷">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<!-- nolging.github.io와 계정을 공유하는 로그인에 사용 (index.html 하단의 SUPABASE_URL/ANON_KEY 참고) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#15171a;
    --panel:#1c1f23;
    --panel-2:#22262b;
    --line:#2c3137;
    --text:#e7e9ec;
    --text-dim:#93999f;
    --accent:#3ddc97;
    --accent-dim:#25845b;
    --danger:#e2725b;
    --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
  }
  @font-face{font-family:'Paperlogy';font-style:normal;font-display:swap;font-weight:400;src:url('fonts/Paperlogy-400.woff2') format('woff2');}
  @font-face{font-family:'Paperlogy';font-style:normal;font-display:swap;font-weight:500;src:url('fonts/Paperlogy-500.woff2') format('woff2');}
  @font-face{font-family:'Paperlogy';font-style:normal;font-display:swap;font-weight:600;src:url('fonts/Paperlogy-600.woff2') format('woff2');}
  @font-face{font-family:'Paperlogy';font-style:normal;font-display:swap;font-weight:700;src:url('fonts/Paperlogy-700.woff2') format('woff2');}
  @font-face{font-family:'Paperlogy';font-style:normal;font-display:swap;font-weight:800;src:url('fonts/Paperlogy-800.woff2') format('woff2');}
  *{box-sizing:border-box;}
  /* Falls back to plain 100% (the initial containing block) until the JS
     sets --app-height from window.visualViewport — 100%/100vh don't shrink
     when a mobile on-screen keyboard opens (the layout viewport doesn't
     change, only the visual one does), so the browser instead scrolls the
     whole page to keep the focused input visible, taking the fixed-height
     empty-state screen's top content (the logo) off-screen with it. */
  html,body{height:100%;height:var(--app-height,100%);margin:0;overflow:hidden;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    /* A long press anywhere (e.g. holding a layer row to drag-reorder it, or
       just holding a menu button) shouldn't trigger the browser's native
       text-selection handles or iOS's copy/paste callout. */
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
  }
  input, textarea, select{
    -webkit-user-select:auto;
    user-select:auto;
  }
  header{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:8px;
    padding:10px 14px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .header-side{display:flex;align-items:center;}
  .header-side-left{grid-column:1;justify-content:flex-start;}
  .header-side-right{grid-column:3;justify-content:flex-end;gap:8px;}
  .header-actions{grid-column:2;display:flex;gap:8px;justify-content:center;}
  .header-crop-size{grid-column:2;display:none;justify-content:center;align-items:center;font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap;}
  .header-draw-actions{grid-column:2;display:none;gap:8px;justify-content:center;}
  body.draw-editing .header-draw-actions{display:flex;}
  /* Every header button is icon-only with no background at all, in any
     state — enabled/disabled is shown purely by icon color (white/gray),
     and pressing one never darkens a background, only dims the icon a
     shade back toward gray as press feedback. .active (a toggle currently
     open, e.g. the layer panel button) gets the accent color instead. */
  .iconbtn{
    width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;
    background:transparent;border:none;color:var(--text-dim);
  }
  .iconbtn svg{width:18px;height:18px;}
  .iconbtn:not(:disabled){color:var(--text);}
  .iconbtn:hover:not(:disabled),
  .iconbtn:active:not(:disabled){background:transparent;}
  .iconbtn:active:not(:disabled){color:var(--text-dim);}
  .iconbtn.active{color:var(--accent);}
  .menu-cancel,.menu-apply{display:none;}
  body.editing-mode .header-actions,
  body.editing-mode #closeBtn{display:none;}
  body.editing-mode .menu-cancel,
  body.editing-mode .menu-apply{display:inline-flex;}
  body.crop-editing .header-crop-size{display:flex;}
  /* 프로필 사진 자동화 모드: the square crop this forces has no escape hatch —
     no 취소, no other ratio, no switching to a different menu — until 적용
     commits a square result and the automatic pipeline takes over. */
  body.forced-crop .menu-cancel{display:none!important;}
  body.forced-crop #group-crop .ratio-btn:not([data-ratio="1:1"]){display:none;}
  /* Blocks switching to a different menu: on mobile the tab bar is how you'd
     do that; on desktop the same element IS the left tool bar now too, so
     this one rule locks both layouts at once (summaries themselves are
     either already unclickable on mobile or permanently hidden on desktop,
     so there's no separate accordion-click path left to guard). */
  body.forced-crop .mobile-tabbar{display:none!important;}
  .toggle-btn.active{background:var(--accent-dim);border-color:var(--accent);color:#eafffb;}
  button{
    font-family:var(--sans);
    cursor:pointer;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    padding:7px 13px;
    font-size:13px;
    transition:background .12s,border-color .12s;
  }
  button:hover{background:#2a2f35;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  button.primary{background:var(--accent);border-color:var(--accent);color:#0b1615;font-weight:600;}
  button.primary:hover{background:#63d8cd;}
  button.danger{border-color:var(--danger);color:var(--danger);background:transparent;}
  button.danger:hover{background:rgba(226,114,91,.12);}
  button.ghost{background:transparent;}
  button.toolbtn{padding:8px 10px;}
  button.toolbtn.active{background:var(--accent-dim);border-color:var(--accent);color:#eafffb;}

  .layout{flex:1;display:flex;min-height:0;}
  .stage-wrap{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:24px;overflow:hidden;position:relative;
    background:#101214;
  }
  /* Outside crop mode this box shrink-wraps to exactly the visible canvas
     (a flex item with no explicit width/height sizes to its content), so
     its own background is only ever seen through the gap around a
     rounded corner or shadow — never a real visible area. In crop mode,
     though, JS explicitly enlarges it to the fixed crop viewport so the
     image can be panned/zoomed inside it, and that extra space around the
     (possibly smaller/offset) image needs an actual background: plain
     ink-black, matching the stage margin, NOT a checkerboard — the
     checkerboard itself lives on #mainCanvas below so it only ever
     tracks the image's own bounds, not this outer viewport. */
  .canvas-holder{
    position:relative;box-shadow:0 8px 30px rgba(0,0,0,.5);
    background-color:#101214;
  }
  .canvas-holder canvas:not([hidden]){display:block;}
  /* Sized to exactly match the image (this is what pans/zooms during
     crop), so this checkerboard shows through only actual transparent
     PIXELS of the image itself (e.g. after 배경 제거), and moves/scales
     together with the image rather than staying fixed to the viewport. */
  #mainCanvas{
    background-image:
      linear-gradient(45deg,#ccc 25%,transparent 25%),
      linear-gradient(-45deg,#ccc 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#ccc 75%),
      linear-gradient(-45deg,transparent 75%,#ccc 75%);
    background-size:16px 16px;
    background-position:0 0,0 8px,8px -8px,-8px 0px;
    background-color:#fff;
  }
  #overlayCanvas{position:absolute;top:0;left:0;touch-action:none;}
  .canvas-holder.crop-mode{overflow:hidden;}
  .canvas-holder.crop-mode #mainCanvas{position:absolute;}

  /* ---------- Crop frame overlay ----------
     The frame itself never moves: it always stays centered in the fixed-size
     crop viewport. Dragging the backdrop (crop-frame) pans the image behind it;
     only the handles (children, pointer-events re-enabled) resize the frame. */
  .crop-frame{position:absolute;inset:0;overflow:hidden;pointer-events:auto;touch-action:none;z-index:20;cursor:move;}
  .crop-autozoom-toggle{
    display:none;position:absolute;top:10px;left:10px;z-index:25;
    align-items:center;gap:6px;
    font-size:12px;color:var(--text);white-space:nowrap;
    text-shadow:0 1px 3px rgba(0,0,0,.6);
  }
  body.crop-editing .crop-autozoom-toggle{display:flex;}
  .crop-autozoom-toggle .switch{width:34px;height:20px;}
  .crop-autozoom-toggle .switch-thumb{width:16px;height:16px;}
  .crop-autozoom-toggle .switch input:checked + .switch-track .switch-thumb{transform:translateX(14px);}
  /* 원형 틀 toggle sits inside the same top-left overlay, to the right of
     자동 확대 — a second flex group so it gets its own 6px gap from the
     first switch via the parent's `gap`, shown only while 정방형 (1:1) is
     the active ratio. The [hidden] rule is needed because our own
     display:flex here otherwise outranks the browser's default
     [hidden]{display:none} (author rules beat UA-origin ones regardless
     of specificity, as .url-import-back hit earlier in this project). */
  .crop-autozoom-toggle-group{display:flex;align-items:center;gap:6px;}
  .crop-autozoom-toggle-group[hidden]{display:none;}
  /* A normal-flow bar directly under the header, spanning the top of the
     image area — NOT floated over the image itself (that hid part of the
     photo). Gated on hasSelection (via JS toggling [hidden]) rather than a
     body-level mode class, since a selection can stay live while any menu
     (or none) is open. */
  .selection-topbar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:8px 16px;background:#181a1e;border-bottom:1px solid var(--line);
  }
  .selection-topbar[hidden]{display:none;}
  .selection-topbar-toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text);white-space:nowrap;}
  .selection-topbar-toggle .switch{width:34px;height:20px;}
  .selection-topbar-toggle .switch-thumb{width:16px;height:16px;}
  .selection-topbar-toggle .switch input:checked + .switch-track .switch-thumb{transform:translateX(14px);}
  .selection-clear-pill{
    padding:7px 16px;border-radius:999px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);
    color:#fff;font-size:12px;font-weight:600;
  }
  .crop-rect{
    position:absolute;pointer-events:none;
    border:1px solid rgba(255,255,255,.9);
    /* A huge-spread, blur-free shadow around the frame's own box reads as
       a dimmed backdrop everywhere else — clipped to exactly the crop
       viewport by .crop-frame's own overflow:hidden, and needs no extra
       DOM or JS to track the frame's position/size as it's dragged. */
    box-shadow:0 0 0 9999px rgba(0,0,0,.55);
  }
  .circle-crop-mask{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
  .crop-gridline{position:absolute;background:rgba(255,255,255,.35);pointer-events:none;}
  .crop-gridline.v1{left:33.333%;top:0;bottom:0;width:1px;}
  .crop-gridline.v2{left:66.666%;top:0;bottom:0;width:1px;}
  .crop-gridline.h1{top:33.333%;left:0;right:0;height:1px;}
  .crop-gridline.h2{top:66.666%;left:0;right:0;height:1px;}
  .crop-handle{position:absolute;pointer-events:auto;touch-action:none;}
  .crop-handle.corner{width:30px;height:30px;}
  .crop-handle.corner::after{content:'';position:absolute;width:16px;height:16px;border:3px solid #fff;}
  .crop-handle.nw{top:-15px;left:-15px;cursor:nwse-resize;}
  .crop-handle.nw::after{top:15px;left:15px;border-right:none;border-bottom:none;}
  .crop-handle.ne{top:-15px;right:-15px;cursor:nesw-resize;}
  .crop-handle.ne::after{top:15px;right:15px;border-left:none;border-bottom:none;}
  .crop-handle.sw{bottom:-15px;left:-15px;cursor:nesw-resize;}
  .crop-handle.sw::after{bottom:15px;left:15px;border-right:none;border-top:none;}
  .crop-handle.se{bottom:-15px;right:-15px;cursor:nwse-resize;}
  .crop-handle.se::after{bottom:15px;right:15px;border-left:none;border-top:none;}
  .crop-handle.n{top:-11px;left:50%;width:40px;height:22px;margin-left:-20px;cursor:ns-resize;}
  .crop-handle.s{bottom:-11px;left:50%;width:40px;height:22px;margin-left:-20px;cursor:ns-resize;}
  .crop-handle.e{right:-11px;top:50%;width:22px;height:40px;margin-top:-20px;cursor:ew-resize;}
  .crop-handle.w{left:-11px;top:50%;width:22px;height:40px;margin-top:-20px;cursor:ew-resize;}
  .crop-handle.n::after,.crop-handle.s::after{content:'';position:absolute;left:50%;top:50%;width:24px;height:4px;margin-left:-12px;margin-top:-2px;background:#fff;border-radius:2px;}
  .crop-handle.e::after,.crop-handle.w::after{content:'';position:absolute;left:50%;top:50%;width:4px;height:24px;margin-left:-2px;margin-top:-12px;background:#fff;border-radius:2px;}
  /* No image loaded yet — the header/footer chrome has nothing to act on,
     so it's hidden entirely rather than showing a row of disabled buttons. */
  body.no-image header,
  body.no-image footer{display:none;}
  .empty-state{
    color:var(--text-dim);text-align:center;font-size:14px;line-height:1.7;
  }
  .empty-state-actions:not([hidden]){display:flex;flex-direction:column;align-items:center;gap:14px;}
  .empty-state-actions button{
    min-width:240px;padding:18px 32px;font-size:17px;font-weight:600;
    border-radius:999px;
  }
  .empty-state-actions .ghost{background:#000;border-color:#000;color:var(--text);}
  .empty-state-actions .ghost:hover{background:#1a1a1a;}
  /* Decorative elements only used by the first-page design below — hidden
     by default, shown via the higher-specificity body.no-image rules there
     (which apply at every width, not just mobile). */
  .empty-state-glow,.empty-state-logo,.empty-state-cat,.empty-state-spacer{display:none;}
  .btn-icon{display:none;}

  /* ---------- First-page design (design-file mockup) ----------
     Was mobile-only; now applies at every width so desktop's empty state
     matches exactly — same gradient/glow buttons, same clickable cat that
     toggles 프로필 사진 자동화 모드. .empty-state-bottom/.empty-state-cat-row
     get an extra max-width below (desktop-only) so the column doesn't
     stretch edge-to-edge on a wide screen the way it does on a phone. */
    body.no-image #stageWrap{align-items:stretch;justify-content:stretch;padding:0;}
    body.no-image .empty-state{
      width:100%;height:100%;display:flex;flex-direction:column;align-items:center;
      position:relative;overflow:hidden;padding:0 24px;
      background:#0e0e12;color:#f5f4f8;
    }
    body.no-image .empty-state-glow{
      display:block;position:absolute;top:-120px;left:50%;transform:translateX(-50%);
      width:420px;height:420px;border-radius:50%;pointer-events:none;
      background:radial-gradient(circle,rgba(61,220,151,.22),transparent 70%);
    }
    body.no-image .empty-state-logo{
      display:block;padding-top:min(140px,15vh);text-align:center;position:relative;z-index:1;
      font-family:'Paperlogy',-apple-system,'Apple SD Gothic Neo',sans-serif;
      font-size:40px;font-weight:900;letter-spacing:-1px;color:#f5f4f8;
    }
    body.no-image .empty-state-logo span{color:#3ddc97;}
    body.no-image .empty-state-spacer{display:block;flex:1;}
    /* padding-bottom is capped to a fraction of --app-height (not a flat
       56px) so it shrinks along with the screen once the spacer above has
       already been squeezed to nothing — otherwise, once the on-screen
       keyboard leaves only a little room, this fixed gap ends up looking
       far too big under the input box relative to what's left. */
    body.no-image .empty-state-bottom{
      width:100%;max-width:420px;padding-bottom:min(56px,calc(var(--app-height,800px)*.05));
      position:relative;z-index:1;
    }
    /* Positioning context for the "<" back button and the automation-mode
       label, both placed with position:absolute below the cat (see their
       own rules) rather than sharing flex layout with it — that way
       neither one can shift the cat's own position (X or Y) depending on
       whether the URL-import form is open. */
    body.no-image .empty-state-cat-row{
      position:relative;width:100%;max-width:420px;
    }
    body.no-image .empty-state-cat{
      display:flex;justify-content:flex-end;padding-right:26px;margin-bottom:0;
      cursor:pointer;position:relative;z-index:2;
    }
    /* Some browsers leave a stale composited glow behind (and render it
       clipped to a box on the next toggle) when a filter is added/removed
       outright. Keeping the same drop-shadow() always applied and only
       animating its alpha avoids ever adding/removing the filter itself. */
    body.no-image .empty-state-cat svg{
      filter:drop-shadow(0 0 10px rgba(61,220,151,0));
      transition:filter .15s;
      /* svg{overflow:hidden} is the UA default — without overriding it,
         the drop-shadow gets clipped to the SVG's own rectangular
         viewport instead of following the cat's actual silhouette. */
      overflow:visible;
    }
    body.no-image .empty-state-cat.active svg{filter:drop-shadow(0 0 10px rgba(61,220,151,.5));}
    @keyframes cat-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
    body.no-image .cat-eye{animation:cat-blink 4s infinite;}
    body.no-image .cat-eye-l{transform-origin:23px 26px;}
    body.no-image .cat-eye-r{transform-origin:41px 26px;}
    /* Anchored to .empty-state-cat-row (position:relative, sibling of the
       cat rather than a descendant now that the row also holds the "<"
       back button) rather than to #emptyStateActions — that container
       gets hidden outright while the URL-import form is showing, which
       would otherwise take this label down with it even though the
       automation mode itself stays on. bottom:5px (5px up from the row's
       own bottom edge, which lines up with the cat's bottom edge since
       the row is only as tall as the cat) reproduces the same on-screen
       spot the old bottom:100%-relative-to-actions rule did, just
       measured from an anchor that's always present. */
    body.no-image .profile-mode-label:not([hidden]){
      display:block;position:absolute;left:0;right:0;bottom:5px;
      text-align:center;font-weight:300;font-size:12px;
      color:rgba(245,244,248,.5);
      font-family:'Paperlogy',-apple-system,'Apple SD Gothic Neo',sans-serif;
    }
    body.no-image .empty-state-actions button{
      width:100%;min-width:0;height:56px;padding:0 24px;
      font-family:'Paperlogy',-apple-system,'Apple SD Gothic Neo',sans-serif;
      font-size:16px;font-weight:700;gap:8px;
      display:flex;align-items:center;justify-content:center;
    }
    body.no-image .empty-state-actions button:active{transform:scale(.985);}
    body.no-image .empty-state-actions .primary{
      /* The base button{} rule sets a real border:1px solid — overriding
         only border-color here left that 1px border-width in place
         (invisible, but still real), so background-origin's padding-box
         default sized the gradient 2px smaller than the border-box it
         actually painted into — removing the border outright fixes that
         mismatch. Separately (now that the coordinate space is correct):
         a plain 2-stop diagonal gradient's color at any point comes from
         projecting that point onto the gradient's axis, and on a stadium
         shape the single worst point on each rounded cap's curve is where
         it meets the FAR flat edge (bottom edge for the left/mint cap,
         top edge for the right/purple cap) — needing the flat zone to
         reach (3/(2√2))×height ≈ 59.4px in from that end (independent of
         width) before the diagonal can start, confirmed pixel-exact at
         that precise point across several widths. */
      background:linear-gradient(135deg,#3ddc97 65px,#8b7bf5 calc(100% - 65px));
      box-shadow:0 0 10px 2px rgba(61,220,151,.5);
      color:#0e0e12;border:none;
    }
    body.no-image .empty-state-actions .primary:hover{background:linear-gradient(135deg,#3ddc97 65px,#8b7bf5 calc(100% - 65px));}
    body.no-image .empty-state-actions .ghost{
      background:#1c1b23;border-color:transparent;color:#f5f4f8;
      box-shadow:0 0 10px 2px rgba(61,220,151,.5);
    }
    body.no-image .empty-state-actions .ghost:hover{background:#26242f;}
    body.no-image .btn-icon{display:inline-flex;align-items:center;}
    /* Matches the 이미지 선택하기/링크로 가져오기 pill: same width
       (full-width within the page's side padding), height, font and pill
       shape, so opening the URL form doesn't feel like a different UI.
       가져오기/취소 collapse into two small icon buttons (a "<" back
       button above the input, a ">" submit button inside it) instead of
       their own full-width rows — keeps the form's total height close to
       just the input's own 56px, which was pushing the page tall enough
       to need scrolling (hiding the logo up top) with the old two-extra-
       row layout. */
    body.no-image .url-import-form:not([hidden]){
      width:100%;max-width:none;margin:0;
      display:flex;flex-direction:column;gap:10px;
    }
    /* Plain text button (no pill background, no glow), lowered to the same
       line as .profile-mode-label and pinned to the row's own left edge —
       position:absolute takes it out of flex/normal flow entirely so it
       can never affect the cat's own position above it. */
    body.no-image .url-import-back{
      position:absolute;left:0;bottom:5px;z-index:3;
      width:auto;height:auto;padding:0;border-radius:0;border:none;gap:3px;
      display:flex;align-items:center;justify-content:flex-start;
      background:none;box-shadow:none;color:rgba(245,244,248,.35);
      font-family:'Paperlogy',-apple-system,'Apple SD Gothic Neo',sans-serif;
      font-size:13px;font-weight:300;
    }
    /* Our own display:flex above outranks the browser's default
       [hidden]{display:none} (equal specificity, but ours comes later) —
       this more-specific rule restores hiding while the form is closed. */
    body.no-image .url-import-back[hidden]{display:none;}
    body.no-image .url-import-input-wrap{position:relative;}
    body.no-image .url-import-form input[type=url]{
      height:56px;padding:0 44px 0 24px;border-radius:999px;border:none;width:100%;
      font-family:'Paperlogy',-apple-system,'Apple SD Gothic Neo',sans-serif;

    body.no-image .url-import-submit{

  .url-import-form:not([hidden]){
    display:flex;flex-direction:column;gap:8px;margin-top:10px;

  .url-import-back[hidden]{display:none;}

  .url-import-form input[type=url]{

  input[type=text],input[type=password]{

  /* ---------- Modal overlay (로그인 / 자동화 설정) ---------- */
  .modal-overlay{

  .field-group-title{

  /* ---------- Login status + automation-settings entry point ---------- */
  .auth-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px;}
  .auth-status-btn{

  .automation-settings-btn{

  .automation-settings-btn[hidden]{display:none;}
  .automation-settings-btn svg{width:16px;height:16px;}

  /* Small brand mark shown in the header only on the PC empty state (see
     below) — hidden the rest of the time since the header's usual controls
     take that spot once an image is loaded. */
  .header-brand{
    display:none;font-family:'Paperlogy',-apple-system,'Apple SD Gothic Neo',sans-serif;
    font-size:15px;font-weight:900;letter-spacing:-.5px;color:var(--text);
  }
  .header-brand span{color:var(--accent);}
  body.no-image .header-brand{display:inline-block;}

  /* ---------- PC empty state: unlike mobile (header/sidebar hidden
     outright, big centered logo+glow+cat+buttons — see the mobile design
     above), PC keeps the sidebar visible from the start — there's finally
     room for it next to the stage — and only greys out the left tool bar,
     which has nothing to switch to yet. The header stays too, shrunk down
     to just the brand mark in place of its usual (all irrelevant with no
     image loaded) buttons; the big centered logo moves there with it, so
     the stage itself shows only the cat + the two action buttons, centered
     instead of pinned to the bottom by the (now-hidden) spacer. ---------- */
  @media (min-width: 861px){
    body.no-image .empty-state-glow,
    body.no-image .empty-state-logo,
    body.no-image .empty-state-spacer{display:none;}
    body.no-image .empty-state{justify-content:center;}
    body.no-image header{display:grid;}
    body.no-image .header-side-left > :not(.header-brand),
    body.no-image .header-actions,
    body.no-image .header-crop-size,
    body.no-image .header-draw-actions,
    body.no-image .header-side-right{display:none;}
    body.no-image .mobile-tabbar button{pointer-events:none;opacity:.35;}
  }

  /* ---------- Layers (header button + flyout panel) ----------
     The toggle button itself now lives in the header (styled as a plain
     .iconbtn, see toggleLayerPanel) — only .layer-panel still needs its
     own positioning here, floating below the header's right edge. */
  .layer-panel{
    position:absolute;top:10px;right:0;z-index:30;
    width:250px;max-width:calc(100% - 12px);max-height:min(60vh,420px);
    display:flex;flex-direction:column;overflow:hidden;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    box-shadow:-2px 4px 16px rgba(0,0,0,.45);
  }
  .layer-panel.collapsed{display:none;}
  .layer-panel-header{padding:9px 8px 9px 12px;font-size:12px;font-weight:600;color:var(--text-dim);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
  .layer-add-btn{width:26px;height:26px;padding:0;display:flex;align-items:center;justify-content:center;background:transparent;border-color:transparent;color:var(--text-dim);}
  .layer-add-btn:hover{color:var(--accent);background:rgba(61,220,151,.12);}
  .layer-add-btn svg{width:17px;height:17px;}
  /* Photoshop-style: blend mode + opacity live once at the top of the
     stack, for whichever layer is currently selected, instead of a
     repeated pair of controls inside every single row. */
  .layer-panel-controls{
    display:flex;align-items:center;gap:8px;
    padding:8px;border-bottom:1px solid var(--line);
  }
  .layer-panel-controls select{flex:0 1 45%;font-size:11px;padding:4px 6px;height:26px;}
  .layer-opacity-global-wrap{flex:1;display:flex;align-items:center;gap:6px;min-width:0;}
  .layer-opacity-global-wrap input[type=range]{flex:1;height:14px;}
  .layer-opacity-global-wrap span{font-family:var(--mono);font-size:10px;color:var(--text-dim);width:32px;text-align:right;flex-shrink:0;}
  /* flex:1 + min-height:0 is what actually lets overflow-y:auto kick in here —
     without it, a flex column's default min-height:auto keeps this item sized
     to its full content, so it overflows the panel's own max-height and gets
     clipped by the panel's overflow:hidden instead of scrolling. */
  .layer-list{overflow-y:auto;flex:1;min-height:0;padding:6px;display:flex;flex-direction:column;gap:4px;}
  .layer-row{
    display:grid;grid-template-columns:28px 1fr auto auto;
    align-items:center;column-gap:8px;
    padding:6px 8px;border-radius:6px;border:1px solid transparent;
    background:var(--panel-2);
    /* none, not pan-y: the hold-to-drag gesture (attachLayerDrag) needs full
       control of the touch from the very start, or a native pan-y here would
       race its hold timer for who owns the gesture. A quick swipe before the
       hold fires is scrolled manually in JS instead (see attachLayerDrag). */
    touch-action:none;
  }
  .layer-row.selected{border-color:var(--accent);background:rgba(61,220,151,.1);}
  .layer-row.dragging{opacity:.55;}
  /* Same transparency checkerboard as #mainCanvas, scaled down — shows
     through wherever the thumbnail canvas itself is left unpainted (see
     renderLayerPanel's non-adjustment branch, which no longer fills black
     before drawing the layer). */
  .layer-thumb{
    width:28px;height:28px;border-radius:4px;border:1px solid var(--line);
    background-image:
      linear-gradient(45deg,#ccc 25%,transparent 25%),
      linear-gradient(-45deg,#ccc 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#ccc 75%),
      linear-gradient(-45deg,transparent 75%,#ccc 75%);
    background-size:8px 8px;
    background-position:0 0,0 4px,4px -4px,-4px 0px;
    background-color:#fff;
  }
  .layer-name{font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .layer-name-input{
    font-size:12px;color:var(--text);background:var(--bg);
    border:1px solid var(--accent);border-radius:4px;padding:2px 5px;width:100%;
  }
  .layer-icon-btn{width:26px;height:26px;padding:0;display:flex;align-items:center;justify-content:center;background:transparent;border-color:transparent;color:var(--text-dim);}
  .layer-icon-btn svg{width:16px;height:16px;}
  .layer-icon-btn.off{color:var(--text-dim);opacity:.4;}
  .layer-icon-btn.on{color:var(--accent);opacity:1;}
  input[type=color]{width:100%;height:34px;padding:2px;background:var(--bg);border:1px solid var(--line);border-radius:5px;cursor:pointer;}
  /* Layer row context menu (이름 변경/복제/삭제) — position:fixed and placed
     by JS at either the row's own position (tapping an already-selected
     row again, mobile/iPad/desktop alike) or the cursor (PC right-click on
     ANY row). Not gated by viewport width: both open paths are wired
     unconditionally so an iPad showing the desktop layout still gets the
     tap-based path instead of needing a real right-click. */
  .layer-ctx-menu{
    position:fixed;z-index:60;min-width:130px;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    box-shadow:0 8px 24px rgba(0,0,0,.5);
    padding:4px;display:flex;flex-direction:column;gap:1px;
  }
  .layer-ctx-menu[hidden]{display:none;}
  .layer-ctx-item{
    text-align:left;padding:9px 12px;border-radius:5px;
    background:transparent;border:none;font-size:13px;color:var(--text);
  }
  .layer-ctx-item:hover{background:var(--panel-2);}
  .layer-ctx-item.danger{color:var(--danger);}
  .layer-ctx-item.danger:hover{background:rgba(226,114,91,.12);}

  aside{
    width:320px;flex-shrink:0;
    background:var(--panel);
    border-left:1px solid var(--line);
    overflow-y:auto;
    padding:14px;
  }
  .toolrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .icon-toolbtn{flex:1 1 auto;display:flex;align-items:center;justify-content:center;padding:8px;}
  .icon-toolbtn svg{width:20px;height:20px;}
  .effect-grid:not([hidden]){display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .effect-tile{display:flex;flex-direction:column;align-items:center;gap:6px;background:transparent;border:none;padding:0;}
  .effect-thumb{width:100%;aspect-ratio:1;border-radius:16px;border:1px solid var(--line);background:#000;display:block;}
  .effect-tile:hover .effect-thumb{border-color:var(--accent);}
  .effect-tile span{font-size:12px;color:var(--text);}
  .effect-detail:not([hidden]){display:flex;flex-direction:column;gap:10px;}
  .effect-back{align-self:flex-start;}
  .ratio-row{display:flex;gap:6px;flex-wrap:wrap;}
  .ratio-btn{flex:1 1 auto;padding:6px 8px;font-size:12px;}
  .ratio-btn.active{background:var(--accent-dim);border-color:var(--accent);color:#eafffb;}
  .rotate-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .rotate-value{font-family:var(--mono);font-size:13px;color:var(--accent);}
  .rotate-ruler{position:relative;width:100%;height:40px;overflow:hidden;border-radius:6px;background:var(--bg);border:1px solid var(--line);touch-action:none;cursor:ew-resize;}
  .rotate-ruler-track{position:absolute;left:50%;width:4000px;margin-left:-2000px;top:0;bottom:0;}
  .ruler-tick{position:absolute;bottom:0;width:1px;height:8px;background:var(--text-dim);}
  .ruler-tick.mid{height:13px;}
  .ruler-tick.major{height:20px;background:var(--text);}
  .rotate-ruler-needle{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--accent);pointer-events:none;z-index:2;}
  .group{
    border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden;background:var(--panel-2);
  }
  .group > summary{
    padding:10px 12px;cursor:pointer;font-size:13px;font-weight:600;
    list-style:none;display:flex;align-items:center;justify-content:space-between;
    color:var(--text);
  }
  .group > summary::-webkit-details-marker{display:none;}
  .group > summary:after{content:'−';color:var(--text-dim);font-weight:400;}
  .group.collapsed > summary:after{content:'+';}
  /* Once a menu is open, its own name is redundant (you just picked it from the
     tab bar / clicked it) — hide the summary entirely and show just the controls. */
  .group:not(.collapsed) > summary{display:none;}
  .group-body{padding:4px 12px 14px 12px;display:flex;flex-direction:column;gap:10px;}
  .group.collapsed > .group-body{display:none;}
  label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-dim);}
  label.field .row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--text);}
  input,select{outline:none;}
  input[type=range]{width:100%;accent-color:var(--accent);}
  input[type=number]{
    background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:5px;padding:5px 7px;font-family:var(--mono);font-size:12px;width:100%;
  }
  select{
    background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:5px;padding:6px 7px;font-size:12px;width:100%;
  }
  .btnrow{display:flex;gap:6px;}
  .btnrow button{flex:1;}
  .hint{font-size:11px;color:var(--text-dim);line-height:1.5;margin:0;}
  .locked-layer-warning{
    color:var(--danger);background:rgba(226,114,91,.12);border:1px solid var(--danger);
    border-radius:6px;padding:8px 10px;margin:0 12px 4px 12px;
  }
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .slider-with-input{display:flex;align-items:center;gap:8px;}
  .slider-with-input input[type=range]{flex:1;}
  .pct-box{position:relative;flex:0 0 auto;}
  .pct-box input[type=number]{width:60px;padding-right:16px;text-align:right;}
  .pct-box::after{content:'%';position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--text-dim);pointer-events:none;}
  .checkline:not([hidden]){display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;color:var(--text-dim);}
  .toggle-btn{width:100%;}
  /* iOS-style toggle switch: a hidden checkbox drives the visual track/thumb via :checked */
  .switch{position:relative;display:inline-block;width:46px;height:26px;flex-shrink:0;cursor:pointer;}
  .switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;}
  .switch-track{position:absolute;inset:0;background:var(--line);border-radius:13px;transition:background .15s;pointer-events:none;}
  .switch-thumb{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:transform .15s;pointer-events:none;}
  .switch input:checked + .switch-track{background:var(--accent);}
  .switch input:checked + .switch-track .switch-thumb{transform:translateX(20px);}
  #curveCanvas{background:#101214;border:1px solid var(--line);border-radius:6px;cursor:crosshair;width:100%;height:auto;display:block;touch-action:none;}
  .curve-points-readout{margin-top:6px;font-size:11px;font-family:ui-monospace,monospace;color:var(--text-dim);word-break:break-all;}
  #levelsInputCanvas,#levelsOutputCanvas{
    background:#101214;border:1px solid var(--line);border-radius:6px;
    width:100%;height:auto;display:block;touch-action:none;cursor:default;
  }
  .levels-io-row{display:flex;gap:8px;}
  .levels-io-row input[type=number]{flex:1;text-align:center;}
  footer{
    padding:8px 18px;border-top:1px solid var(--line);background:var(--panel);
    font-size:11px;color:var(--text-dim);display:flex;justify-content:space-between;flex-shrink:0;
  }
  input[type=file]{display:none;}

  /* ---------- Mobile bottom menu bar ---------- */
  .mobile-tabbar{display:none;}
  .mobile-tabbar button.tab-btn{
    flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:7px 14px;border:none;border-radius:8px;background:transparent;
    color:var(--text-dim);font-size:10px;line-height:1;white-space:nowrap;
  }
  .mobile-tabbar button.tab-btn svg{width:20px;height:20px;flex-shrink:0;}
  .mobile-tabbar button.tab-btn.active{color:var(--accent);background:rgba(61,220,151,.14);}

  @media (max-width: 860px){
    header{padding:8px 10px;column-gap:4px;}
    .header-actions{gap:4px;}

    .layout{flex-direction:column;position:relative;}
    .stage-wrap{padding:10px;}

    aside#sidePanel{
      width:100%;flex:0 1 auto;
      border-left:none;border-top:1px solid var(--line);
      padding:0;overflow:visible;background:var(--panel);
    }
    #sideGroups{display:flex;flex-direction:column;}
    .mobile-tabbar{
      order:2;flex:0 0 auto;
      display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;
      gap:2px;padding:4px 6px;
    }
    .mobile-tabbar::-webkit-scrollbar{height:3px;}
    /* Only that menu's control bar should remain while editing — the tab bar
       (used to pick a menu in the first place) disappears until Apply/Cancel. */
    body.editing-mode .mobile-tabbar{display:none;}
    /* Nothing to pick a menu FOR yet on the empty state (before an image is
       loaded) — used to be covered for free by aside#sidePanel's own
       display:none while the tab bar still lived inside it; now that it's a
       sibling of the stage instead (see the desktop tool bar rules), it
       needs its own guard here. */
    body.no-image .mobile-tabbar{display:none;}
    /* PC shows the sidebar even before an image loads (see the desktop
       block below) — mobile keeps the old behavior of hiding it entirely,
       since its layer panel/menu controls have nothing to act on yet. */
    body.no-image aside#sidePanel{display:none;}

    /* Panels take up real space (pushing/shrinking the image area above) instead
       of floating over the image, so opening a taller panel visibly shrinks the
       image to fit whatever room is left. */
    #sideGroups > .group{display:none;}
    #sideGroups > .group.mobile-active{
      order:1;
      display:block;
      max-height:60vh;overflow-y:auto;
      background:var(--panel);border-top:1px solid var(--line);
      margin:0;border-radius:0;border-left:none;border-right:none;border-bottom:none;
    }
    aside#sidePanel .group-body{display:flex!important;flex-direction:column;gap:10px;}
    aside#sidePanel .group > summary{pointer-events:none;}
    aside#sidePanel .group > summary:after{content:'';}
  }

  /* ---------- Desktop (Photoshop-style): layers panel docked at the bottom
     of the right sidebar instead of floating over the image, always visible. ---------- */
  @media (min-width: 861px){
    .layer-tab-btn{display:none!important;}

    /* Left tool bar: the same .mobile-tabbar buttons used for the mobile
       bottom bar, restyled as a vertical icon-only strip at the far left of
       the screen — text labels hidden, the `title` attribute on each
       button (added in HTML) supplies the native hover tooltip instead. It
       stays visible even while a menu is open (unlike the mobile bar, which
       hides during editing-mode — see the max-width block above) so a
       different tool can be picked at any time — the click handler itself
       (see the shared tabButtons wiring in JS) never auto-applies the menu
       being left, though: switching this way always goes through the same
       confirm-if-dirty guard as the header's own 취소 button, exactly like
       mobile's rule that only the 적용 button itself ever commits. */
    .mobile-tabbar{
      display:flex;flex-direction:column;flex:0 0 auto;
      width:56px;padding:10px 6px;gap:4px;align-items:center;
      background:var(--panel);border-right:1px solid var(--line);
      overflow-y:auto;
    }
    .mobile-tabbar button.tab-btn{width:40px;height:40px;padding:0;border-radius:8px;justify-content:center;}
    .mobile-tabbar button.tab-btn span{display:none;}
    /* Icon-only active state: just the icon itself turns accent-colored,
       no background highlight behind it. */
    .mobile-tabbar button.tab-btn.active{background:transparent;}

    /* The adjustment groups get their own scrolling region (flex:1) so the
       docked layer panel can be a plain fixed-size flex item pinned at the
       bottom — never overlapping the groups above it, unlike a sticky
       element sharing one scroll container with them. Only the group
       matching the currently-picked left tool bar icon is shown — same
       .mobile-active mechanism the mobile layout uses for its own single
       active panel — and each group's own summary/box chrome (border,
       margin, +/− label) is dropped since the tool bar itself is what
       picks it now. */
    aside#sidePanel{display:flex;flex-direction:column;overflow-y:hidden;padding:0;}
    #sideGroups{flex:1 1 auto;overflow-y:auto;min-height:0;padding:14px;}
    #sideGroups > .group{display:none;}
    #sideGroups > .group.mobile-active{
      display:block;margin:0;border:none;border-radius:0;
      background:transparent;overflow:visible;
    }
    #sideGroups > .group > summary{display:none;}
    .layer-panel.docked{
      position:static;
      /* A fixed height (not max-height) so it never grows or shrinks with
         whichever menu's content is showing above it in #sideGroups —
         that region absorbs all the leftover vertical space instead (see
         its own flex:1 1 auto), keeping this panel pinned to the same
         spot at the bottom of the sidebar regardless of what's open. */
      flex:0 0 420px;
      margin:0;
      width:auto;max-width:none;height:420px;
      border-left:none;border-right:none;border-bottom:none;border-radius:0;
      border-top:1px solid var(--line);
    }
    .layer-panel.docked.collapsed{display:flex;}
  }
</style>

<body class="no-image">

<header>
  <input type="file" id="fileInput" accept="image/*">
  <div class="header-side header-side-left">
    <span class="header-brand">Photoshot<span>.</span></span>
    <button id="closeBtn" class="iconbtn" disabled type="button" title="닫기" aria-label="닫기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
    </button>
    <button id="menuCancelBtn" class="menu-cancel" type="button">취소</button>
  </div>
  <div class="header-actions">
    <button id="undoBtn" class="iconbtn" disabled type="button" title="실행 취소" aria-label="실행 취소">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
    </button>
    <button id="resetBtn" class="iconbtn" disabled type="button" title="되돌리기" aria-label="되돌리기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
    </button>
    <button id="downloadBtn" class="iconbtn" disabled type="button" title="다운로드" aria-label="다운로드">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
  </div>
  <div class="header-crop-size" id="headerCropSize"></div>
  <div class="header-draw-actions" id="headerDrawActions">
    <button id="drawUndoBtn" class="iconbtn" disabled type="button" title="획 실행 취소" aria-label="획 실행 취소">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
    </button>
    <button id="drawRedoBtn" class="iconbtn" disabled type="button" title="획 다시 실행" aria-label="획 다시 실행">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
    </button>
  </div>
  <div class="header-side header-side-right">
    <button id="menuApplyBtn" class="menu-apply primary" type="button">적용</button>
    <button id="layerToggleBtn" class="iconbtn layer-tab-btn" type="button" title="레이어" aria-label="레이어" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 21 7 12 12 3 7"/><polyline points="3 12 12 17 21 12"/><polyline points="3 17 12 22 21 17"/></svg>
    </button>
  </div>
</header>

<!-- Sits right under the header, spanning the top of the image area — a
     normal-flow bar rather than something floated over the photo itself.
     Shown whenever a selection exists, independent of which menu (if any)
     is open, since 선택 is only one of several menus that can be active. -->
<div class="selection-topbar" id="selectionTopbar" hidden>
  <div class="selection-topbar-toggle">
    <span>선택 영역 표시</span>
    <label class="switch">
      <input type="checkbox" id="showSelOverlay" checked>
      <span class="switch-track"><span class="switch-thumb"></span></span>
    </label>
  </div>
  <button type="button" class="selection-clear-pill" id="clearSelFloatBtn">선택 해제</button>
</div>

<div class="layout">
  <nav class="mobile-tabbar" id="mobileTabBar">
    <button class="tab-btn" type="button" data-target="group-crop" title="크롭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>
      <span>크롭</span>
    </button>
    <button class="tab-btn" type="button" data-target="group-resize" title="리사이즈">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
      <span>리사이즈</span>
    </button>
    <button class="tab-btn" type="button" data-target="group-effects" title="효과">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8z"/></svg>
      <span>효과</span>
    </button>
    <button class="tab-btn" type="button" data-target="group-sc" title="선택색상">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a10 10 0 1 0 0 20c1.4 0 2-1 2-2s-.5-1.4-.5-1.9.5-1.1 1.5-1.1H17a4 4 0 0 0 4-4c0-5.5-4.5-11-9-11z"/><circle cx="7.5" cy="10.5" r="1.1" fill="currentColor" stroke="none"/><circle cx="12" cy="7" r="1.1" fill="currentColor" stroke="none"/><circle cx="16.5" cy="10.5" r="1.1" fill="currentColor" stroke="none"/></svg>
      <span>선택색상</span>
    </button>
    <button class="tab-btn" type="button" data-target="group-levels" title="레벨">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="7" cy="18" r="2"/></svg>
      <span>레벨</span>
    </button>
    <button class="tab-btn" type="button" data-target="group-curve" title="곡선">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V4"/><path d="M4 20h16"/><path d="M4 18c4-1 6-10 16-14"/></svg>
      <span>곡선</span>
    </button>
    <button class="tab-btn" type="button" data-target="group-draw" title="그리기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
      <span>그리기</span>
    </button>
    <button class="tab-btn" type="button" data-target="group-dodgeburn" title="번/닷지">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="20" x2="14" y2="14"/><circle cx="16" cy="8" r="5"/><path d="M16 3 A5 5 0 0 1 16 13 Z" fill="currentColor" stroke="none"/></svg>
      <span>번/닷지</span>
    </button>
    <button class="tab-btn" type="button" data-target="group-selection" title="선택">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" stroke-dasharray="4 3"/></svg>
      <span>선택</span>
    </button>
    <button class="tab-btn" type="button" data-target="group-bgremove" title="배경 제거">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l15 15"/><path d="M20 8v11a1 1 0 0 1-1 1H8"/><path d="M9.5 4.5A2 2 0 0 1 11 4h9a1 1 0 0 1 1 1v9a2 2 0 0 1-.5 1.3"/><path d="M4 8v11a1 1 0 0 0 1 1h11"/></svg>
      <span>배경 제거</span>
    </button>
  </nav>
  <div class="stage-wrap" id="stageWrap">
    <div class="empty-state" id="emptyState">
      <div class="empty-state-glow"></div>
      <div class="empty-state-logo">Photoshot<span>.</span></div>
      <div class="empty-state-spacer"></div>
      <div class="empty-state-bottom">
        <div class="empty-state-cat-row" id="emptyStateCatRow">
          <button type="button" id="urlImportBack" class="url-import-back" hidden aria-label="뒤로">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"></polyline></svg>
            뒤로
          </button>
          <div class="empty-state-cat" id="profileModeCat" role="button" tabindex="0" aria-label="프로필 사진 자동화 모드 전환" title="프로필 사진 자동화 모드">
            <svg width="76" viewBox="0 0 64 34" aria-hidden="true">
              <path d="M8 27 L11.3 10 Q11.5 5.5 16 7.8 L30 17 Z" fill="#f5f4f8"></path>
              <path d="M56 27 L52.7 10 Q52.5 5.5 48 7.8 L34 17 Z" fill="#f5f4f8"></path>
              <path d="M6 34 A26 22 0 0 1 58 34 Z" fill="#f5f4f8"></path>
              <g class="cat-eye cat-eye-l"><circle cx="23" cy="26" r="6.5" fill="#3B82F6"></circle><circle cx="23.6" cy="26.6" r="4.6" fill="#0e0e12"></circle><circle cx="20.4" cy="23.6" r="1.9" fill="#fff"></circle></g>
              <g class="cat-eye cat-eye-r"><circle cx="41" cy="26" r="6.5" fill="#ffd43b"></circle><circle cx="41.6" cy="26.6" r="4.6" fill="#0e0e12"></circle><circle cx="38.4" cy="23.6" r="1.9" fill="#fff"></circle></g>
            </svg>
          </div>
          <div class="profile-mode-label" id="profileModeLabel" hidden aria-hidden="true">프로필 사진 편집 자동화 ON</div>
        </div>
        <div class="empty-state-actions" id="emptyStateActions">
          <button class="primary" type="button" onclick="document.getElementById('fileInput').click()">
            <span class="btn-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="3"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><path d="M21 15l-5-5-9 9"></path></svg></span>
            이미지 선택하기
          </button>
          <button type="button" id="urlImportBtn" class="ghost">
            <span class="btn-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07l-1.5 1.5"></path><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07l1.5-1.5"></path></svg></span>
            링크로 가져오기
          </button>
        </div>
        <!-- Deliberately OUTSIDE #emptyStateActions: that container's own CSS
             restyles every direct <button> child into a big 56px pill (see
             body.no-image .empty-state-actions button), which — being a more
             specific selector than a plain [hidden] attribute rule — would
             force these small buttons visible even while actually hidden. -->
        <div class="auth-row" id="authRow">
          <button type="button" id="authStatusBtn" class="auth-status-btn">로그인</button>
          <button type="button" id="automationSettingsBtn" class="automation-settings-btn" hidden title="자동화 설정" aria-label="자동화 설정">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </div>
        <div class="url-import-form" id="urlImportForm" hidden>
          <div class="url-import-input-wrap">
            <input type="url" id="urlImportInput" placeholder="https://example.com/image.jpg" inputmode="url">
            <button type="button" id="urlImportConfirm" class="url-import-submit" aria-label="가져오기">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"></polyline></svg>
            </button>
          </div>
          <p class="hint" id="urlImportError" hidden></p>
        </div>
      </div>
    </div>
    <div class="canvas-holder" id="canvasHolder" style="display:none;">
      <canvas id="mainCanvas"></canvas>
      <canvas id="overlayCanvas"></canvas>
      <div class="crop-frame" id="cropFrame" hidden>
        <div class="crop-rect" id="cropFrameRect">
          <canvas class="circle-crop-mask" id="circleCropMask" hidden></canvas>
          <div class="crop-gridline v1"></div><div class="crop-gridline v2"></div>
          <div class="crop-gridline h1"></div><div class="crop-gridline h2"></div>
          <div class="crop-handle edge n" data-handle="n"></div>
          <div class="crop-handle edge s" data-handle="s"></div>
          <div class="crop-handle edge e" data-handle="e"></div>
          <div class="crop-handle edge w" data-handle="w"></div>
          <div class="crop-handle corner nw" data-handle="nw"></div>
          <div class="crop-handle corner ne" data-handle="ne"></div>
          <div class="crop-handle corner sw" data-handle="sw"></div>
          <div class="crop-handle corner se" data-handle="se"></div>
        </div>
      </div>
      <div class="crop-autozoom-toggle" id="cropAutoZoomWrap">
        <span>자동 확대</span>
        <label class="switch">
          <input type="checkbox" id="cropAutoZoomToggle" checked>
          <span class="switch-track"><span class="switch-thumb"></span></span>
        </label>
        <span class="crop-autozoom-toggle-group" id="circleCropRow" hidden>
          <span>원형 틀</span>
          <label class="switch">
            <input type="checkbox" id="circleCropToggle">
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </label>
        </span>
      </div>
    </div>
    <div class="layer-panel collapsed" id="layerPanel">
      <div class="layer-panel-header">
        <span id="layerPanelHeaderLabel">레이어</span>
        <button type="button" id="addLayerBtn" class="layer-add-btn" title="새 레이어 추가" aria-label="새 레이어 추가">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <div class="layer-panel-controls" id="layerPanelControls">
        <select id="layerBlendGlobal" title="블렌드 모드" aria-label="블렌드 모드"></select>
        <div class="layer-opacity-global-wrap">
          <input type="range" id="layerOpacityGlobal" min="0" max="100" title="불투명도" aria-label="불투명도">
          <span id="layerOpacityGlobalVal">100%</span>
        </div>
      </div>
      <div class="layer-list" id="layerList"></div>
    </div>
    <div class="layer-ctx-menu" id="layerCtxMenu" hidden>
      <button type="button" class="layer-ctx-item" data-action="rename">이름 변경</button>
      <button type="button" class="layer-ctx-item" data-action="duplicate">복제</button>
      <button type="button" class="layer-ctx-item danger" data-action="delete">삭제</button>
    </div>
  </div>

  <aside id="sidePanel">
   <div id="sideGroups">

    <p class="hint locked-layer-warning" id="lockedLayerWarning" hidden>🔒 활성 레이어가 잠겨 있어 편집이 적용되지 않아요. 레이어 패널에서 잠금을 해제해주세요.</p>

    <details class="group collapsed" id="group-crop" open>
      <summary>크롭</summary>
      <div class="group-body">
        <div class="ratio-row">
          <button class="ratio-btn active" type="button" data-ratio="free">자유</button>
          <button class="ratio-btn" type="button" data-ratio="original">원본 비율</button>
          <button class="ratio-btn" type="button" data-ratio="1:1">정방형</button>
          <button class="ratio-btn" type="button" data-ratio="3:4">3:4</button>
          <button class="ratio-btn" type="button" data-ratio="3:2">3:2</button>
          <button class="ratio-btn" type="button" data-ratio="16:9">16:9</button>
        </div>
        <div class="rotate-wrap">
          <div class="rotate-value" id="rotateValue">0°</div>
          <div class="rotate-ruler" id="rotateRuler">
            <div class="rotate-ruler-track" id="rotateRulerTrack"></div>
            <div class="rotate-ruler-needle"></div>
          </div>
        </div>
      </div>
    </details>

    <details class="group collapsed" id="group-resize" open>
      <summary>리사이즈</summary>
      <div class="group-body">
        <div class="two-col">
          <label class="field"><span class="row"><span>너비(px)</span></span>
            <input type="number" id="resizeW" min="1">
          </label>
          <label class="field"><span class="row"><span>높이(px)</span></span>
            <input type="number" id="resizeH" min="1">
          </label>
        </div>
        <div class="checkline">
          <span>가로세로 비율 고정</span>
          <label class="switch">
            <input type="checkbox" id="lockAspectToggle" checked>
            <span class="switch-track"><span class="switch-thumb"></span></span>
          </label>
        </div>
      </div>
    </details>

    <details class="group collapsed" id="group-effects" open>
      <summary>효과</summary>
      <div class="group-body">
        <div class="effect-grid" id="effectGrid">
          <button type="button" class="effect-tile" data-effect="blur">
            <canvas class="effect-thumb" id="effectThumbBlur"></canvas>
            <span>블러</span>
          </button>
          <button type="button" class="effect-tile" data-effect="noise">
            <canvas class="effect-thumb" id="effectThumbNoise"></canvas>
            <span>노이즈</span>
          </button>
          <button type="button" class="effect-tile" data-effect="bw">
            <canvas class="effect-thumb" id="effectThumbBw"></canvas>
            <span>흑백</span>
          </button>
        </div>

        <div class="effect-detail" id="effectDetailBlur" hidden>
          <button type="button" class="effect-back" data-effect-back>← 목록으로</button>
          <label class="field">
            <span class="row"><span>가우시안 블러</span><span id="blurVal">3</span></span>
            <input type="range" id="blurRange" min="0" max="30" value="2">
          </label>
        </div>

        <div class="effect-detail" id="effectDetailNoise" hidden>
          <button type="button" class="effect-back" data-effect-back>← 목록으로</button>
          <label class="field">
            <span class="row"><span>노이즈 추가</span><span id="noiseVal">12</span></span>
            <input type="range" id="noiseRange" min="0" max="100" value="12">
          </label>
          <div class="checkline">
            <input type="checkbox" id="noiseMono">
            <label for="noiseMono">단색</label>
          </div>
        </div>

        <div class="effect-detail" id="effectDetailBw" hidden>
          <button type="button" class="effect-back" data-effect-back>← 목록으로</button>
          <label class="field">
            <span class="row"><span>흑백 강도</span><span id="bwVal">0</span></span>
            <input type="range" id="bwRange" min="0" max="100" value="0">
          </label>
        </div>
      </div>
    </details>

    <details class="group collapsed" id="group-sc" open>
      <summary>선택색상</summary>
      <div class="group-body">
        <label class="field"><span class="row"><span>색상</span></span>
          <select id="scRange">
            <option value="red">빨강 계열</option>
            <option value="yellow">노랑 계열</option>
            <option value="green">녹색 계열</option>
            <option value="cyan">녹청 계열</option>
            <option value="blue">파랑 계열</option>
            <option value="magenta">마젠타 계열</option>
            <option value="white">흰색 계열</option>
            <option value="neutral">중간 계열</option>
            <option value="black">검정 계열</option>
          </select>
        </label>
        <label class="field">
          <span class="row"><span>녹청(C)</span></span>
          <div class="slider-with-input">

<script>
(function(){
  // Keeps --app-height (see the html,body rule) tracking the actual
  // visible viewport rather than the layout viewport, so a mobile on-
  // screen keyboard opening shrinks this fixed-height layout to fit above
  // it instead of leaving the page to scroll to reach the focused input.
  function setAppHeight(){
    const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--app-height', h+'px');
    // A focused input can make the browser scroll the page itself to bring
    // it into view before this handler even runs (independent of any CSS
    // overflow rule) — since the layout already resizes to fit above the
    // keyboard, that scroll is never actually needed, so cancel it too.
    window.scrollTo(0,0);
  }
  setAppHeight();
  window.addEventListener('resize', setAppHeight);
  if(window.visualViewport) window.visualViewport.addEventListener('resize', setAppHeight);
  window.addEventListener('scroll', ()=>{ if(window.scrollY!==0 || window.scrollX!==0) window.scrollTo(0,0); }, {passive:true});

  const fileInput = document.getElementById('fileInput');
  const stageWrap = document.getElementById('stageWrap');
  const emptyState = document.getElementById('emptyState');
  const canvasHolder = document.getElementById('canvasHolder');
  const sidePanel = document.getElementById('sidePanel');
  const sideGroups = document.getElementById('sideGroups');
  const mainCanvas = document.getElementById('mainCanvas');
  const overlayCanvas = document.getElementById('overlayCanvas');
  const ctx = mainCanvas.getContext('2d', {willReadFrequently:true});
  const octx = overlayCanvas.getContext('2d');
  const dimsInfo = document.getElementById('dimsInfo');
  const downloadBtn = document.getElementById('downloadBtn');
  const undoBtn = document.getElementById('undoBtn');
  const resetBtn = document.getElementById('resetBtn');
  const closeBtn = document.getElementById('closeBtn');
  const mobileTabBar = document.getElementById('mobileTabBar');
  const menuCancelBtn = document.getElementById('menuCancelBtn');
  const menuApplyBtn = document.getElementById('menuApplyBtn');
  const headerCropSize = document.getElementById('headerCropSize');
  const layerToggleBtn = document.getElementById('layerToggleBtn');
  const layerPanel = document.getElementById('layerPanel');
  const layerList = document.getElementById('layerList');

  // ---------- Desktop layout: layer panel docked in the sidebar ----------
  // Same breakpoint as the mobile stylesheet (max-width:860px) so the two
  // never disagree about which layout is active.
  const desktopMedia = window.matchMedia('(min-width: 861px)');
  function isDesktopLayout(){ return desktopMedia.matches; }
  // On desktop the layer panel lives permanently at the bottom of the right
  // sidebar (Photoshop-style) instead of behind the header's floating
  // toggle button; on mobile it stays exactly where it always was. The same
  // DOM node moves between the two spots rather than duplicating the
  // panel/list markup. Appended directly to stageWrap (rather than anchored
  // next to layerToggleBtn) since the toggle button itself now lives in the
  // header, a different container than the panel's own positioned ancestor.
  function syncLayerPanelDock(){
    if(isDesktopLayout()){
      if(layerPanel.parentElement!==sidePanel) sidePanel.appendChild(layerPanel);
      layerPanel.classList.add('docked');
      layerPanel.classList.remove('collapsed');
    } else {
      if(layerPanel.parentElement!==stageWrap) stageWrap.appendChild(layerPanel);
      layerPanel.classList.remove('docked');
      // Desktop always force-removes 'collapsed' above (permanently visible,
      // docked) — switching back to mobile mid-session must restore it,
      // otherwise the panel would appear stuck open with no way to close it
      // (the mobile toggle button only ever removes 'collapsed', never adds
      // it back on its own) and, worse, would still show on the still-empty
      // no-image screen since nothing else on mobile guards a plain
      // uncollapsed layer panel.
      layerPanel.classList.add('collapsed');
    }
  }
  syncLayerPanelDock();
  desktopMedia.addEventListener('change', syncLayerPanelDock);

  function updateHistoryButtons(){
    undoBtn.disabled = undoStack.length===0;
    resetBtn.disabled = redoStack.length===0;
  }

  const MAX_DIM = 1400;

  // mask canvas (detached, alpha channel = selection strength 0..255) — the
  // selection is a single document-wide mask shared by every layer, not
  // per-layer data.
  const maskCanvas = document.createElement('canvas');
  const mctx = maskCanvas.getContext('2d', {willReadFrequently:true});
  let hasSelection = false;

  // 배경 제거's own "keep" mask (255=keep, 0=removed) — separate from the
  // shared selection mask above, scoped to a single 배경 제거 session.
  const bgMaskCanvas = document.createElement('canvas');
  const bgMaskCtx = bgMaskCanvas.getContext('2d', {willReadFrequently:true});

  let currentTool = 'none';
  let undoStack = [];
  let redoStack = [];

  let editingSnapshot = null; // full-document snapshot taken before a live-preview edit begins

  // ---------- Layers ----------
  // Each layer owns its own full-size offscreen canvas; mainCanvas holds only
  // the composited result and is never drawn into directly except by
  // compositeLayers(). Layer order in the array is bottom-to-top.
  let layers = [];
  let activeLayerId = null;
  let nextLayerId = 1;

  // Photoshop-style blend modes mapped to their native canvas equivalents
  // (identical algorithms for every mode here, so no per-pixel JS blending
  // is needed — the browser composites them directly).
  const BLEND_MODES = [
    ['normal','표준'],
    ['darken','어둡게 하기'],
    ['multiply','곱하기'],
    ['color-burn','색상 번'],
    ['linear-burn','선형 번'],
    ['lighten','밝게 하기'],
    ['screen','스크린'],
    ['color-dodge','색상 닷지'],
    ['lighter','선형 닷지(추가)'],
    ['overlay','오버레이'],
    ['soft-light','소프트 라이트'],
    ['hard-light','하드 라이트'],
    ['difference','차이'],
    ['exclusion','제외'],
    ['hue','색조'],
    ['saturation','채도'],
    ['color','색상'],
    ['luminosity','광도']
  ];

  function makeLayerCanvas(w,h){
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    return { canvas, ctx: canvas.getContext('2d', {willReadFrequently:true}) };
  }
  function createLayer(name, w, h){
    const {canvas, ctx:lctx} = makeLayerCanvas(w,h);
    return { id: nextLayerId++, name, canvas, ctx: lctx, visible:true, locked:false, opacity:1, blendMode:'normal',
      adjustmentType:null, adjustmentParams:null, adjustmentSourceLayerId:null, adjustmentMaskThumb:null };
  }
  // Creates a layer at (w,h) copying id/name/visible/locked/opacity/blendMode
  // from a snapshot entry, but leaves its canvas blank — for callers that are
  // about to draw scaled/rotated/cropped content into it themselves.
  function layerShellFromSnapshot(ls, w, h){
    const {canvas, ctx:lctx} = makeLayerCanvas(w,h);
    return { id: ls.id, name: ls.name, canvas, ctx: lctx, visible: ls.visible, locked: ls.locked, opacity: ls.opacity, blendMode: ls.blendMode||'normal',
      adjustmentType: ls.adjustmentType||null, adjustmentParams: ls.adjustmentParams||null, adjustmentSourceLayerId: ls.adjustmentSourceLayerId||null,
      adjustmentMaskThumb: ls.adjustmentMaskThumb||null };

  function setCanvasSize(w,h){
    const dimsChanged = (mainCanvas.width!==w || mainCanvas.height!==h);
    mainCanvas.width = w; mainCanvas.height = h;
    overlayCanvas.width = w; overlayCanvas.height = h;
    maskCanvas.width = w; maskCanvas.height = h;
    mctx.clearRect(0,0,w,h);
    // Only auto-fit on a real dimension change (e.g. rotation growing the bounding
    // box) when the user hasn't manually zoomed — otherwise a pinch-zoom running
    // together with a pinch-rotate would have its scale stomped back to auto-fit
    // on every frame the rotation also changes the canvas size.
    if(dimsChanged && !userZoomed) fitToScreen(); else applyCanvasDisplaySize();

  // ---------- Zoom (fit-to-screen + pinch) ----------
  // The canvas's own width/height attributes (the pixel buffer) never change here,
  // only their CSS display size — so the underlying image data stays full quality.
  let viewScale = 1;
  let userZoomed = false;
  const MIN_ZOOM = 0.15, MAX_ZOOM = 8;

  function stageAvailSize(){
    const cs = getComputedStyle(stageWrap);
    const padX = parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight);
    const padY = parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
    return {
      w: Math.max(50, stageWrap.clientWidth-padX),
      h: Math.max(50, stageWrap.clientHeight-padY)
    };
  }

  function computeFitScale(){
    if(!mainCanvas.width || !mainCanvas.height) return 1;
    const {w:availW, h:availH} = stageAvailSize();
    return Math.min(1, availW/mainCanvas.width, availH/mainCanvas.height);
  }

  // Two-finger panning (outside crop mode) offsets the image from center via a
  // CSS transform — panOffset is in CSS px and clamped so the image can't be
  // dragged entirely out of view.
  let panOffsetX = 0, panOffsetY = 0;
  function clampPanOffset(){
    const avail = stageAvailSize();
    const dispW = mainCanvas.width*viewScale, dispH = mainCanvas.height*viewScale;
    const maxX = Math.max(0, (dispW-avail.w)/2), maxY = Math.max(0, (dispH-avail.h)/2);
    panOffsetX = Math.max(-maxX, Math.min(maxX, panOffsetX));
    panOffsetY = Math.max(-maxY, Math.min(maxY, panOffsetY));
  }

  // While the crop menu is active, the canvas's on-screen position/size is driven
  // entirely by the crop pan/zoom state (see renderCropFrame), not by viewScale —
  // otherwise a rotation-triggered dimension change during crop editing would
  // stomp the crop-specific zoom back to a plain fit-to-screen.
  function applyCanvasDisplaySize(){
    if(cropModeActive){ renderCropFrame(); return; }
    const w = Math.round(mainCanvas.width*viewScale);
    const h = Math.round(mainCanvas.height*viewScale);
    mainCanvas.style.width = w+'px';
    mainCanvas.style.height = h+'px';
    overlayCanvas.style.width = w+'px';
    overlayCanvas.style.height = h+'px';
    const t = `translate(${panOffsetX}px, ${panOffsetY}px)`;
    mainCanvas.style.transform = t;
    overlayCanvas.style.transform = t;
  }

  function fitToScreen(){
    viewScale = computeFitScale();
    userZoomed = false;
    panOffsetX = 0; panOffsetY = 0;
    applyCanvasDisplaySize();
  }

  function setViewScale(s){
    viewScale = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, s));
    userZoomed = true;
    clampPanOffset();
    applyCanvasDisplaySize();
  }

  // ---------- Mouse wheel zoom (PC): zooms toward the cursor, in both the
  // normal view and while the 크롭 frame is active. ----------
  function zoomAt(clientX, clientY, factor){
    if(!mainCanvas.width || !mainCanvas.height) return;
    if(cropModeActive){
      const rectOld = mainCanvas.getBoundingClientRect();
      const oldScale = imgScale;
      const imgX = (clientX-rectOld.left)/oldScale, imgY = (clientY-rectOld.top)/oldScale;
      imgScale = clampImgScale(oldScale*factor);
      renderCropFrame();
      const rectNew = mainCanvas.getBoundingClientRect();
      imgOffsetX += clientX - (rectNew.left + imgX*imgScale);
      imgOffsetY += clientY - (rectNew.top + imgY*imgScale);
      clampImgOffset();
      renderCropFrame();
    } else {
      const rectOld = mainCanvas.getBoundingClientRect();
      const oldScale = viewScale;
      const imgX = (clientX-rectOld.left)/oldScale, imgY = (clientY-rectOld.top)/oldScale;
      viewScale = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, oldScale*factor));
      userZoomed = true;
      applyCanvasDisplaySize();
      const rectNew = mainCanvas.getBoundingClientRect();
      panOffsetX += clientX - (rectNew.left + imgX*viewScale);
      panOffsetY += clientY - (rectNew.top + imgY*viewScale);
      clampPanOffset();
      applyCanvasDisplaySize();
    }
  }
  stageWrap.addEventListener('wheel', e=>{
    if(!mainCanvas.width || !mainCanvas.height) return;
    e.preventDefault();

  // resize, but also opening/closing/switching a mobile control panel, since those
  // now push the image area rather than floating over it (so its available height
  // varies by menu and the image should always fill whatever room is left).
  new ResizeObserver(()=>{
    if(cropModeActive){
      const avail = stageAvailSize();

      canvasHolder.style.width = cropViewportW+'px';
      canvasHolder.style.height = cropViewportH+'px';
      frameW = Math.min(frameW, cropViewportW);
      frameH = Math.min(frameH, cropViewportH);
      imgScale = clampImgScale(imgScale);
      clampImgOffset();
      renderCropFrame();
    } else if(!userZoomed){
      fitToScreen();
    } else {
      clampPanOffset();
      applyCanvasDisplaySize();
    }
  }).observe(stageWrap);

  function finishImageLoad(img){

    const baseLayer = createLayer('배경', w, h);

    let parsed;
    try{ parsed = new URL(raw); }catch(err){ showUrlImportError('올바른 URL 형식이 아니에요.'); return; }
    if(parsed.protocol!=='http:' && parsed.protocol!=='https:'){
      showUrlImportError('http/https URL만 지원해요.');

    const img = new Image();

    // If the remote server doesn't send CORS headers, the load itself fails

  // ---------- Undo ----------
  // A snapshot captures the WHOLE document: every layer's pixels plus its

  function snapshotState(){

        id:l.id, name:l.name, visible:l.visible, locked:l.locked, opacity:l.opacity, blendMode:l.blendMode,
        adjustmentType: l.adjustmentType||null,

        adjustmentSourceLayerId: l.adjustmentSourceLayerId||null,
        // A small, fixed-size, never-repainted canvas — safe to share by
        // reference across snapshots instead of cloning like the pixel data.
        adjustmentMaskThumb: l.adjustmentMaskThumb||null,
        img: l.ctx.getImageData(0,0,mainCanvas.width,mainCanvas.height)

      activeLayerId,
      mask: mctx.getImageData(0,0,mainCanvas.width,mainCanvas.height),

  function pushUndo(preState){
    undoStack.push(preState);
    if(undoStack.length>15) undoStack.shift();

    // redo stack no longer leads anywhere, so it can't be replayed.
    redoStack = [];
    updateHistoryButtons();

    // single choke point for keeping the local backup current.
    scheduleProjectSave();
  }
  function restoreState(s){
    setCanvasSize(s.w,s.h);
    layers = s.layers.map(ls => layerFromSnapshot(ls, s.w, s.h));
    activeLayerId = s.activeLayerId;
    mctx.putImageData(s.mask,0,0);
    hasSelection = s.hasSelection;
    maskVersion++;
    updateDims();
    compositeLayers();
    renderSelectionOverlay();
    renderLayerPanel();

  // state on redoStack so 되돌리기 can bring it back; redo does the reverse.
  undoBtn.addEventListener('click', ()=>{
    if(undoStack.length===0) return;
    const s = undoStack.pop();
    redoStack.push(snapshotState());
    restoreState(s);
