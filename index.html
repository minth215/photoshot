<script>
(function(){
  const fileInput = document.getElementById('fileInput');
  const stageWrap = document.getElementById('stageWrap');
  const emptyState = document.getElementById('emptyState');
  const canvasHolder = document.getElementById('canvasHolder');
  const sidePanel = document.getElementById('sidePanel');
  const mainCanvas = document.getElementById('mainCanvas');
  const overlayCanvas = document.getElementById('overlayCanvas');
  const ctx = mainCanvas.getContext('2d', {willReadFrequently:true});
  const octx = overlayCanvas.getContext('2d');
  const dimsInfo = document.getElementById('dimsInfo');
  const downloadBtn = document.getElementById('downloadBtn');
  const undoBtn = document.getElementById('undoBtn');
  const resetBtn = document.getElementById('resetBtn');
  const closeBtn = document.getElementById('closeBtn');
  const mobileTabBar = document.getElementById('mobileTabBar');
  const menuCancelBtn = document.getElementById('menuCancelBtn');
  const menuApplyBtn = document.getElementById('menuApplyBtn');
  const headerCropSize = document.getElementById('headerCropSize');
  const layerToggleBtn = document.getElementById('layerToggleBtn');
  const layerPanel = document.getElementById('layerPanel');
  const layerList = document.getElementById('layerList');

  function updateHistoryButtons(){
    undoBtn.disabled = undoStack.length===0;
    resetBtn.disabled = redoStack.length===0;
  }

  const MAX_DIM = 1400;

  // mask canvas (detached, alpha channel = selection strength 0..255) — the
  // selection is a single document-wide mask shared by every layer, not
  // per-layer data.
  const maskCanvas = document.createElement('canvas');
  const mctx = maskCanvas.getContext('2d', {willReadFrequently:true});
  let hasSelection = false;

  let currentTool = 'none';
  let undoStack = [];
  let redoStack = [];

  let editingSnapshot = null; // full-document snapshot taken before a live-preview edit begins

  // ---------- Layers ----------
  // Each layer owns its own full-size offscreen canvas; mainCanvas holds only
  // the composited result and is never drawn into directly except by
  // compositeLayers(). Layer order in the array is bottom-to-top.
  let layers = [];
  let activeLayerId = null;
  let nextLayerId = 1;

  function makeLayerCanvas(w,h){
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    return { canvas, ctx: canvas.getContext('2d', {willReadFrequently:true}) };
  }
  function createLayer(name, w, h){
    const {canvas, ctx:lctx} = makeLayerCanvas(w,h);
    return { id: nextLayerId++, name, canvas, ctx: lctx, visible:true, locked:false, opacity:1 };
  }
  // Creates a layer at (w,h) copying id/name/visible/locked/opacity from a
  // snapshot entry, but leaves its canvas blank — for callers that are about
  // to draw scaled/rotated/cropped content into it themselves.
  function layerShellFromSnapshot(ls, w, h){
    const {canvas, ctx:lctx} = makeLayerCanvas(w,h);
    return { id: ls.id, name: ls.name, canvas, ctx: lctx, visible: ls.visible, locked: ls.locked, opacity: ls.opacity };
  }
  function layerFromSnapshot(ls, w, h){
    const layer = layerShellFromSnapshot(ls, w, h);
    layer.ctx.putImageData(ls.img, 0, 0);
    return layer;
  }
  function activeLayer(){
    return layers.find(l => l.id===activeLayerId) || layers[layers.length-1] || null;
  }
  function compositeLayers(){
    ctx.clearRect(0,0,mainCanvas.width,mainCanvas.height);
    layers.forEach(l=>{
      if(!l.visible) return;
      ctx.globalAlpha = l.opacity;
      ctx.drawImage(l.canvas,0,0);
    });
    ctx.globalAlpha = 1;
  }
  function selectLayer(id){
    if(id===activeLayerId) return;
    activeLayerId = id;
    renderLayerPanel();
  }
  function svgEye(open){
    return open
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.6 21.6 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 5c7 0 11 7 11 7a21.6 21.6 0 0 1-2.68 3.9M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  }
  function svgLock(locked){
    return locked
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.5-2.2"/></svg>';
  }
  // Press-and-hold (not a quick tap) on a layer row starts a drag that
  // reorders layers by z-index as the row crosses its neighbors.
  function attachLayerDrag(row, layer){
    const HOLD_MS = 260, MOVE_CANCEL_PX = 8;
    let holdTimer = null, dragging = false, startY = 0, preDragSnapshot = null;
    function onDown(e){
      if(e.target.closest('.layer-icon-btn,.layer-opacity-row')) return;
      startY = e.clientY;
      holdTimer = setTimeout(()=>{
        holdTimer = null;
        dragging = true;
        preDragSnapshot = snapshotState();
        row.classList.add('dragging');
        try{ row.setPointerCapture(e.pointerId); }catch(err){}
      }, HOLD_MS);
    }
    function onMove(e){
      if(dragging){
        const rows = [...layerList.querySelectorAll('.layer-row')];
        const idx = rows.indexOf(row);
        const y = e.clientY;
        for(let i=0;i<rows.length;i++){
          if(rows[i]===row) continue;
          const r = rows[i].getBoundingClientRect();
          const mid = r.top + r.height/2;
          if((i<idx && y<mid) || (i>idx && y>mid)){
            layerList.insertBefore(row, i<idx ? rows[i] : rows[i].nextSibling);
            const newTopToBottomIds = [...layerList.querySelectorAll('.layer-row')].map(r2=>parseInt(r2.dataset.layerId,10));
            const idToLayer = new Map(layers.map(l=>[l.id,l]));
            layers = newTopToBottomIds.slice().reverse().map(id=>idToLayer.get(id));
            compositeLayers();
            break;
          }
        }
        return;
      }
      if(holdTimer && Math.abs(e.clientY-startY) > MOVE_CANCEL_PX){
        clearTimeout(holdTimer); holdTimer=null;
      }
    }
    function onUp(e){
      if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; }
      if(dragging){
        dragging = false;
        if(preDragSnapshot) pushUndo(preDragSnapshot);
        preDragSnapshot = null;
        renderLayerPanel();
      }
    }
    row.addEventListener('pointerdown', onDown);
    row.addEventListener('pointermove', onMove);
    row.addEventListener('pointerup', onUp);
    row.addEventListener('pointercancel', onUp);
  }
  function renderLayerPanel(){
    layerList.innerHTML = '';
    // Top of the visual list = top of the stack, i.e. reverse of storage order.
    for(let i=layers.length-1; i>=0; i--){
      const layer = layers[i];
      const row = document.createElement('div');
      row.className = 'layer-row' + (layer.id===activeLayerId ? ' selected' : '');
      row.dataset.layerId = layer.id;
      row.innerHTML =
        '<canvas class="layer-thumb"></canvas>' +
        '<span class="layer-name"></span>' +
        '<button type="button" class="layer-icon-btn layer-eye" title="표시/숨기기" aria-label="표시/숨기기"></button>' +
        '<button type="button" class="layer-icon-btn layer-lock" title="잠금" aria-label="잠금"></button>' +
        '<div class="layer-opacity-row"><input type="range" class="layer-opacity" min="0" max="100"><span class="layer-opacity-val"></span></div>';
      row.querySelector('.layer-name').textContent = layer.name;
      const eyeBtn = row.querySelector('.layer-eye');
      eyeBtn.innerHTML = svgEye(layer.visible);
      eyeBtn.classList.toggle('off', !layer.visible);
      const lockBtn = row.querySelector('.layer-lock');
      lockBtn.innerHTML = svgLock(layer.locked);
      lockBtn.classList.toggle('on', layer.locked);
      const opacityInput = row.querySelector('.layer-opacity');
      opacityInput.value = Math.round(layer.opacity*100);
      row.querySelector('.layer-opacity-val').textContent = Math.round(layer.opacity*100)+'%';
      layerList.appendChild(row);

      const thumb = row.querySelector('.layer-thumb');
      thumb.width = 28; thumb.height = 28;
      const tctx = thumb.getContext('2d');
      tctx.fillStyle = '#000'; tctx.fillRect(0,0,28,28);
      if(layer.canvas.width && layer.canvas.height) tctx.drawImage(layer.canvas,0,0,28,28);

      row.addEventListener('click', e=>{
        if(e.target.closest('.layer-icon-btn,.layer-opacity-row')) return;
        selectLayer(layer.id);
      });
      eyeBtn.addEventListener('click', e=>{
        e.stopPropagation();
        pushUndo(snapshotState());
        layer.visible = !layer.visible;
        compositeLayers();
        renderLayerPanel();
      });
      lockBtn.addEventListener('click', e=>{
        e.stopPropagation();
        pushUndo(snapshotState());
        layer.locked = !layer.locked;
        renderLayerPanel();
      });
      let opacityPreDrag = null;
      opacityInput.addEventListener('pointerdown', e=>{ e.stopPropagation(); opacityPreDrag = snapshotState(); });
      opacityInput.addEventListener('input', ()=>{
        layer.opacity = parseInt(opacityInput.value,10)/100;
        row.querySelector('.layer-opacity-val').textContent = opacityInput.value+'%';
        compositeLayers();
      });
      opacityInput.addEventListener('change', ()=>{
        if(opacityPreDrag){ pushUndo(opacityPreDrag); opacityPreDrag=null; }
      });
      attachLayerDrag(row, layer);
    }
  }
  layerToggleBtn.addEventListener('click', ()=>{
    layerPanel.classList.toggle('collapsed');
    layerToggleBtn.classList.toggle('active', !layerPanel.classList.contains('collapsed'));
  });

  function setCanvasSize(w,h){
    const dimsChanged = (mainCanvas.width!==w || mainCanvas.height!==h);
    mainCanvas.width = w; mainCanvas.height = h;
    overlayCanvas.width = w; overlayCanvas.height = h;
    maskCanvas.width = w; maskCanvas.height = h;
    mctx.clearRect(0,0,w,h);
    // Only auto-fit on a real dimension change (e.g. rotation growing the bounding
    // box) when the user hasn't manually zoomed — otherwise a pinch-zoom running
    // together with a pinch-rotate would have its scale stomped back to auto-fit
    // on every frame the rotation also changes the canvas size.
    if(dimsChanged && !userZoomed) fitToScreen(); else applyCanvasDisplaySize();
  }

  function updateDims(){
    dimsInfo.textContent = mainCanvas.width + ' × ' + mainCanvas.height + ' px';
  }

  // ---------- Zoom (fit-to-screen + pinch) ----------
  // The canvas's own width/height attributes (the pixel buffer) never change here,
  // only their CSS display size — so the underlying image data stays full quality.
  let viewScale = 1;
  let userZoomed = false;
  const MIN_ZOOM = 0.15, MAX_ZOOM = 8;

  function stageAvailSize(){
    const cs = getComputedStyle(stageWrap);
    const padX = parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight);
    const padY = parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
    return {
      w: Math.max(50, stageWrap.clientWidth-padX),
      h: Math.max(50, stageWrap.clientHeight-padY)
    };
  }

  function computeFitScale(){
    if(!mainCanvas.width || !mainCanvas.height) return 1;
    const {w:availW, h:availH} = stageAvailSize();
    return Math.min(1, availW/mainCanvas.width, availH/mainCanvas.height);
  }

  // While the crop menu is active, the canvas's on-screen position/size is driven
  // entirely by the crop pan/zoom state (see renderCropFrame), not by viewScale —
  // otherwise a rotation-triggered dimension change during crop editing would
  // stomp the crop-specific zoom back to a plain fit-to-screen.
  function applyCanvasDisplaySize(){
    if(cropModeActive){ renderCropFrame(); return; }
    const w = Math.round(mainCanvas.width*viewScale);
    const h = Math.round(mainCanvas.height*viewScale);
    mainCanvas.style.width = w+'px';
    mainCanvas.style.height = h+'px';
    overlayCanvas.style.width = w+'px';
    overlayCanvas.style.height = h+'px';
  }

  function fitToScreen(){
    viewScale = computeFitScale();
    userZoomed = false;
    applyCanvasDisplaySize();
  }

  function setViewScale(s){
    viewScale = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, s));
    userZoomed = true;
    applyCanvasDisplaySize();
  }

  // Re-fit whenever the visible image area's actual box size changes — a window
  // resize, but also opening/closing/switching a mobile control panel, since those
  // now push the image area rather than floating over it (so its available height
  // varies by menu and the image should always fill whatever room is left).
  new ResizeObserver(()=>{
    if(cropModeActive){
      const avail = stageAvailSize();
      cropViewportW = avail.w; cropViewportH = avail.h;
      canvasHolder.style.width = cropViewportW+'px';
      canvasHolder.style.height = cropViewportH+'px';
      frameW = Math.min(frameW, cropViewportW);
      frameH = Math.min(frameH, cropViewportH);
      imgScale = clampImgScale(imgScale);
      clampImgOffset();
      renderCropFrame();
    } else if(!userZoomed){
      fitToScreen();
    }
  }).observe(stageWrap);

  // ---------- File loading ----------
  fileInput.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      let w = img.naturalWidth, h = img.naturalHeight;
      const scale = Math.min(1, MAX_DIM / Math.max(w,h));
      w = Math.round(w*scale); h = Math.round(h*scale);
      setCanvasSize(w,h);
      nextLayerId = 1;
      const baseLayer = createLayer('배경', w, h);
      baseLayer.ctx.drawImage(img,0,0,w,h);
      layers = [baseLayer];
      activeLayerId = baseLayer.id;
      hasSelection = false;
      undoStack = [];
      redoStack = [];
      emptyState.style.display='none';
      canvasHolder.style.display='block';
      sidePanel.style.display='block';
      layerToggleBtn.style.display='flex';
      updateHistoryButtons();
      syncResizeInputs();
      updateDims();
      compositeLayers();
      renderSelectionOverlay();
      renderLayerPanel();
      URL.revokeObjectURL(url);
      setTool('none');
      downloadBtn.disabled=false;
      closeBtn.disabled=false;
    };
    img.src = url;
  });

  // ---------- Undo ----------
  // A snapshot captures the WHOLE document: every layer's pixels plus its
  // visibility/lock/opacity/order, the active layer, and the shared selection
  // mask — since any of these (not just pixel edits) can be undone.
  function snapshotState(){
    return {
      w: mainCanvas.width, h: mainCanvas.height,
      layers: layers.map(l => ({
        id:l.id, name:l.name, visible:l.visible, locked:l.locked, opacity:l.opacity,
        img: l.ctx.getImageData(0,0,mainCanvas.width,mainCanvas.height)
      })),
      activeLayerId,
      mask: mctx.getImageData(0,0,mainCanvas.width,mainCanvas.height),
      hasSelection
    };
  }
  function pushUndo(preState){
    undoStack.push(preState);
    if(undoStack.length>15) undoStack.shift();
    // A fresh edit branches off from wherever we are — whatever was in the
    // redo stack no longer leads anywhere, so it can't be replayed.
    redoStack = [];
    updateHistoryButtons();
  }
  function restoreState(s){
    setCanvasSize(s.w,s.h);
    layers = s.layers.map(ls => layerFromSnapshot(ls, s.w, s.h));
    activeLayerId = s.activeLayerId;
    mctx.putImageData(s.mask,0,0);
    hasSelection = s.hasSelection;
    updateDims();
    compositeLayers();
    renderSelectionOverlay();
    renderLayerPanel();
  }
  // 실행 취소 (undo) and 되돌리기 (redo) walk the same history in opposite
  // directions: undo pops the last state off undoStack and parks the current
  // state on redoStack so 되돌리기 can bring it back; redo does the reverse.
  undoBtn.addEventListener('click', ()=>{
    if(undoStack.length===0) return;
    const s = undoStack.pop();
    redoStack.push(snapshotState());
    restoreState(s);
    updateHistoryButtons();
  });
  resetBtn.addEventListener('click', ()=>{
    if(redoStack.length===0) return;
    const s = redoStack.pop();
    undoStack.push(snapshotState());
    restoreState(s);
    updateHistoryButtons();
  });

  // ---------- Close / discard ----------
  function resetToEmptyState(){
    canvasHolder.style.display='none';
    sidePanel.style.display='none';
    emptyState.style.display='';
    setCanvasSize(0,0);
    mainCanvas.style.width=''; mainCanvas.style.height='';
    overlayCanvas.style.width=''; overlayCanvas.style.height='';
    hasSelection=false;
    undoStack=[];
    redoStack=[];
    editingSnapshot=null;
    layers=[]; activeLayerId=null; drawLayerForSession=null;
    layerPanel.classList.add('collapsed');
    layerToggleBtn.classList.remove('active');
    layerToggleBtn.style.display='none';
    layerList.innerHTML='';
    viewScale=1; userZoomed=false;
    lassoPoints=[]; dragStart=null; brushDrawing=false;
    setTool('none');
    cropFrame.hidden=true;
    cropModeActive=false;
    canvasHolder.classList.remove('crop-mode');
    canvasHolder.style.width=''; canvasHolder.style.height='';
    mainCanvas.style.left=''; mainCanvas.style.top='';
    overlayCanvas.style.display='';
    cropRatio=null; cropRotationDeg=0;
    frameW=0; frameH=0; imgScale=1; imgOffsetX=0; imgOffsetY=0;
    document.querySelectorAll('.ratio-btn').forEach(b=> b.classList.toggle('active', b.dataset.ratio==='free'));
    updateRulerUI();
    lockAspectOn = true;
    lockAspectToggle.classList.add('active');
    lockAspectToggle.setAttribute('aria-pressed','true');
    updateHistoryButtons();
    downloadBtn.disabled=true;
    closeBtn.disabled=true;
    dimsInfo.textContent='이미지 없음';
    fileInput.value='';
    blurRange.value=0; noiseRange.value=0;
    document.getElementById('blurVal').textContent='0';
    document.getElementById('noiseVal').textContent='0';
    resetSCInputs();
    resetLevelsInputs();
    curvePoints=[[0,0],[255,255]];
    drawCurveEditor();
    if(mobileTabBar){
      mobileTabBar.querySelectorAll('.tab-btn.active').forEach(b=>b.classList.remove('active'));
      sidePanel.querySelectorAll(':scope > .mobile-active').forEach(el=>el.classList.remove('mobile-active'));
    }
    activeMenuId = null;
    document.body.classList.remove('editing-mode');
    document.body.classList.remove('crop-editing');
    document.querySelectorAll('aside#sidePanel > .group').forEach(g=> g.classList.add('collapsed'));
  }
  closeBtn.addEventListener('click', ()=>{
    if(window.confirm('진행 상황은 저장되지 않습니다. 새 작업을 시작할까요?')){
      resetToEmptyState();
    }
  });

  // ---------- Tools ----------
  const toolButtons = document.querySelectorAll('[data-tool]');
  toolButtons.forEach(b=>{
    b.addEventListener('click', ()=> setTool(b.dataset.tool));
  });
  function setTool(t){
    currentTool = t;
    toolButtons.forEach(b=> b.classList.toggle('active', b.dataset.tool===t));
    document.getElementById('brushSizeWrap').style.display = (t==='brush-add'||t==='brush-sub') ? 'flex':'none';
    document.getElementById('brushHardnessWrap').style.display = (t==='brush-add'||t==='brush-sub') ? 'flex':'none';
    overlayCanvas.style.cursor = t==='none' ? 'default' : 'crosshair';
    renderSelectionOverlay();
  }

  function ensureMaskInitialized(){
    if(!hasSelection){
      mctx.save();
      mctx.globalCompositeOperation='source-over';
      mctx.fillStyle='white';
      mctx.fillRect(0,0,maskCanvas.width,maskCanvas.height);
      mctx.restore();
      hasSelection = true;
    }
  }

  // ---------- Selection overlay rendering ----------
  const showSelOverlayChk = document.getElementById('showSelOverlay');
  function renderSelectionOverlay(){
    const w=overlayCanvas.width, h=overlayCanvas.height;
    octx.clearRect(0,0,w,h);
    if(hasSelection && showSelOverlayChk.checked){
      const maskData = mctx.getImageData(0,0,w,h).data;
      const out = octx.createImageData(w,h);
      for(let i=0;i<maskData.length;i+=4){
        const a = maskData[i+3];
        const tintAlpha = (255-a) * 0.38;
        out.data[i]=10; out.data[i+1]=120; out.data[i+2]=255; out.data[i+3]=tintAlpha;
      }
      octx.putImageData(out,0,0);
    }
    if(lassoPoints.length>1){
      octx.strokeStyle='#4fd1c5'; octx.lineWidth=1.5;
      octx.beginPath();
      octx.moveTo(lassoPoints[0][0], lassoPoints[0][1]);
      for(let p of lassoPoints) octx.lineTo(p[0],p[1]);
      octx.stroke();
    }
  }
  showSelOverlayChk.addEventListener('change', renderSelectionOverlay);
  // Selection actions no longer push their own undo step: opening 선택 영역
  // already began a session (beginEdit), and every edit made while it's open —
  // however many brush strokes, invert/clear clicks, feather adjustments — bundles
  // into one undo checkpoint when the header's 적용 is pressed.
  document.getElementById('invertSelBtn').addEventListener('click', ()=>{
    beginEdit();
    sessionDirty = true;
    ensureMaskInitialized();
    const w=maskCanvas.width,h=maskCanvas.height;
    const id = mctx.getImageData(0,0,w,h);
    for(let i=3;i<id.data.length;i+=4) id.data[i] = 255-id.data[i];
    mctx.putImageData(id,0,0);
    renderSelectionOverlay();
  });
  document.getElementById('clearSelBtn').addEventListener('click', ()=>{
    beginEdit();
    sessionDirty = true;
    mctx.clearRect(0,0,maskCanvas.width,maskCanvas.height);
    hasSelection=false;
    renderSelectionOverlay();
  });

  // feather (live preview against the mask as it was when the drag started)
  const featherRange = document.getElementById('featherRange');
  let featherBaseMask = null;
  featherRange.addEventListener('pointerdown', ()=>{
    beginEdit();
    ensureMaskInitialized();
    featherBaseMask = mctx.getImageData(0,0,maskCanvas.width,maskCanvas.height);
  });
  featherRange.addEventListener('input', ()=>{
    document.getElementById('featherVal').textContent = featherRange.value;
    if(!featherBaseMask) return;
    sessionDirty = true;
    const r = parseInt(featherRange.value,10);
    const blurred = boxBlurAlpha(featherBaseMask, maskCanvas.width, maskCanvas.height, r);
    mctx.putImageData(blurred,0,0);
    renderSelectionOverlay();
  });
  featherRange.addEventListener('pointerup', ()=>{
    featherBaseMask=null;
  });

  // ---------- Lasso & Brush interaction ----------
  let lassoPoints = [];
  let dragStart = null;
  let brushDrawing = false;

  function canvasPos(e){
    const rect = overlayCanvas.getBoundingClientRect();
    const scaleX = overlayCanvas.width/rect.width;
    const scaleY = overlayCanvas.height/rect.height;
    return [ (e.clientX-rect.left)*scaleX, (e.clientY-rect.top)*scaleY ];
  }

  function paintBrush(x,y,subtract){
    sessionDirty = true;
    const size = parseInt(document.getElementById('brushSize').value,10);
    const hardness = parseInt(document.getElementById('brushHardness').value,10)/100;
    const r = size/2;
    mctx.save();
    if(subtract){ ensureMaskInitialized(); mctx.globalCompositeOperation='destination-out'; }
    else mctx.globalCompositeOperation='source-over';
    const grad = mctx.createRadialGradient(x,y,Math.max(0,r*hardness),x,y,r);
    grad.addColorStop(0,'rgba(255,255,255,1)');
    grad.addColorStop(1,'rgba(255,255,255,0)');
    mctx.fillStyle = grad;
    mctx.beginPath(); mctx.arc(x,y,r,0,Math.PI*2); mctx.fill();
    mctx.restore();
    if(!subtract) hasSelection = true;
  }

  // ---------- Draw tool (그리기): paints onto a brand-new top layer ----------
  const drawColorInput = document.getElementById('drawColor');
  const drawSizeInput = document.getElementById('drawSize');
  const drawHardnessInput = document.getElementById('drawHardness');
  const drawExposureInput = document.getElementById('drawExposure');
  let drawBrushType = 'round';
  document.querySelectorAll('#group-draw .ratio-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#group-draw .ratio-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      drawBrushType = btn.dataset.brushtype;
    });
  });
  drawSizeInput.addEventListener('input', ()=>{ document.getElementById('drawSizeVal').textContent = drawSizeInput.value; });
  drawHardnessInput.addEventListener('input', ()=>{ document.getElementById('drawHardnessVal').textContent = drawHardnessInput.value; });
  drawExposureInput.addEventListener('input', ()=>{ document.getElementById('drawExposureVal').textContent = drawExposureInput.value; });

  function hexToRgb(hex){
    const m = /^#([0-9a-f]{6})$/i.exec(hex||'');
    const n = m ? parseInt(m[1],16) : 0x4fd1c5;
    return [ (n>>16)&255, (n>>8)&255, n&255 ];
  }

  // One new top layer is created on the first stroke of each 그리기 session
  // (opening the menu again later creates another) — cancelling the session
  // discards it automatically since restoreState() rebuilds `layers` from the
  // pre-session snapshot, which never included it.
  let drawLayerForSession = null;
  let drawingActive = false;
  let lastDrawPos = null;

  function ensureDrawLayer(){
    if(drawLayerForSession) return drawLayerForSession;
    const layer = createLayer('그리기 레이어', mainCanvas.width, mainCanvas.height);
    layers.push(layer);
    activeLayerId = layer.id;
    drawLayerForSession = layer;
    renderLayerPanel();
    return layer;
  }
  function paintDrawDab(x,y){
    if(!editingSnapshot) return;
    sessionDirty = true;
    const layer = ensureDrawLayer();
    const size = parseInt(drawSizeInput.value,10);
    const hardness = parseInt(drawHardnessInput.value,10)/100;
    const exposure = parseInt(drawExposureInput.value,10)/100;
    const r = size/2;
    const [rr,gg,bb] = hexToRgb(drawColorInput.value);
    const lctx = layer.ctx;
    lctx.save();
    lctx.globalAlpha = exposure;
    if(drawBrushType==='square'){
      lctx.fillStyle = `rgb(${rr},${gg},${bb})`;
      lctx.fillRect(x-r, y-r, size, size);
    } else {
      const grad = lctx.createRadialGradient(x,y,Math.max(0,r*hardness),x,y,r);
      grad.addColorStop(0, `rgba(${rr},${gg},${bb},1)`);
      grad.addColorStop(1, `rgba(${rr},${gg},${bb},0)`);
      lctx.fillStyle = grad;
      lctx.beginPath(); lctx.arc(x,y,r,0,Math.PI*2); lctx.fill();
    }
    lctx.restore();
    compositeLayers();
  }
  function paintDrawLine(x1,y1,x2,y2){
    const size = parseInt(drawSizeInput.value,10);
    const dist = Math.hypot(x2-x1,y2-y1);
    const step = Math.max(1, size/4);
    const n = Math.max(1, Math.floor(dist/step));
    for(let i=1;i<=n;i++){
      const t = i/n;
      paintDrawDab(x1+(x2-x1)*t, y1+(y2-y1)*t);
    }
  }
  function applyDrawAction(){
    commitEdit();
    drawLayerForSession = null;
  }
  function cancelDrawAction(){
    cancelEdit();
    drawLayerForSession = null;
  }

  // ---------- Pinch to zoom + rotate (two fingers) ----------
  const activePointers = new Map(); // pointerId -> {x,y} in client coords
  let pinchActive = false;
  let pinchStartDist = 0;
  let pinchStartScale = 1;
  let pinchStartAngle = 0;
  let pinchStartRotation = 0;
  let cropModeActive = false; // true while the 크롭 sub-panel is open

  function pointerDistance(){
    const pts = [...activePointers.values()];
    return Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
  }
  function pointerAngle(){
    const pts = [...activePointers.values()];
    return Math.atan2(pts[1].y-pts[0].y, pts[1].x-pts[0].x) * 180/Math.PI;
  }
  function startPinch(){
    endPeek(); // a second finger joining a before/after peek should zoom, not stay peeked
    pinchActive = true;
    pinchStartDist = pointerDistance();
    pinchStartScale = cropModeActive ? imgScale : viewScale;
    pinchStartAngle = pointerAngle();
    pinchStartRotation = cropRotationDeg;
    // a second finger cancels any in-progress single-finger tool action
    lassoPoints = [];
    brushDrawing = false;
    drawingActive = false;
    lastDrawPos = null;
    dragStart = null;
    renderSelectionOverlay();
  }
  function updatePinch(){
    if(!pinchActive || activePointers.size<2 || pinchStartDist<=0) return;
    const scaleFactor = pointerDistance()/pinchStartDist;
    // In crop mode, pinch-zoom scales the IMAGE behind the fixed frame instead
    // of the general view — the frame itself must never move or resize from this.
    if(cropModeActive){
      imgScale = clampImgScale(pinchStartScale * scaleFactor);
      clampImgOffset();
      sessionDirty = true;
      renderCropFrame();
    } else {
      setViewScale(pinchStartScale * scaleFactor);
    }
    if(cropModeActive){
      const angleDelta = pointerAngle()-pinchStartAngle;
      previewRotation(Math.max(-45, Math.min(45, pinchStartRotation+angleDelta)));
      updateRulerUI();
    }
  }

  overlayCanvas.addEventListener('pointerdown', e=>{
    try{ overlayCanvas.setPointerCapture(e.pointerId); }catch(err){}
    activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(activePointers.size>=2){ startPinch(); return; }
    if(currentTool==='none'){
      startPeek();
      return;
    }
    const [x,y] = canvasPos(e);
    if(currentTool==='lasso'){
      lassoPoints = [[x,y]];
    } else if(currentTool==='brush-add' || currentTool==='brush-sub'){
      beginEdit();
      brushDrawing = true;
      paintBrush(x,y,currentTool==='brush-sub');
      renderSelectionOverlay();
    } else if(currentTool==='draw'){
      beginEdit();
      drawingActive = true;
      lastDrawPos = [x,y];
      paintDrawDab(x,y);
    }
  });
  overlayCanvas.addEventListener('pointermove', e=>{
    if(activePointers.has(e.pointerId)) activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pinchActive){ updatePinch(); return; }
    if(activePointers.size>=2) return;
    if(currentTool==='none') return;
    const [x,y] = canvasPos(e);
    if(currentTool==='lasso' && lassoPoints.length){
      lassoPoints.push([x,y]);
      renderSelectionOverlay();
    } else if(brushDrawing && (currentTool==='brush-add'||currentTool==='brush-sub')){
      paintBrush(x,y,currentTool==='brush-sub');
      renderSelectionOverlay();
    } else if(drawingActive && currentTool==='draw' && lastDrawPos){
      paintDrawLine(lastDrawPos[0], lastDrawPos[1], x, y);
      lastDrawPos = [x,y];
    }
  });
  function releasePointer(e){
    activePointers.delete(e.pointerId);
    if(activePointers.size<2 && pinchActive){
      pinchActive = false;
      return true; // this up-event ended a pinch gesture, not a tool action
    }
    return false;
  }
  overlayCanvas.addEventListener('pointerup', e=>{
    endPeek();
    if(releasePointer(e)){ dragStart=null; return; }
    if(currentTool==='lasso' && lassoPoints.length>2){
      beginEdit();
      sessionDirty = true;
      mctx.save();
      mctx.globalCompositeOperation='source-over';
      mctx.fillStyle='white';
      mctx.beginPath();
      mctx.moveTo(lassoPoints[0][0], lassoPoints[0][1]);
      for(let p of lassoPoints) mctx.lineTo(p[0],p[1]);
      mctx.closePath(); mctx.fill();
      mctx.restore();
      hasSelection = true;
      lassoPoints = [];
      renderSelectionOverlay();
    } else if(currentTool==='lasso'){
      lassoPoints=[];
    }
    if(currentTool==='brush-add'||currentTool==='brush-sub'){
      brushDrawing=false;
    }
    if(currentTool==='draw'){
      drawingActive=false;
      lastDrawPos=null;
    }
    dragStart=null;
  });
  overlayCanvas.addEventListener('pointercancel', e=>{
    endPeek();
    drawingActive=false;
    lastDrawPos=null;
    releasePointer(e);
  });

  // ---------- Resize ----------
  const resizeW = document.getElementById('resizeW'), resizeH = document.getElementById('resizeH');
  const lockAspectToggle = document.getElementById('lockAspectToggle');
  let aspect = 1;
  let lockAspectOn = true;
  lockAspectToggle.addEventListener('click', ()=>{
    lockAspectOn = !lockAspectOn;
    lockAspectToggle.classList.toggle('active', lockAspectOn);
    lockAspectToggle.setAttribute('aria-pressed', String(lockAspectOn));
  });
  function syncResizeInputs(){
    resizeW.value = mainCanvas.width;
    resizeH.value = mainCanvas.height;
    aspect = mainCanvas.width/mainCanvas.height;
  }
  // Resizing now live-previews (like the other adjustment menus) instead of
  // applying immediately — the header's 적용/취소 commits or discards it. Every
  // call rebuilds all layers fresh from editingSnapshot (never from the result
  // of a previous call), so repeated slider drags don't compound scaling loss.
  function previewResize(w,h){
    beginEdit();
    if(!editingSnapshot) return;
    sessionDirty = true;
    const baseW = editingSnapshot.w, baseH = editingSnapshot.h;
    setCanvasSize(w,h);
    layers = editingSnapshot.layers.map(ls=>{
      const layer = layerShellFromSnapshot(ls, w, h);
      const tmp = document.createElement('canvas');
      tmp.width = baseW; tmp.height = baseH;
      tmp.getContext('2d').putImageData(ls.img, 0, 0);
      layer.ctx.drawImage(tmp, 0,0,baseW,baseH, 0,0,w,h);
      return layer;
    });
    activeLayerId = editingSnapshot.activeLayerId;
    hasSelection=false;
    updateDims();
    compositeLayers();
    renderLayerPanel();
  }
  resizeW.addEventListener('input', ()=>{
    const w = Math.max(1, parseInt(resizeW.value||1,10));
    let h;
    if(lockAspectOn){ h = Math.max(1, Math.round(w/aspect)); resizeH.value = h; }
    else h = Math.max(1, parseInt(resizeH.value||1,10));
    previewResize(w,h);
  });
  resizeH.addEventListener('input', ()=>{
    const h = Math.max(1, parseInt(resizeH.value||1,10));
    let w;
    if(lockAspectOn){ w = Math.max(1, Math.round(h*aspect)); resizeW.value = w; }
    else w = Math.max(1, parseInt(resizeW.value||1,10));
    previewResize(w,h);
  });
  function applyResizeAction(){
    commitEdit();
    syncResizeInputs();
  }
  function cancelResizeAction(){
    cancelEdit();
    syncResizeInputs();
  }

  // ---------- Generic live-preview edit machinery ----------
  // sessionDirty tracks whether the CURRENT menu session actually changed
  // anything, so the header's 취소 can skip its confirm prompt when there's
  // nothing to lose (see cancelActiveMenu).
  let sessionDirty = false;
  function beginEdit(){
    if(editingSnapshot) return;
    editingSnapshot = snapshotState();
    sessionDirty = false;
  }
  // Effects/selective color/levels/curve only ever touch the ACTIVE layer's
  // pixels — everything else in the document stays exactly as it was.
  function previewEffect(effectFn){
    if(!editingSnapshot) return;
    // Key off the layer that was active when this session began, not whatever
    // is active right now — the layer panel can still be clicked mid-session.
    const layer = layers.find(l=>l.id===editingSnapshot.activeLayerId);
    if(!layer || layer.locked) return;
    const layerSnap = editingSnapshot.layers.find(l=>l.id===editingSnapshot.activeLayerId);
    if(!layerSnap) return;
    sessionDirty = true;
    const w=editingSnapshot.w, h=editingSnapshot.h;
    const base = new Uint8ClampedArray(layerSnap.img.data);
    const effect = effectFn(new Uint8ClampedArray(base), w, h);
    const out = new ImageData(w,h);
    const alphaAll = hasSelection ? mctx.getImageData(0,0,w,h).data : null;
    for(let i=0;i<base.length;i+=4){
      const a = alphaAll ? alphaAll[i+3]/255 : 1;
      out.data[i]   = base[i]  *(1-a) + effect[i]  *a;
      out.data[i+1] = base[i+1]*(1-a) + effect[i+1]*a;
      out.data[i+2] = base[i+2]*(1-a) + effect[i+2]*a;
      out.data[i+3] = base[i+3];
    }
    layer.ctx.putImageData(out,0,0);
    compositeLayers();
  }
  // Press-and-hold on the image (효과/선택색상/레벨/곡선 only, once something's
  // actually changed) shows the image as it was before this menu's edits, so
  // the user can compare before/after; releasing restores the live preview.
  const PEEK_MENUS = new Set(['group-effects','group-sc','group-levels','group-curve']);
  let isPeeking = false;
  let peekAfterImage = null;
  function canPeek(){
    return currentTool==='none' && PEEK_MENUS.has(activeMenuId) && !!editingSnapshot && sessionDirty;
  }
  function startPeek(){
    if(isPeeking || !canPeek()) return;
    const layer = layers.find(l=>l.id===editingSnapshot.activeLayerId);
    const layerSnap = editingSnapshot.layers.find(l=>l.id===editingSnapshot.activeLayerId);
    if(!layer || !layerSnap) return;
    isPeeking = true;
    peekAfterImage = layer.ctx.getImageData(0,0,mainCanvas.width,mainCanvas.height);
    layer.ctx.putImageData(layerSnap.img,0,0);
    compositeLayers();
  }
  function endPeek(){
    if(!isPeeking) return;
    isPeeking = false;
    const layer = editingSnapshot && layers.find(l=>l.id===editingSnapshot.activeLayerId);
    if(layer && peekAfterImage) layer.ctx.putImageData(peekAfterImage,0,0);
    peekAfterImage = null;
    compositeLayers();
  }
  function commitEdit(){
    if(!editingSnapshot) return;
    pushUndo(editingSnapshot);
    editingSnapshot = null;
    sessionDirty = false;
  }
  function cancelEdit(){
    if(!editingSnapshot) return;
    restoreState(editingSnapshot);
    editingSnapshot = null;
    sessionDirty = false;
  }

  // ---------- Crop frame (fixed & centered; image pans/zooms behind it) ----------
  // The frame's size/position is defined purely in the crop viewport's own CSS-px
  // space and is ALWAYS centered — it never moves. Panning (one finger) and
  // pinch-zooming (two fingers) instead move/scale the IMAGE (mainCanvas) behind
  // the fixed frame; only ratio buttons and handle drags change the frame's size.
  const cropFrame = document.getElementById('cropFrame');
  const cropFrameRect = document.getElementById('cropFrameRect');
  const rotateRuler = document.getElementById('rotateRuler');
  const rotateRulerTrack = document.getElementById('rotateRulerTrack');
  const rotateValueEl = document.getElementById('rotateValue');
  const MIN_CROP = 20;
  const PX_PER_DEG = 6;
  let cropRatio = null;      // null = free, else numeric width/height
  let cropRotationDeg = 0;
  let cropViewportW = 0, cropViewportH = 0; // fixed crop-mode viewport size, CSS px
  let frameW = 0, frameH = 0;               // crop frame size, CSS px (always centered)
  let imgScale = 1;                          // crop-mode image zoom, CSS px per canvas px
  let imgOffsetX = 0, imgOffsetY = 0;        // image-center pan offset from viewport center, CSS px

  function defaultFrameSize(R){
    const vw = cropViewportW, vh = cropViewportH;
    let w, h;
    if(R==null){ w = vw*0.8; h = vh*0.8; }
    else {
      w = vw*0.85; h = w/R;
      if(h > vh*0.85){ h = vh*0.85; w = h*R; }
    }
    return { w: Math.max(MIN_CROP, w), h: Math.max(MIN_CROP, h) };
  }

  // The image must always fully cover the frame so a crop always has real pixel
  // data behind every corner — this is the minimum zoom allowed.
  function minImgScale(){
    if(!frameW || !frameH || !mainCanvas.width || !mainCanvas.height) return 1;
    return Math.max(frameW/mainCanvas.width, frameH/mainCanvas.height);
  }
  function clampImgScale(s){
    return Math.max(minImgScale(), Math.min(MAX_ZOOM, s));
  }
  function clampImgOffset(){
    const dispW = mainCanvas.width*imgScale, dispH = mainCanvas.height*imgScale;
    const maxX = Math.max(0, (dispW-frameW)/2), maxY = Math.max(0, (dispH-frameH)/2);
    imgOffsetX = Math.max(-maxX, Math.min(maxX, imgOffsetX));
    imgOffsetY = Math.max(-maxY, Math.min(maxY, imgOffsetY));
  }
  // Resets the frame to a fresh centered default and the image to "fit the frame
  // exactly, no pan" — used whenever a crop session starts over (menu opened,
  // ratio changed, or the previous session applied/cancelled).
  function resetCropView(){
    const sz = defaultFrameSize(cropRatio);
    frameW = sz.w; frameH = sz.h;
    imgScale = minImgScale();
    imgOffsetX = 0; imgOffsetY = 0;
  }

  function updateCropSizeReadout(){
    if(!cropModeActive) return;
    const w = Math.max(1, Math.round(frameW/imgScale));
    const h = Math.max(1, Math.round(frameH/imgScale));
    headerCropSize.textContent = w + ' × ' + h + ' px';
  }

  function renderCropFrame(){
    if(!cropModeActive) return;
    cropFrameRect.style.left = ((cropViewportW-frameW)/2)+'px';
    cropFrameRect.style.top = ((cropViewportH-frameH)/2)+'px';
    cropFrameRect.style.width = frameW+'px';
    cropFrameRect.style.height = frameH+'px';
    const dispW = mainCanvas.width*imgScale, dispH = mainCanvas.height*imgScale;
    mainCanvas.style.left = (cropViewportW/2 + imgOffsetX - dispW/2)+'px';
    mainCanvas.style.top = (cropViewportH/2 + imgOffsetY - dispH/2)+'px';
    mainCanvas.style.width = dispW+'px';
    mainCanvas.style.height = dispH+'px';
    updateCropSizeReadout();
  }

  function showCropFrame(){
    beginEdit();
    cropModeActive = true;
    const avail = stageAvailSize();
    cropViewportW = avail.w; cropViewportH = avail.h;
    canvasHolder.classList.add('crop-mode');
    canvasHolder.style.width = cropViewportW+'px';
    canvasHolder.style.height = cropViewportH+'px';
    overlayCanvas.style.display = 'none';
    resetCropView();
    cropFrame.hidden = false;
    renderCropFrame();
  }
  // Committing/discarding the pending edit is handled by applyCropAction/
  // cancelCropAction (via the header's 적용/취소) before this ever runs, so
  // hiding the frame here is purely visual.
  function hideCropFrame(){
    cropFrame.hidden = true;
    cropModeActive = false;
    canvasHolder.classList.remove('crop-mode');
    canvasHolder.style.width = '';
    canvasHolder.style.height = '';
    mainCanvas.style.left = '';
    mainCanvas.style.top = '';
    overlayCanvas.style.display = '';
    fitToScreen();
  }
  document.querySelectorAll('.ratio-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('.ratio-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const rv = btn.dataset.ratio;
      cropRatio = rv==='free' ? null : (()=>{ const [a,b]=rv.split(':').map(Number); return a/b; })();
      resetCropView();
      sessionDirty = true;
      renderCropFrame();
    });
  });

  // A single-finger drag resizes a handle (frame stays centered, growing/shrinking
  // symmetrically about its own center) or, anywhere else on the crop-frame
  // backdrop, pans the image. A second finger landing anywhere hands off to the
  // shared two-finger pinch/rotate gesture — sharing the same activePointers/
  // pinchActive state overlayCanvas uses, so a gesture can start with one or both
  // fingers on a handle or inside the crop area.
  //
  // Listeners are attached once (persistent), not per-drag, because real
  // multi-touch can land both fingers on the very same element: pointer capture
  // and pointerup are per-pointerId, so a dynamically-added/removed listener pair
  // gets torn down by whichever finger's pointerup happens to fire first — even
  // if that isn't the finger that started the single-pointer drag. A `primaryId`
  // closure variable instead tracks which pointer (if any) owns the current
  // single-pointer action, mirroring how overlayCanvas's own tool handlers work.
  function attachGestureAwareDrag(el, {start, move}){
    let primaryId = null;
    let ctx = null;
    el.addEventListener('pointerdown', e=>{
      activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if(activePointers.size>=2){ if(!pinchActive) startPinch(); return; }
      if(primaryId!==null) return;
      const c = start(e);
      if(c===false) return;
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
      primaryId = e.pointerId;
      ctx = c;
    });
    el.addEventListener('pointermove', e=>{
      if(activePointers.has(e.pointerId)) activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if(pinchActive){ updatePinch(); return; }
      if(activePointers.size>=2) return;
      if(e.pointerId!==primaryId || primaryId===null) return;
      move(e, ctx);
    });
    function endPrimary(e){
      if(e.pointerId===primaryId){ primaryId=null; ctx=null; }
      releasePointer(e);
    }
    el.addEventListener('pointerup', endPrimary);
    el.addEventListener('pointercancel', endPrimary);
  }

  // Center-anchored resize: dragging one edge/corner grows or shrinks the frame
  // symmetrically about its own center, so it never has to move to stay centered.
  function resizeFrame(handle, dx, dy, startFrame){
    const moveT = handle.includes('n'), moveB = handle.includes('s');
    const moveL = handle.includes('w'), moveR = handle.includes('e');
    const isCorner = (moveT||moveB) && (moveL||moveR);
    const maxW = cropViewportW, maxH = cropViewportH;
    let w = startFrame.w, h = startFrame.h;
    if(cropRatio==null){
      if(moveL||moveR) w = startFrame.w + (moveR?dx:-dx)*2;
      if(moveT||moveB) h = startFrame.h + (moveB?dy:-dy)*2;
      w = Math.max(MIN_CROP, Math.min(maxW, w));
      h = Math.max(MIN_CROP, Math.min(maxH, h));
    } else {
      const R = cropRatio;
      if(isCorner){
        const dW = moveR?dx:-dx;
        const dH = (moveB?dy:-dy) * R;
        const d = Math.abs(dW) > Math.abs(dH) ? dW : dH;
        w = Math.max(MIN_CROP, startFrame.w + d*2);
      } else if(moveL||moveR){
        w = Math.max(MIN_CROP, startFrame.w + (moveR?dx:-dx)*2);
      } else {
        h = Math.max(MIN_CROP, startFrame.h + (moveB?dy:-dy)*2);
        w = h*R;
      }
      if(isCorner || moveL || moveR) h = w/R;
      if(w>maxW){ w=maxW; h=w/R; }
      if(h>maxH){ h=maxH; w=h*R; }
      w = Math.max(MIN_CROP, w); h = Math.max(MIN_CROP, h);
    }
    return {w, h};
  }

  document.querySelectorAll('.crop-handle').forEach(handle=>{
    attachGestureAwareDrag(handle, {
      start(e){
        e.preventDefault(); e.stopPropagation();
        return { startX:e.clientX, startY:e.clientY, startFrame:{w:frameW,h:frameH} };
      },
      move(e2, hctx){
        const dx = e2.clientX-hctx.startX, dy = e2.clientY-hctx.startY;
        const sz = resizeFrame(handle.dataset.handle, dx, dy, hctx.startFrame);
        frameW = sz.w; frameH = sz.h;
        imgScale = clampImgScale(imgScale);
        clampImgOffset();
        sessionDirty = true;
        renderCropFrame();
      }
    });
  });

  // Dragging anywhere on the crop-frame backdrop (inside or outside the visible
  // window) pans the image — the frame itself never moves.
  attachGestureAwareDrag(cropFrame, {
    start(e){
      e.preventDefault();
      return { startX:e.clientX, startY:e.clientY, startOffX:imgOffsetX, startOffY:imgOffsetY };
    },
    move(e2, pctx){
      imgOffsetX = pctx.startOffX + (e2.clientX-pctx.startX);
      imgOffsetY = pctx.startOffY + (e2.clientY-pctx.startY);
      clampImgOffset();
      sessionDirty = true;
      renderCropFrame();
    }
  });

  // ---------- Rotation (straighten): ruler drag + two-finger gesture ----------
  function rotatedBounds(w,h,deg){
    const rad = deg*Math.PI/180;
    return {
      w: Math.round(Math.abs(w*Math.cos(rad)) + Math.abs(h*Math.sin(rad))),
      h: Math.round(Math.abs(w*Math.sin(rad)) + Math.abs(h*Math.cos(rad)))
    };
  }
  function previewRotation(deg){
    if(!editingSnapshot) return;
    sessionDirty = true;
    cropRotationDeg = deg;
    const baseW = editingSnapshot.w, baseH = editingSnapshot.h;
    const {w:newW, h:newH} = rotatedBounds(baseW, baseH, deg);
    setCanvasSize(newW, newH);
    // Rebuilt fresh from editingSnapshot each call (same reasoning as
    // previewResize) so every layer rotates from its original pixels, not a
    // resampled result of the previous angle.
    layers = editingSnapshot.layers.map(ls=>{
      const layer = layerShellFromSnapshot(ls, newW, newH);
      const tmp = document.createElement('canvas');
      tmp.width = baseW; tmp.height = baseH;
      tmp.getContext('2d').putImageData(ls.img, 0, 0);
      layer.ctx.save();
      layer.ctx.translate(newW/2, newH/2);
      layer.ctx.rotate(deg*Math.PI/180);
      layer.ctx.drawImage(tmp, -baseW/2, -baseH/2);
      layer.ctx.restore();
      return layer;
    });
    activeLayerId = editingSnapshot.activeLayerId;
    // The frame itself never changes from a rotation — only the image's own pixel
    // bounds grew, so the zoom/pan just need re-clamping against the new size.
    if(cropModeActive){
      imgScale = clampImgScale(imgScale);
      clampImgOffset();
      renderCropFrame();
    }
    updateRulerUI();
    compositeLayers();
    renderLayerPanel();
  }
  function updateRulerUI(){
    rotateRulerTrack.style.transform = 'translateX(' + (-cropRotationDeg*PX_PER_DEG) + 'px)';
    rotateValueEl.textContent = Math.round(cropRotationDeg)+'°';
  }
  (function buildRulerTicks(){
    const frag = document.createDocumentFragment();
    for(let d=-45; d<=45; d++){
      const tick = document.createElement('div');
      tick.className = 'ruler-tick' + (d%10===0?' major':(d%5===0?' mid':''));
      tick.style.left = (2000 + d*PX_PER_DEG) + 'px';
      frag.appendChild(tick);
    }
    rotateRulerTrack.appendChild(frag);
  })();
  rotateRuler.addEventListener('pointerdown', e=>{
    beginEdit();
    try{ rotateRuler.setPointerCapture(e.pointerId); }catch(err){}
    const startX = e.clientX, startDeg = cropRotationDeg;
    function onMove(e2){
      const dx = e2.clientX-startX;
      previewRotation(Math.max(-45, Math.min(45, startDeg + dx/PX_PER_DEG)));
    }
    function onUp(){
      rotateRuler.removeEventListener('pointermove', onMove);
      rotateRuler.removeEventListener('pointerup', onUp);
      rotateRuler.removeEventListener('pointercancel', onUp);
    }
    rotateRuler.addEventListener('pointermove', onMove);
    rotateRuler.addEventListener('pointerup', onUp);
    rotateRuler.addEventListener('pointercancel', onUp);
  });

  function applyCropAction(){
    if(!editingSnapshot) beginEdit();
    commitEdit();
    const cropPxW = Math.max(1, Math.round(frameW/imgScale));
    const cropPxH = Math.max(1, Math.round(frameH/imgScale));
    const srcX = Math.round(mainCanvas.width/2 - (frameW/2+imgOffsetX)/imgScale);
    const srcY = Math.round(mainCanvas.height/2 - (frameH/2+imgOffsetY)/imgScale);
    const x = Math.max(0, Math.min(srcX, mainCanvas.width-cropPxW));
    const y = Math.max(0, Math.min(srcY, mainCanvas.height-cropPxH));
    const oldLayers = layers;
    layers = oldLayers.map(l=>{
      const {canvas, ctx:lctx} = makeLayerCanvas(cropPxW, cropPxH);
      lctx.drawImage(l.canvas, x,y,cropPxW,cropPxH, 0,0,cropPxW,cropPxH);
      return { id:l.id, name:l.name, canvas, ctx:lctx, visible:l.visible, locked:l.locked, opacity:l.opacity };
    });
    setCanvasSize(cropPxW,cropPxH);
    hasSelection=false;
    syncResizeInputs();
    updateDims();
    cropRotationDeg = 0;
    frameW = 0; frameH = 0; // force a fresh centered view next time crop opens
    updateRulerUI();
    compositeLayers();
    renderLayerPanel();
  }
  function cancelCropAction(){
    cancelEdit();
    cropRotationDeg = 0;
    frameW = 0; frameH = 0;
    updateRulerUI();
  }

  // ---------- Box blur helpers ----------
  function boxBlurPass(src,w,h,radius){
    if(radius<1) return src;
    const out = new Uint8ClampedArray(src.length);
    // horizontal
    const tmp = new Float32Array(src.length);
    for(let y=0;y<h;y++){
      let rSum=0,gSum=0,bSum=0,aSum=0,count=0;
      const rowStart = y*w*4;
      for(let x=-radius;x<=radius;x++){
        const xi = Math.min(w-1,Math.max(0,x));
        const idx = rowStart+xi*4;
        rSum+=src[idx];gSum+=src[idx+1];bSum+=src[idx+2];aSum+=src[idx+3];count++;
      }
      for(let x=0;x<w;x++){
        const idx = rowStart+x*4;
        tmp[idx]=rSum/count; tmp[idx+1]=gSum/count; tmp[idx+2]=bSum/count; tmp[idx+3]=aSum/count;
        const addX = Math.min(w-1,x+radius+1), remX = Math.max(0,x-radius);
        const addIdx = rowStart+addX*4, remIdx = rowStart+remX*4;
        rSum += src[addIdx]-src[remIdx]; gSum += src[addIdx+1]-src[remIdx+1];
        bSum += src[addIdx+2]-src[remIdx+2]; aSum += src[addIdx+3]-src[remIdx+3];
      }
    }
    // vertical
    for(let x=0;x<w;x++){
      let rSum=0,gSum=0,bSum=0,aSum=0,count=0;
      for(let y=-radius;y<=radius;y++){
        const yi = Math.min(h-1,Math.max(0,y));
        const idx = (yi*w+x)*4;
        rSum+=tmp[idx];gSum+=tmp[idx+1];bSum+=tmp[idx+2];aSum+=tmp[idx+3];count++;
      }
      for(let y=0;y<h;y++){
        const idx=(y*w+x)*4;
        out[idx]=rSum/count; out[idx+1]=gSum/count; out[idx+2]=bSum/count; out[idx+3]=aSum/count;
        const addY = Math.min(h-1,y+radius+1), remY = Math.max(0,y-radius);
        const addIdx=(addY*w+x)*4, remIdx=(remY*w+x)*4;
        rSum += tmp[addIdx]-tmp[remIdx]; gSum += tmp[addIdx+1]-tmp[remIdx+1];
        bSum += tmp[addIdx+2]-tmp[remIdx+2]; aSum += tmp[addIdx+3]-tmp[remIdx+3];
      }
    }
    return out;
  }
  function gaussianApprox(src,w,h,radius){
    let out = src;
    out = boxBlurPass(out,w,h,radius);
    out = boxBlurPass(out,w,h,radius);
    out = boxBlurPass(out,w,h,radius);
    return out;
  }
  function boxBlurAlpha(imgData,w,h,radius){
    const src = imgData.data;
    const alphaRGBA = new Uint8ClampedArray(src.length);
    for(let i=3;i<src.length;i+=4) alphaRGBA[i]=src[i];
    const blurred = radius<1 ? alphaRGBA : gaussianApprox(alphaRGBA,w,h,radius);
    const out = new ImageData(w,h);
    for(let i=0;i<src.length;i+=4){
      out.data[i]=255; out.data[i+1]=255; out.data[i+2]=255; out.data[i+3]=blurred[i+3];
    }
    return out;
  }

  // ---------- Effects: blur + noise ----------
  const blurRange = document.getElementById('blurRange');
  const noiseRange = document.getElementById('noiseRange');
  function runEffectsPreview(){
    beginEdit();
    const radius = parseInt(blurRange.value,10);
    const noiseAmt = parseInt(noiseRange.value,10);
    previewEffect((data,w,h)=>{
      let result = radius>0 ? gaussianApprox(data,w,h,radius) : data;
      if(noiseAmt>0){
        result = new Uint8ClampedArray(result);
        for(let i=0;i<result.length;i+=4){
          const n = (Math.random()*2-1)*noiseAmt;
          result[i]+=n; result[i+1]+=n; result[i+2]+=n;
        }
      }
      return result;
    });
  }
  blurRange.addEventListener('input', ()=>{document.getElementById('blurVal').textContent=blurRange.value; runEffectsPreview();});
  noiseRange.addEventListener('input', ()=>{document.getElementById('noiseVal').textContent=noiseRange.value; runEffectsPreview();});
  function resetEffectsInputs(){
    blurRange.value=0; noiseRange.value=0;
    document.getElementById('blurVal').textContent='0'; document.getElementById('noiseVal').textContent='0';
  }
  function applyEffectsAction(){ commitEdit(); resetEffectsInputs(); }
  function cancelEffectsAction(){ cancelEdit(); resetEffectsInputs(); }

  // ---------- Selective color (Photoshop-style: 9 color ranges × C/M/Y/K) ----------
  function rgbToHue(r,g,b){
    r/=255;g/=255;b/=255;
    const max=Math.max(r,g,b), min=Math.min(r,g,b);
    let h=0;
    if(max!==min){
      const d = max-min;
      if(max===r) h = ((g-b)/d)%6;
      else if(max===g) h = (b-r)/d+2;
      else h = (r-g)/d+4;
      h*=60; if(h<0) h+=360;
    }
    return h;
  }
  function hueDist(a,b){
    let d = Math.abs(a-b)%360;
    return d>180 ? 360-d : d;
  }
  const scRangeSelect = document.getElementById('scRange');
  const scC = document.getElementById('scC'), scCNum = document.getElementById('scCNum');
  const scM = document.getElementById('scM'), scMNum = document.getElementById('scMNum');
  const scY = document.getElementById('scY'), scYNum = document.getElementById('scYNum');
  const scK = document.getElementById('scK'), scKNum = document.getElementById('scKNum');
  const SC_RANGES = ['red','yellow','green','cyan','blue','magenta','white','neutral','black'];
  const SC_HUE_CENTER = {red:0,yellow:60,green:120,cyan:180,blue:240,magenta:300};
  let scValues = {};
  let scCurrentRange = 'red';
  function resetSCValues(){
    SC_RANGES.forEach(r=> scValues[r] = {c:0,m:0,y:0,k:0});
  }
  resetSCValues();

  // Each pixel gets a 0..1 membership weight per color range: the six hue-based
  // ranges are weighted by both hue proximity and saturation (so a nearly-gray
  // pixel doesn't get pulled by a chromatic range), and the three tonal ranges
  // (whites/neutrals/blacks) are weighted purely by lightness.
  function scWeights(r,g,b){
    const max=Math.max(r,g,b), min=Math.min(r,g,b);
    const L = (max+min)/2/255;
    const sat = max===0 ? 0 : (max-min)/max;
    const hue = rgbToHue(r,g,b);
    const w = {};
    for(const k in SC_HUE_CENTER){
      const hueW = Math.max(0, 1 - hueDist(hue, SC_HUE_CENTER[k])/60);
      w[k] = hueW * sat;
    }
    w.white = Math.max(0, Math.min(1, (L-0.5)/0.5));
    w.black = Math.max(0, Math.min(1, (0.5-L)/0.5));
    w.neutral = Math.max(0, 1 - Math.abs(L-0.5)*2);
    return w;
  }
  function scAggregate(r,g,b){
    const w = scWeights(r,g,b);
    let c=0,m=0,y=0,k=0;
    for(const range of SC_RANGES){
      const wt = w[range];
      if(!wt) continue;
      const v = scValues[range];
      c += wt*v.c; m += wt*v.m; y += wt*v.y; k += wt*v.k;
    }
    return [
      Math.max(-100,Math.min(100,c)),
      Math.max(-100,Math.min(100,m)),
      Math.max(-100,Math.min(100,y)),
      Math.max(-100,Math.min(100,k))
    ];
  }
  // "Relative" method (matches Photoshop's default): a positive adjustment pulls
  // the channel down proportional to its current value; a negative one pulls it
  // up proportional to its remaining headroom.
  function scAdjustChannel(val, delta){
    return delta>=0 ? (val - val*delta) : (val - (255-val)*delta);
  }
  function runSCPreview(){
    beginEdit();
    previewEffect((data)=>{
      for(let i=0;i<data.length;i+=4){
        const r=data[i], g=data[i+1], b=data[i+2];
        const [c,m,y,k] = scAggregate(r,g,b);
        let R = scAdjustChannel(r, c/100);
        let G = scAdjustChannel(g, m/100);
        let B = scAdjustChannel(b, y/100);
        const dk = k/100;
        if(dk>=0){ R*=(1-dk); G*=(1-dk); B*=(1-dk); }
        else { R += (255-R)*(-dk); G += (255-G)*(-dk); B += (255-B)*(-dk); }
        data[i]=R; data[i+1]=G; data[i+2]=B;
      }
      return data;
    });
  }
  function syncSCInputs(){
    const v = scValues[scCurrentRange];
    scC.value=v.c; scCNum.value=v.c;
    scM.value=v.m; scMNum.value=v.m;
    scY.value=v.y; scYNum.value=v.y;
    scK.value=v.k; scKNum.value=v.k;
  }
  function bindSCChannel(rangeInput, numInput, channel){
    function apply(v){
      v = Math.max(-100, Math.min(100, Math.round(v)));
      scValues[scCurrentRange][channel] = v;
      rangeInput.value = v;
      numInput.value = v;
      sessionDirty = true;
      runSCPreview();
    }
    rangeInput.addEventListener('input', ()=> apply(parseInt(rangeInput.value,10)));
    numInput.addEventListener('input', ()=>{
      const n = parseInt(numInput.value,10);
      if(!isNaN(n)) apply(n);
    });
  }
  bindSCChannel(scC, scCNum, 'c');
  bindSCChannel(scM, scMNum, 'm');
  bindSCChannel(scY, scYNum, 'y');
  bindSCChannel(scK, scKNum, 'k');
  scRangeSelect.addEventListener('change', ()=>{
    scCurrentRange = scRangeSelect.value;
    syncSCInputs();
  });
  function resetSCInputs(){
    resetSCValues();
    scCurrentRange = 'red';
    scRangeSelect.value = 'red';
    syncSCInputs();
  }
  function applySCAction(){ commitEdit(); resetSCInputs(); }
  function cancelSCAction(){ cancelEdit(); resetSCInputs(); }

  // ---------- Levels ----------
  const lvInB=document.getElementById('lvInB'), lvInW=document.getElementById('lvInW'), lvGamma=document.getElementById('lvGamma');
  const lvOutB=document.getElementById('lvOutB'), lvOutW=document.getElementById('lvOutW');
  function runLevelsPreview(){
    beginEdit();
    const inB=parseInt(lvInB.value,10), inW=parseInt(lvInW.value,10), gamma=parseInt(lvGamma.value,10)/100;
    const outB=parseInt(lvOutB.value,10), outW=parseInt(lvOutW.value,10);
    const lut = new Uint8ClampedArray(256);
    for(let v=0;v<256;v++){
      let x = (v-inB)/Math.max(1,(inW-inB));
      x = Math.min(1,Math.max(0,x));
      x = Math.pow(x, 1/gamma);
      lut[v] = outB + x*(outW-outB);
    }
    previewEffect((data)=>{
      for(let i=0;i<data.length;i+=4){
        data[i]=lut[data[i]]; data[i+1]=lut[data[i+1]]; data[i+2]=lut[data[i+2]];
      }
      return data;
    });
  }
  [lvInB,lvInW,lvGamma,lvOutB,lvOutW].forEach(el=>{
    el.addEventListener('input', ()=>{
      document.getElementById('lvInBVal').textContent=lvInB.value;
      document.getElementById('lvInWVal').textContent=lvInW.value;
      document.getElementById('lvGammaVal').textContent=(parseInt(lvGamma.value,10)/100).toFixed(2);
      document.getElementById('lvOutBVal').textContent=lvOutB.value;
      document.getElementById('lvOutWVal').textContent=lvOutW.value;
      runLevelsPreview();
    });
  });
  function resetLevelsInputs(){
    lvInB.value=0;lvInW.value=255;lvGamma.value=100;lvOutB.value=0;lvOutW.value=255;
    document.getElementById('lvInBVal').textContent='0';
    document.getElementById('lvInWVal').textContent='255';
    document.getElementById('lvGammaVal').textContent='1.00';
    document.getElementById('lvOutBVal').textContent='0';
    document.getElementById('lvOutWVal').textContent='255';
  }
  function applyLevelsAction(){ commitEdit(); resetLevelsInputs(); }
  function cancelLevelsAction(){ cancelEdit(); resetLevelsInputs(); }

  // ---------- Curves ----------
  const curveCanvas = document.getElementById('curveCanvas');
  const cctx = curveCanvas.getContext('2d');
  const CURVE_W = curveCanvas.width, CURVE_H = curveCanvas.height;
  let curvePoints = [[0,0],[255,255]];
  let draggingPointIdx = -1;

  // Curve-value space is always 0..255 on both axes; screen space is the
  // canvas's own (possibly non-square) pixel buffer, CURVE_W × CURVE_H.
  function curveToScreen(p){ return [p[0]*(CURVE_W/255), CURVE_H-(p[1]/255)*CURVE_H]; }
  function screenToCurve(x,y){
    return [
      Math.min(255,Math.max(0, x*(255/CURVE_W))),
      Math.min(255,Math.max(0, 255-(y/CURVE_H)*255))
    ];
  }
  // The canvas is displayed at width:100% (CSS size can differ from its
  // CURVE_W×CURVE_H pixel buffer), so pointer coordinates need the same
  // buffer/rect scale correction canvasPos() already applies for the main image.
  function curvePointerPos(e){
    const rect = curveCanvas.getBoundingClientRect();
    const scaleX = curveCanvas.width/rect.width;
    const scaleY = curveCanvas.height/rect.height;
    return [ (e.clientX-rect.left)*scaleX, (e.clientY-rect.top)*scaleY ];
  }

  function buildLUT(){
    const pts = [...curvePoints].sort((a,b)=>a[0]-b[0]);
    const lut = new Uint8ClampedArray(256);
    // With only the two default endpoints, stay a straight line (no curvature)
    // until the user actually adds a third point to bend it.
    if(pts.length<=2){
      const [x0,y0]=pts[0], [x1,y1]=pts[pts.length-1];
      for(let x=0;x<256;x++){
        const t = x1===x0 ? 0 : Math.min(1,Math.max(0,(x-x0)/(x1-x0)));
        lut[x] = y0 + (y1-y0)*t;
      }
      return lut;
    }
    for(let x=0;x<256;x++){
      let i=0;
      while(i<pts.length-2 && pts[i+1][0]<x) i++;
      const p0 = pts[Math.max(0,i-1)], p1=pts[i], p2=pts[Math.min(pts.length-1,i+1)], p3=pts[Math.min(pts.length-1,i+2)];
      let t = (p2[0]===p1[0]) ? 0 : (x-p1[0])/(p2[0]-p1[0]);
      t = Math.min(1,Math.max(0,t));
      // Catmull-Rom
      const t2=t*t, t3=t2*t;
      const y = 0.5*((2*p1[1]) + (p2[1]-p0[1])*t + (2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2 + (3*p1[1]-p0[1]-3*p2[1]+p3[1])*t3);
      lut[x] = y;
    }
    return lut;
  }
  function drawCurveEditor(){
    cctx.clearRect(0,0,CURVE_W,CURVE_H);
    cctx.fillStyle='#101214'; cctx.fillRect(0,0,CURVE_W,CURVE_H);
    cctx.strokeStyle='#2c3137'; cctx.lineWidth=1;
    for(let i=1;i<4;i++){
      const gx=i*CURVE_W/4, gy=i*CURVE_H/4;
      cctx.beginPath(); cctx.moveTo(gx,0); cctx.lineTo(gx,CURVE_H); cctx.stroke();
      cctx.beginPath(); cctx.moveTo(0,gy); cctx.lineTo(CURVE_W,gy); cctx.stroke();
    }
    const lut = buildLUT();
    cctx.strokeStyle='#4fd1c5'; cctx.lineWidth=2;
    cctx.beginPath();
    for(let x=0;x<256;x++){
      const [sx,sy] = curveToScreen([x,lut[x]]);
      if(x===0) cctx.moveTo(sx,sy); else cctx.lineTo(sx,sy);
    }
    cctx.stroke();
    cctx.fillStyle='#e7e9ec';
    for(const p of curvePoints){
      const [sx,sy]=curveToScreen(p);
      cctx.beginPath(); cctx.arc(sx,sy,4,0,Math.PI*2); cctx.fill();
    }
    return lut;
  }
  function runCurvePreview(){
    beginEdit();
    sessionDirty = true;
    const lut = drawCurveEditor();
    previewEffect((data)=>{
      for(let i=0;i<data.length;i+=4){
        data[i]=lut[data[i]]; data[i+1]=lut[data[i+1]]; data[i+2]=lut[data[i+2]];
      }
      return data;
    });
  }
  curveCanvas.addEventListener('pointerdown', e=>{
    const [x,y] = curvePointerPos(e);
    let found=-1, best=16;
    curvePoints.forEach((p,idx)=>{
      const [sx,sy]=curveToScreen(p);
      const d = Math.hypot(sx-x,sy-y);
      if(d<best){best=d;found=idx;}
    });
    if(found>=0){ draggingPointIdx=found; }
    else{
      const [cx,cy] = screenToCurve(x,y);
      curvePoints.push([cx,cy]);
      draggingPointIdx = curvePoints.length-1;
    }
    curveCanvas.setPointerCapture(e.pointerId);
    runCurvePreview();
  });
  // The two edge anchors (x=0 and x=255) must stay identified by VALUE, not by
  // array position — a newly added point is always pushed to the end of
  // curvePoints, so "last index" stops meaning "the right edge" the moment a
  // third point exists. Using the current min/max-x indices keeps the real
  // endpoints x-locked regardless of insertion order.
  function curveEdgeIndices(){
    let minIdx=0, maxIdx=0;
    curvePoints.forEach((p,idx)=>{
      if(p[0]<curvePoints[minIdx][0]) minIdx=idx;
      if(p[0]>curvePoints[maxIdx][0]) maxIdx=idx;
    });
    return [minIdx, maxIdx];
  }
  curveCanvas.addEventListener('pointermove', e=>{
    if(draggingPointIdx<0) return;
    const [x,y] = curvePointerPos(e);
    const [cx,cy] = screenToCurve(x,y);
    const [minIdx,maxIdx] = curveEdgeIndices();
    if(draggingPointIdx===minIdx) curvePoints[draggingPointIdx]=[0,cy];
    else if(draggingPointIdx===maxIdx) curvePoints[draggingPointIdx]=[255,cy];
    else curvePoints[draggingPointIdx]=[cx,cy];
    runCurvePreview();
  });
  curveCanvas.addEventListener('pointerup', ()=>{ draggingPointIdx=-1; });
  curveCanvas.addEventListener('dblclick', e=>{
    if(curvePoints.length<=2) return;
    const [x,y] = curvePointerPos(e);
    let found=-1, best=16;
    curvePoints.forEach((p,idx)=>{
      const [sx,sy]=curveToScreen(p);
      const d = Math.hypot(sx-x,sy-y);
      if(d<best){best=d;found=idx;}
    });
    const [minIdx,maxIdx] = curveEdgeIndices();
    if(found>=0 && found!==minIdx && found!==maxIdx){
      curvePoints.splice(found,1);
      sessionDirty = true;
      runCurvePreview();
    }
  });
  document.getElementById('resetCurveBtn').addEventListener('click', ()=>{
    curvePoints=[[0,0],[255,255]];
    runCurvePreview();
  });
  function applyCurveAction(){ commitEdit(); curvePoints=[[0,0],[255,255]]; drawCurveEditor(); }
  function cancelCurveAction(){ cancelEdit(); curvePoints=[[0,0],[255,255]]; drawCurveEditor(); }
  drawCurveEditor();

  // ---------- Menu → tool mapping ----------
  // There's no standalone tool tab/row: opening the menu that needs a tool arms it
  // directly (lasso for selection); menus that don't touch the canvas arm 'none'.
  // 크롭 is handled separately since it shows/hides the crop-frame overlay, not a tool.
  const MENU_TOOL = {
    'group-draw': 'draw',
    'group-selection': 'lasso',
    'group-resize': 'none',
    'group-effects': 'none',
    'group-sc': 'none',
    'group-levels': 'none',
    'group-curve': 'none'
  };
  function onMenuOpen(id){
    if(id==='group-crop'){
      setTool('none');
      showCropFrame();
    } else {
      if(id==='group-resize') syncResizeInputs();
      if(id==='group-sc') syncSCInputs();
      if(id==='group-draw') drawLayerForSession = null;
      const tool = MENU_TOOL[id];
      if(tool) setTool(tool);
    }
  }
  function onMenuClose(id){
    if(id==='group-crop') hideCropFrame();
  }

  // Every menu commits/discards as one bundled undo step via the header's
  // 적용/취소, instead of each panel having its own apply/cancel buttons.
  const MENU_SESSION = {
    'group-draw': { commit: applyDrawAction, cancel: cancelDrawAction },
    'group-selection': { commit: commitEdit, cancel: cancelEdit },
    'group-crop': { commit: applyCropAction, cancel: cancelCropAction },
    'group-resize': { commit: applyResizeAction, cancel: cancelResizeAction },
    'group-effects': { commit: applyEffectsAction, cancel: cancelEffectsAction },
    'group-sc': { commit: applySCAction, cancel: cancelSCAction },
    'group-levels': { commit: applyLevelsAction, cancel: cancelLevelsAction },
    'group-curve': { commit: applyCurveAction, cancel: cancelCurveAction }
  };

  let activeMenuId = null;

  function enterMenu(id){
    activeMenuId = id;
    beginEdit();
    onMenuOpen(id);
    document.body.classList.add('editing-mode');
    document.body.classList.toggle('crop-editing', id==='group-crop');
  }
  // Visually closes whichever menu is active (deactivates its mobile tab /
  // collapses its desktop section) and returns the header/tab bar to normal.
  function closeMenuUI(){
    if(mobileTabBar){
      mobileTabBar.querySelectorAll('.tab-btn.active').forEach(b=>b.classList.remove('active'));
    }
    sidePanel.querySelectorAll(':scope > .mobile-active').forEach(el=>el.classList.remove('mobile-active'));
    if(activeMenuId){
      const group = document.getElementById(activeMenuId);
      if(group) group.classList.add('collapsed');
    }
    document.body.classList.remove('editing-mode');
    document.body.classList.remove('crop-editing');
    activeMenuId = null;
  }
  function applyActiveMenu(){
    if(!activeMenuId) return;
    endPeek(); // never commit/close while the canvas is showing the "before" peek
    const session = MENU_SESSION[activeMenuId];
    if(session) session.commit();
    onMenuClose(activeMenuId);
    closeMenuUI();
  }
  function cancelActiveMenu(confirmFirst){
    if(!activeMenuId) return;
    endPeek();
    // Skip the confirm entirely when nothing was actually changed in this
    // session — there's nothing to lose, so asking would just be noise.
    if(confirmFirst && sessionDirty && !window.confirm('변경 사항을 삭제할까요?')) return;
    const session = MENU_SESSION[activeMenuId];
    if(session) session.cancel();
    onMenuClose(activeMenuId);
    closeMenuUI();
  }
  menuApplyBtn.addEventListener('click', ()=> applyActiveMenu());
  menuCancelBtn.addEventListener('click', ()=> cancelActiveMenu(true));

  // ---------- Desktop accordion ----------
  // Every group keeps the `open` attribute permanently (see note in the mobile CSS:
  // browsers hide a closed <details>'s content with a UA !important rule that no
  // author style can override, which broke the mobile tab panels). Collapse/expand
  // is instead driven entirely by our own `.collapsed` class. Only one section is
  // ever the "active" editing session at a time — expanding a different one while
  // one is already open silently keeps (applies) whatever was pending in it first.
  document.querySelectorAll('aside#sidePanel > .group > summary').forEach(summary=>{
    summary.addEventListener('click', e=>{
      e.preventDefault();
      const group = summary.parentElement;
      if(group.id===activeMenuId){
        applyActiveMenu();
        return;
      }
      if(activeMenuId) applyActiveMenu();
      document.querySelectorAll('aside#sidePanel > .group').forEach(g=> g.classList.add('collapsed'));
      group.classList.remove('collapsed');
      enterMenu(group.id);
    });
  });

  // ---------- Mobile bottom menu bar ----------
  // The tab bar is only visible when no menu is active (see the editing-mode CSS),
  // so a tab tap here always means "open a fresh menu" — closing always goes
  // through the header's 적용/취소 first.
  if(mobileTabBar){
    const tabButtons = mobileTabBar.querySelectorAll('.tab-btn');
    tabButtons.forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const targetEl = document.getElementById(btn.dataset.target);
        if(!targetEl) return;
        btn.classList.add('active');
        targetEl.classList.add('mobile-active');
        targetEl.classList.remove('collapsed');
        enterMenu(btn.dataset.target);
      });
    });
  }

  // ---------- Download ----------
  downloadBtn.addEventListener('click', ()=>{
    mainCanvas.toBlob(blob=>{
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'edited-image.png';
      a.click();
      URL.revokeObjectURL(a.href);
    }, 'image/png');
  });

})();
</script>
</body>
</html>
