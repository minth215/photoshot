<script>
(function(){
  const fileInput = document.getElementById('fileInput');
  const stageWrap = document.getElementById('stageWrap');
  const emptyState = document.getElementById('emptyState');
  const canvasHolder = document.getElementById('canvasHolder');
  const sidePanel = document.getElementById('sidePanel');
  const sideGroups = document.getElementById('sideGroups');
  const mainCanvas = document.getElementById('mainCanvas');
  const overlayCanvas = document.getElementById('overlayCanvas');
  const ctx = mainCanvas.getContext('2d', {willReadFrequently:true});
  const octx = overlayCanvas.getContext('2d');
  const dimsInfo = document.getElementById('dimsInfo');
  const downloadBtn = document.getElementById('downloadBtn');
  const undoBtn = document.getElementById('undoBtn');
  const resetBtn = document.getElementById('resetBtn');
  const closeBtn = document.getElementById('closeBtn');
  const mobileTabBar = document.getElementById('mobileTabBar');
  const menuCancelBtn = document.getElementById('menuCancelBtn');
  const menuApplyBtn = document.getElementById('menuApplyBtn');
  const headerCropSize = document.getElementById('headerCropSize');
  const layerToggleBtn = document.getElementById('layerToggleBtn');
  const layerPanel = document.getElementById('layerPanel');
  const layerList = document.getElementById('layerList');

  // ---------- Desktop layout: layer panel docked in the sidebar ----------
  // Same breakpoint as the mobile stylesheet (max-width:860px) so the two
  // never disagree about which layout is active.
  const desktopMedia = window.matchMedia('(min-width: 861px)');
  function isDesktopLayout(){ return desktopMedia.matches; }
  // On desktop the layer panel lives permanently at the bottom of the right
  // sidebar (Photoshop-style) instead of behind the floating bookmark toggle;
  // on mobile it stays exactly where it always was. The same DOM node moves
  // between the two spots rather than duplicating the panel/list markup.
  function syncLayerPanelDock(){
    if(isDesktopLayout()){
      if(layerPanel.parentElement!==sidePanel) sidePanel.appendChild(layerPanel);
      layerPanel.classList.add('docked');
      layerPanel.classList.remove('collapsed');
    } else {
      if(layerPanel.parentElement!==stageWrap) layerToggleBtn.insertAdjacentElement('afterend', layerPanel);
      layerPanel.classList.remove('docked');
    }
  }
  syncLayerPanelDock();
  desktopMedia.addEventListener('change', syncLayerPanelDock);

  function updateHistoryButtons(){
    undoBtn.disabled = undoStack.length===0;
    resetBtn.disabled = redoStack.length===0;
  }

  const MAX_DIM = 1400;

  // mask canvas (detached, alpha channel = selection strength 0..255) — the
  // selection is a single document-wide mask shared by every layer, not
  // per-layer data.
  const maskCanvas = document.createElement('canvas');
  const mctx = maskCanvas.getContext('2d', {willReadFrequently:true});
  let hasSelection = false;

  // 배경 제거's own "keep" mask (255=keep, 0=removed) — separate from the
  // shared selection mask above, scoped to a single 배경 제거 session.
  const bgMaskCanvas = document.createElement('canvas');
  const bgMaskCtx = bgMaskCanvas.getContext('2d', {willReadFrequently:true});

  let currentTool = 'none';
  let undoStack = [];
  let redoStack = [];

  let editingSnapshot = null; // full-document snapshot taken before a live-preview edit begins

  // ---------- Layers ----------
  // Each layer owns its own full-size offscreen canvas; mainCanvas holds only
  // the composited result and is never drawn into directly except by
  // compositeLayers(). Layer order in the array is bottom-to-top.
  let layers = [];
  let activeLayerId = null;
  let nextLayerId = 1;

  // Photoshop-style blend modes mapped to their native canvas equivalents
  // (identical algorithms for every mode here, so no per-pixel JS blending
  // is needed — the browser composites them directly).
  const BLEND_MODES = [
    ['normal','표준'],
    ['darken','어둡게 하기'],
    ['multiply','곱하기'],
    ['color-burn','색상 번'],
    ['linear-burn','선형 번'],
    ['lighten','밝게 하기'],
    ['screen','스크린'],
    ['color-dodge','색상 닷지'],
    ['lighter','선형 닷지(추가)'],
    ['overlay','오버레이'],
    ['soft-light','소프트 라이트'],
    ['hard-light','하드 라이트'],
    ['difference','차이'],
    ['exclusion','제외'],
    ['hue','색조'],
    ['saturation','채도'],
    ['color','색상'],
    ['luminosity','광도']
  ];

  function makeLayerCanvas(w,h){
    const canvas = document.createElement('canvas');
    canvas.width = w; canvas.height = h;
    return { canvas, ctx: canvas.getContext('2d', {willReadFrequently:true}) };
  }
  function createLayer(name, w, h){
    const {canvas, ctx:lctx} = makeLayerCanvas(w,h);
    return { id: nextLayerId++, name, canvas, ctx: lctx, visible:true, locked:false, opacity:1, blendMode:'normal',
      adjustmentType:null, adjustmentParams:null, adjustmentSourceLayerId:null, adjustmentMaskThumb:null };
  }
  // Creates a layer at (w,h) copying id/name/visible/locked/opacity/blendMode
  // from a snapshot entry, but leaves its canvas blank — for callers that are
  // about to draw scaled/rotated/cropped content into it themselves.
  function layerShellFromSnapshot(ls, w, h){
    const {canvas, ctx:lctx} = makeLayerCanvas(w,h);
    return { id: ls.id, name: ls.name, canvas, ctx: lctx, visible: ls.visible, locked: ls.locked, opacity: ls.opacity, blendMode: ls.blendMode||'normal',
      adjustmentType: ls.adjustmentType||null, adjustmentParams: ls.adjustmentParams||null, adjustmentSourceLayerId: ls.adjustmentSourceLayerId||null,
      adjustmentMaskThumb: ls.adjustmentMaskThumb||null };
  }
  function layerFromSnapshot(ls, w, h){
    const layer = layerShellFromSnapshot(ls, w, h);
    layer.ctx.putImageData(ls.img, 0, 0);
    return layer;
  }
  // Restores just the layer stack + active layer from a snapshot (dims, mask
  // and selection are untouched) — used by the per-stroke undo/redo in the
  // 그리기 menu, which never changes anything else.
  function restoreLayersFrom(snap){
    layers = snap.layers.map(ls => layerFromSnapshot(ls, snap.w, snap.h));
    activeLayerId = snap.activeLayerId;
    compositeLayers();
    renderLayerPanel();
  }
  function activeLayer(){
    return layers.find(l => l.id===activeLayerId) || layers[layers.length-1] || null;
  }
  // Blend modes with no native canvas globalCompositeOperation equivalent —
  // composited manually, per the standard (Cb,Cs) -> B formula, since the
  // browser has nothing to fall back to for these.
  const MANUAL_BLEND_MODES = {
    'linear-burn': (Cb,Cs)=> Math.max(0, Cb+Cs-1)
  };
  function compositeManualBlend(blendFn, layerCanvas, opacity){
    const w = mainCanvas.width, h = mainCanvas.height;
    if(!w || !h) return;
    const backdrop = ctx.getImageData(0,0,w,h);
    const bd = backdrop.data;
    const sd = layerCanvas.getContext('2d').getImageData(0,0,w,h).data;
    for(let i=0;i<bd.length;i+=4){
      const as = (sd[i+3]/255) * opacity;
      if(as<=0) continue;
      const ab = bd[i+3]/255;
      if(ab<=0){
        bd[i]=sd[i]; bd[i+1]=sd[i+1]; bd[i+2]=sd[i+2]; bd[i+3]=Math.round(as*255);
        continue;
      }
      const ao = as + ab*(1-as);
      for(let c=0;c<3;c++){
        const Cb = bd[i+c]/255, Cs = sd[i+c]/255;
        const B = blendFn(Cb,Cs);
        const blendedSrc = (1-ab)*Cs + ab*B;
        const Co = as*blendedSrc + (1-as)*ab*Cb;
        bd[i+c] = Math.round((Co/ao)*255);
      }
      bd[i+3] = Math.round(ao*255);
    }
    ctx.putImageData(backdrop,0,0);
  }
  function compositeLayers(){
    ctx.clearRect(0,0,mainCanvas.width,mainCanvas.height);
    layers.forEach(l=>{
      if(!l.visible) return;
      const manualBlend = l.blendMode && MANUAL_BLEND_MODES[l.blendMode];
      if(manualBlend){
        compositeManualBlend(manualBlend, l.canvas, l.opacity);
        return;
      }
      ctx.globalAlpha = l.opacity;
      ctx.globalCompositeOperation = (l.blendMode && l.blendMode!=='normal') ? l.blendMode : 'source-over';
      ctx.drawImage(l.canvas,0,0);
    });
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
  // Pure per-pixel effect, driven entirely by a layer's own stored
  // adjustmentParams rather than the live editing-session globals — lets
  // rebuildDependentAdjustmentLayers() re-derive a layer's pixels from
  // whatever's now below it without disturbing any menu that's actually open.
  function computeAdjustmentEffect(type, params, data){
    if(type==='sc'){
      const values = params.scValues;
      for(let i=0;i<data.length;i+=4){
        const r=data[i], g=data[i+1], b=data[i+2];
        const [c,m,y,k] = scAggregate(r,g,b,values);
        let R = scAdjustChannel(r, c/100);
        let G = scAdjustChannel(g, m/100);
        let B = scAdjustChannel(b, y/100);
        const dk = k/100;
        if(dk>=0){ R*=(1-dk); G*=(1-dk); B*=(1-dk); }
        else { R += (255-R)*(-dk); G += (255-G)*(-dk); B += (255-B)*(-dk); }
        data[i]=R; data[i+1]=G; data[i+2]=B;
      }
      return data;
    }
    if(type==='levels'){
      const gamma = params.gamma/100;
      const lut = new Uint8ClampedArray(256);
      for(let v=0;v<256;v++){
        let x = (v-params.inB)/Math.max(1,(params.inW-params.inB));
        x = Math.min(1,Math.max(0,x));
        x = Math.pow(x, 1/gamma);
        lut[v] = params.outB + x*(params.outW-params.outB);
      }
      for(let i=0;i<data.length;i+=4){
        data[i]=lut[data[i]]; data[i+1]=lut[data[i+1]]; data[i+2]=lut[data[i+2]];
      }
      return data;
    }
    if(type==='curve'){
      const lut = buildLUT(params.points);
      for(let i=0;i<data.length;i+=4){
        data[i]=lut[data[i]]; data[i+1]=lut[data[i+1]]; data[i+2]=lut[data[i+2]];
      }
      return data;
    }
    return data;
  }
  // Whenever a layer's visibility changes, every 선택색상/레벨/곡선 layer
  // stacked above it needs its baked pixels re-derived from whatever is now
  // actually showing underneath — otherwise (a) turning off a background
  // layer leaves the adjustment layers above it showing their old frozen
  // result instead of disappearing with it, and (b) turning off a middle
  // adjustment layer has no visible effect, since the ones above it were
  // baked from its output and never re-rendered. Layers created against a
  // selection (adjustmentMaskThumb set) are left as-is: only their small UI
  // thumbnail mask is kept, not the full-resolution mask needed to redo the
  // partial blend, so they keep their original frozen pixels.
  function rebuildDependentAdjustmentLayers(fromIndex){
    const w = mainCanvas.width, h = mainCanvas.height;
    if(!w || !h) return;
    for(let i=fromIndex+1;i<layers.length;i++){
      const l = layers[i];
      if(!l.adjustmentType || !l.adjustmentParams || l.adjustmentMaskThumb) continue;
      ctx.clearRect(0,0,w,h);
      for(let j=0;j<i;j++){
        const bl = layers[j];
        if(!bl.visible) continue;
        const manualBlend = bl.blendMode && MANUAL_BLEND_MODES[bl.blendMode];
        if(manualBlend){ compositeManualBlend(manualBlend, bl.canvas, bl.opacity); continue; }
        ctx.globalAlpha = bl.opacity;
        ctx.globalCompositeOperation = (bl.blendMode && bl.blendMode!=='normal') ? bl.blendMode : 'source-over';
        ctx.drawImage(bl.canvas,0,0);
      }
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'source-over';
      const baseData = ctx.getImageData(0,0,w,h);
      const effectData = computeAdjustmentEffect(l.adjustmentType, l.adjustmentParams, baseData.data);
      l.ctx.clearRect(0,0,w,h);
      l.ctx.putImageData(new ImageData(effectData,w,h),0,0);
    }
  }
  function selectLayer(id){
    if(id===activeLayerId) return;
    activeLayerId = id;
    renderLayerPanel();
    updateLockedLayerWarning();
  }
  // 효과/선택색상/레벨/곡선 all silently no-op when the active layer is locked
  // (see previewEffect's `if(!layer || layer.locked) return;` guard) — this
  // surfaces WHY nothing is happening instead of leaving it unexplained.
  const lockedLayerWarning = document.getElementById('lockedLayerWarning');
  function updateLockedLayerWarning(){
    // During a 선택색상/레벨/곡선 session the layer actually being written to
    // is previewTargetLayerId, not necessarily activeLayerId (a fresh
    // adjustment leaves activeLayerId pointing at its untouched source).
    const layer = previewTargetLayerId!=null ? layers.find(l=>l.id===previewTargetLayerId) : activeLayer();
    lockedLayerWarning.hidden = !(PEEK_MENUS.has(activeMenuId) && !!(layer && layer.locked));
  }
  function svgEye(open){
    return open
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a21.6 21.6 0 0 1 5.06-5.94M9.9 4.24A10.94 10.94 0 0 1 12 5c7 0 11 7 11 7a21.6 21.6 0 0 1-2.68 3.9M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  }
  function svgLock(locked){
    return locked
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 9.5-2.2"/></svg>';
  }
  // Press-and-hold (not a quick tap) on a layer row starts a drag that
  // reorders layers by z-index as the row crosses its neighbors.
  function attachLayerDrag(row, layer){
    const HOLD_MS = 260, MOVE_CANCEL_PX = 8;
    let holdTimer = null, dragging = false, startY = 0, lastY = 0, scrolling = false, preDragSnapshot = null;
    function onDown(e){
      if(e.target.closest('.layer-icon-btn,.layer-opacity-row,.layer-blend-row')) return;
      startY = e.clientY;
      lastY = e.clientY;
      scrolling = false;
      holdTimer = setTimeout(()=>{
        holdTimer = null;
        dragging = true;
        preDragSnapshot = snapshotState();
        row.classList.add('dragging');
        try{ row.setPointerCapture(e.pointerId); }catch(err){}
      }, HOLD_MS);
    }
    function onMove(e){
      if(dragging){
        const rows = [...layerList.querySelectorAll('.layer-row')];
        const idx = rows.indexOf(row);
        const y = e.clientY;
        for(let i=0;i<rows.length;i++){
          if(rows[i]===row) continue;
          const r = rows[i].getBoundingClientRect();
          const mid = r.top + r.height/2;
          if((i<idx && y<mid) || (i>idx && y>mid)){
            layerList.insertBefore(row, i<idx ? rows[i] : rows[i].nextSibling);
            const newTopToBottomIds = [...layerList.querySelectorAll('.layer-row')].map(r2=>parseInt(r2.dataset.layerId,10));
            const idToLayer = new Map(layers.map(l=>[l.id,l]));
            layers = newTopToBottomIds.slice().reverse().map(id=>idToLayer.get(id));
            compositeLayers();
            break;
          }
        }
        return;
      }
      // The row needs touch-action:none for the hold-to-drag gesture below to
      // have full control from the very start of a touch (a native pan-y here
      // would race the hold timer for who owns the gesture) — which means a
      // quick swipe before the hold fires has to scroll the list manually,
      // since the browser's own touch scrolling is disabled for this element.
      const dy = e.clientY - lastY;
      lastY = e.clientY;
      if(!scrolling && holdTimer && Math.abs(e.clientY-startY) > MOVE_CANCEL_PX){
        clearTimeout(holdTimer); holdTimer=null;
        scrolling = true;
      }
      if(scrolling) layerList.scrollTop -= dy;
    }
    function onUp(e){
      if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; }
      scrolling = false;
      if(dragging){
        dragging = false;
        if(preDragSnapshot) pushUndo(preDragSnapshot);
        preDragSnapshot = null;
        renderLayerPanel();
      }
    }
    row.addEventListener('pointerdown', onDown);
    row.addEventListener('pointermove', onMove);
    row.addEventListener('pointerup', onUp);
    row.addEventListener('pointercancel', onUp);
  }
  function renderLayerPanel(){
    layerList.innerHTML = '';
    // Top of the visual list = top of the stack, i.e. reverse of storage order.
    for(let i=layers.length-1; i>=0; i--){
      const layer = layers[i];
      const row = document.createElement('div');
      row.className = 'layer-row' + (layer.id===activeLayerId ? ' selected' : '');
      row.dataset.layerId = layer.id;
      row.innerHTML =
        '<canvas class="layer-thumb"></canvas>' +
        '<span class="layer-name"></span>' +
        '<button type="button" class="layer-icon-btn layer-eye" title="표시/숨기기" aria-label="표시/숨기기"></button>' +
        '<button type="button" class="layer-icon-btn layer-lock" title="잠금" aria-label="잠금"></button>' +
        '<div class="layer-blend-row"><select class="layer-blend"></select></div>' +
        '<div class="layer-opacity-row"><input type="range" class="layer-opacity" min="0" max="100"><span class="layer-opacity-val"></span></div>';
      row.querySelector('.layer-name').textContent = layer.name;
      const eyeBtn = row.querySelector('.layer-eye');
      eyeBtn.innerHTML = svgEye(layer.visible);
      eyeBtn.classList.toggle('off', !layer.visible);
      const lockBtn = row.querySelector('.layer-lock');
      lockBtn.innerHTML = svgLock(layer.locked);
      lockBtn.classList.toggle('on', layer.locked);
      const blendSelect = row.querySelector('.layer-blend');
      BLEND_MODES.forEach(([value,label])=>{
        const opt = document.createElement('option');
        opt.value = value; opt.textContent = label;
        blendSelect.appendChild(opt);
      });
      blendSelect.value = layer.blendMode || 'normal';
      const opacityInput = row.querySelector('.layer-opacity');
      opacityInput.value = Math.round(layer.opacity*100);
      row.querySelector('.layer-opacity-val').textContent = Math.round(layer.opacity*100)+'%';
      layerList.appendChild(row);

      const thumb = row.querySelector('.layer-thumb');
      thumb.width = 28; thumb.height = 28;
      const tctx = thumb.getContext('2d');
      if(layer.adjustmentType){
        // 선택색상/레벨/곡선 layers show the region they affect instead of the
        // (fully-replaced) image content: solid black when applied to the
        // whole layer, or black-over-white matching the selection that was
        // active when the adjustment was created.
        tctx.fillStyle = '#fff'; tctx.fillRect(0,0,28,28);
        if(layer.adjustmentMaskThumb) tctx.drawImage(layer.adjustmentMaskThumb,0,0,28,28);
        else { tctx.fillStyle = '#000'; tctx.fillRect(0,0,28,28); }
      } else {
        tctx.fillStyle = '#000'; tctx.fillRect(0,0,28,28);
        if(layer.canvas.width && layer.canvas.height) tctx.drawImage(layer.canvas,0,0,28,28);
      }

      row.addEventListener('click', e=>{
        if(e.target.closest('.layer-icon-btn,.layer-opacity-row,.layer-blend-row')) return;
        // Picking a different layer while a 선택색상/레벨/곡선 session is open
        // acts like pressing 취소 first — prompting only if something was
        // actually changed — rather than leaving that session dangling open
        // underneath the newly-selected layer.
        if(layer.id!==activeLayerId && ADJUSTMENT_MENU_IDS.has(activeMenuId)){
          if(sessionDirty && !window.confirm('변경 사항을 삭제할까요?')) return;
          cancelActiveMenu(false);
        }
        selectLayer(layer.id);
        if(layer.adjustmentType){
          const menuId = ADJUSTMENT_MENU_ID[layer.adjustmentType];
          if(menuId) openMenuFromLayerRow(menuId);
        }
      });
      eyeBtn.addEventListener('click', e=>{
        e.stopPropagation();
        pushUndo(snapshotState());
        layer.visible = !layer.visible;
        rebuildDependentAdjustmentLayers(layers.indexOf(layer));
        compositeLayers();
        renderLayerPanel();
      });
      lockBtn.addEventListener('click', e=>{
        e.stopPropagation();
        pushUndo(snapshotState());
        layer.locked = !layer.locked;
        renderLayerPanel();
        updateLockedLayerWarning();
      });
      blendSelect.addEventListener('click', e=> e.stopPropagation());
      blendSelect.addEventListener('change', ()=>{
        pushUndo(snapshotState());
        layer.blendMode = blendSelect.value;
        compositeLayers();
      });
      let opacityPreDrag = null;
      opacityInput.addEventListener('pointerdown', e=>{ e.stopPropagation(); opacityPreDrag = snapshotState(); });
      opacityInput.addEventListener('input', ()=>{
        layer.opacity = parseInt(opacityInput.value,10)/100;
        row.querySelector('.layer-opacity-val').textContent = opacityInput.value+'%';
        compositeLayers();
      });
      opacityInput.addEventListener('change', ()=>{
        if(opacityPreDrag){ pushUndo(opacityPreDrag); opacityPreDrag=null; }
      });
      attachLayerDrag(row, layer);
    }
  }
  function toggleLayerPanel(){
    layerPanel.classList.toggle('collapsed');
    const isOpen = !layerPanel.classList.contains('collapsed');
    layerToggleBtn.classList.toggle('active', isOpen);
    // The bookmark tab hides while the panel is open — the panel's own CSS
    // grows up into the space it left behind (see .layer-panel:not(.collapsed)).
    // Desktop keeps the bookmark permanently hidden via its own !important
    // rule regardless of this.
    layerToggleBtn.style.display = isOpen ? 'none' : 'flex';
  }
  layerToggleBtn.addEventListener('click', toggleLayerPanel);
  // On mobile the bookmark tab hides while the panel is open (see the
  // .layer-tab-btn CSS rule) — the panel grows up into the space it left
  // behind, and clicking anywhere on its header row (except the + button)
  // becomes the way to collapse it again.
  document.querySelector('.layer-panel-header').addEventListener('click', e=>{
    if(e.target.closest('#addLayerBtn')) return;
    toggleLayerPanel();
  });
  const addLayerBtn = document.getElementById('addLayerBtn');
  addLayerBtn.addEventListener('click', ()=>{
    if(!mainCanvas.width || !mainCanvas.height) return;
    pushUndo(snapshotState());
    const layer = createLayer('레이어 '+(layers.length+1), mainCanvas.width, mainCanvas.height);
    layers.push(layer);
    activeLayerId = layer.id;
    compositeLayers();
    renderLayerPanel();
  });

  function setCanvasSize(w,h){
    const dimsChanged = (mainCanvas.width!==w || mainCanvas.height!==h);
    mainCanvas.width = w; mainCanvas.height = h;
    overlayCanvas.width = w; overlayCanvas.height = h;
    maskCanvas.width = w; maskCanvas.height = h;
    mctx.clearRect(0,0,w,h);
    // Only auto-fit on a real dimension change (e.g. rotation growing the bounding
    // box) when the user hasn't manually zoomed — otherwise a pinch-zoom running
    // together with a pinch-rotate would have its scale stomped back to auto-fit
    // on every frame the rotation also changes the canvas size.
    if(dimsChanged && !userZoomed) fitToScreen(); else applyCanvasDisplaySize();
  }

  function updateDims(){
    dimsInfo.textContent = mainCanvas.width + ' × ' + mainCanvas.height + ' px';
  }

  // ---------- Zoom (fit-to-screen + pinch) ----------
  // The canvas's own width/height attributes (the pixel buffer) never change here,
  // only their CSS display size — so the underlying image data stays full quality.
  let viewScale = 1;
  let userZoomed = false;
  const MIN_ZOOM = 0.15, MAX_ZOOM = 8;

  function stageAvailSize(){
    const cs = getComputedStyle(stageWrap);
    const padX = parseFloat(cs.paddingLeft)+parseFloat(cs.paddingRight);
    const padY = parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom);
    return {
      w: Math.max(50, stageWrap.clientWidth-padX),
      h: Math.max(50, stageWrap.clientHeight-padY)
    };
  }

  function computeFitScale(){
    if(!mainCanvas.width || !mainCanvas.height) return 1;
    const {w:availW, h:availH} = stageAvailSize();
    return Math.min(1, availW/mainCanvas.width, availH/mainCanvas.height);
  }

  // Two-finger panning (outside crop mode) offsets the image from center via a
  // CSS transform — panOffset is in CSS px and clamped so the image can't be
  // dragged entirely out of view.
  let panOffsetX = 0, panOffsetY = 0;
  function clampPanOffset(){
    const avail = stageAvailSize();
    const dispW = mainCanvas.width*viewScale, dispH = mainCanvas.height*viewScale;
    const maxX = Math.max(0, (dispW-avail.w)/2), maxY = Math.max(0, (dispH-avail.h)/2);
    panOffsetX = Math.max(-maxX, Math.min(maxX, panOffsetX));
    panOffsetY = Math.max(-maxY, Math.min(maxY, panOffsetY));
  }

  // While the crop menu is active, the canvas's on-screen position/size is driven
  // entirely by the crop pan/zoom state (see renderCropFrame), not by viewScale —
  // otherwise a rotation-triggered dimension change during crop editing would
  // stomp the crop-specific zoom back to a plain fit-to-screen.
  function applyCanvasDisplaySize(){
    if(cropModeActive){ renderCropFrame(); return; }
    const w = Math.round(mainCanvas.width*viewScale);
    const h = Math.round(mainCanvas.height*viewScale);
    mainCanvas.style.width = w+'px';
    mainCanvas.style.height = h+'px';
    overlayCanvas.style.width = w+'px';
    overlayCanvas.style.height = h+'px';
    const t = `translate(${panOffsetX}px, ${panOffsetY}px)`;
    mainCanvas.style.transform = t;
    overlayCanvas.style.transform = t;
  }

  function fitToScreen(){
    viewScale = computeFitScale();
    userZoomed = false;
    panOffsetX = 0; panOffsetY = 0;
    applyCanvasDisplaySize();
  }

  function setViewScale(s){
    viewScale = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, s));
    userZoomed = true;
    clampPanOffset();
    applyCanvasDisplaySize();
  }

  // ---------- Mouse wheel zoom (PC): zooms toward the cursor, in both the
  // normal view and while the 크롭 frame is active. ----------
  function zoomAt(clientX, clientY, factor){
    if(!mainCanvas.width || !mainCanvas.height) return;
    if(cropModeActive){
      const rectOld = mainCanvas.getBoundingClientRect();
      const oldScale = imgScale;
      const imgX = (clientX-rectOld.left)/oldScale, imgY = (clientY-rectOld.top)/oldScale;
      imgScale = clampImgScale(oldScale*factor);
      renderCropFrame();
      const rectNew = mainCanvas.getBoundingClientRect();
      imgOffsetX += clientX - (rectNew.left + imgX*imgScale);
      imgOffsetY += clientY - (rectNew.top + imgY*imgScale);
      clampImgOffset();
      renderCropFrame();
    } else {
      const rectOld = mainCanvas.getBoundingClientRect();
      const oldScale = viewScale;
      const imgX = (clientX-rectOld.left)/oldScale, imgY = (clientY-rectOld.top)/oldScale;
      viewScale = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, oldScale*factor));
      userZoomed = true;
      applyCanvasDisplaySize();
      const rectNew = mainCanvas.getBoundingClientRect();
      panOffsetX += clientX - (rectNew.left + imgX*viewScale);
      panOffsetY += clientY - (rectNew.top + imgY*viewScale);
      clampPanOffset();
      applyCanvasDisplaySize();
    }
  }
  stageWrap.addEventListener('wheel', e=>{
    if(!mainCanvas.width || !mainCanvas.height) return;
    e.preventDefault();
    const factor = Math.exp(-e.deltaY*0.0015);
    zoomAt(e.clientX, e.clientY, factor);
  }, { passive:false });

  // Re-fit whenever the visible image area's actual box size changes — a window
  // resize, but also opening/closing/switching a mobile control panel, since those
  // now push the image area rather than floating over it (so its available height
  // varies by menu and the image should always fill whatever room is left).
  new ResizeObserver(()=>{
    if(cropModeActive){
      const avail = stageAvailSize();
      cropViewportW = avail.w; cropViewportH = avail.h;
      canvasHolder.style.width = cropViewportW+'px';
      canvasHolder.style.height = cropViewportH+'px';
      frameW = Math.min(frameW, cropViewportW);
      frameH = Math.min(frameH, cropViewportH);
      imgScale = clampImgScale(imgScale);
      clampImgOffset();
      renderCropFrame();
    } else if(!userZoomed){
      fitToScreen();
    } else {
      clampPanOffset();
      applyCanvasDisplaySize();
    }
  }).observe(stageWrap);

  // ---------- File loading ----------
  // Shared by both the local file picker and the URL-import form — takes a
  // loaded <img> (already decoded) and makes it the document's base layer.
  function finishImageLoad(img){
    let w = img.naturalWidth, h = img.naturalHeight;
    const scale = Math.min(1, MAX_DIM / Math.max(w,h));
    w = Math.round(w*scale); h = Math.round(h*scale);
    setCanvasSize(w,h);
    nextLayerId = 1;
    const baseLayer = createLayer('배경', w, h);
    baseLayer.ctx.drawImage(img,0,0,w,h);
    layers = [baseLayer];
    activeLayerId = baseLayer.id;
    hasSelection = false;
    undoStack = [];
    redoStack = [];
    document.body.classList.remove('no-image');
    emptyState.style.display='none';
    canvasHolder.style.display='block';
    sidePanel.style.display='block';
    layerToggleBtn.style.display='flex';
    updateHistoryButtons();
    syncResizeInputs();
    updateDims();
    compositeLayers();
    renderSelectionOverlay();
    renderLayerPanel();
    setTool('none');
    downloadBtn.disabled=false;
    closeBtn.disabled=false;
    if(profileAutomationMode) startForcedSquareCrop();
  }
  fileInput.addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      finishImageLoad(img);
      URL.revokeObjectURL(url);
    };
    img.src = url;
  });

  // ---------- URL import ----------
  const emptyStateActions = document.getElementById('emptyStateActions');
  const urlImportBtn = document.getElementById('urlImportBtn');
  const urlImportForm = document.getElementById('urlImportForm');
  const urlImportInput = document.getElementById('urlImportInput');
  const urlImportConfirm = document.getElementById('urlImportConfirm');
  const urlImportCancel = document.getElementById('urlImportCancel');
  const urlImportError = document.getElementById('urlImportError');
  function showUrlImportError(msg){
    urlImportError.textContent = msg;
    urlImportError.hidden = false;
  }
  function openUrlImportForm(){
    emptyStateActions.hidden = true;
    urlImportForm.hidden = false;
    urlImportError.hidden = true;
    urlImportInput.value = '';
    urlImportInput.focus();
  }
  function closeUrlImportForm(){
    urlImportForm.hidden = true;
    emptyStateActions.hidden = false;
    urlImportConfirm.disabled = false;
    urlImportConfirm.textContent = '가져오기';
  }
  urlImportBtn.addEventListener('click', openUrlImportForm);
  urlImportCancel.addEventListener('click', closeUrlImportForm);
  function importImageFromUrl(){
    const raw = urlImportInput.value.trim();
    if(!raw){ showUrlImportError('이미지 URL을 입력해주세요.'); return; }
    let parsed;
    try{ parsed = new URL(raw); }catch(err){ showUrlImportError('올바른 URL 형식이 아니에요.'); return; }
    if(parsed.protocol!=='http:' && parsed.protocol!=='https:'){
      showUrlImportError('http/https URL만 지원해요.');
      return;
    }
    urlImportError.hidden = true;
    urlImportConfirm.disabled = true;
    urlImportConfirm.textContent = '불러오는 중…';
    const img = new Image();
    // Needed so the loaded pixels aren't canvas-tainted — every feature here
    // (undo, export, effects) reads pixel data back out via getImageData.
    // If the remote server doesn't send CORS headers, the load itself fails
    // below rather than silently producing a canvas nothing else can read.
    img.crossOrigin = 'anonymous';
    img.onload = ()=>{
      finishImageLoad(img);
      closeUrlImportForm();
    };
    img.onerror = ()=>{
      urlImportConfirm.disabled = false;
      urlImportConfirm.textContent = '가져오기';
      showUrlImportError('이미지를 불러오지 못했어요. URL이 맞는지, 그리고 그 서버가 외부 사이트의 이미지 사용을 허용하는지(CORS) 확인해주세요.');
    };
    img.src = parsed.href;
  }
  urlImportConfirm.addEventListener('click', importImageFromUrl);
  urlImportInput.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ e.preventDefault(); importImageFromUrl(); }
  });

  // ---------- 프로필 사진 자동화 모드 ----------
  // Clicking the start-page cat toggles a mode that, on the next image import
  // (file or URL), forces a square crop (no escape without one) and then
  // auto-runs a fixed profile-photo pipeline. Purely a start-page toggle —
  // it has no effect once an image is already loaded.
  let profileAutomationMode = false;
  const profileModeCat = document.getElementById('profileModeCat');
  const profileModeLabel = document.getElementById('profileModeLabel');
  function setProfileAutomationMode(on){
    profileAutomationMode = on;
    profileModeLabel.hidden = !on;
  }
  profileModeCat.addEventListener('click', ()=> setProfileAutomationMode(!profileAutomationMode));
  profileModeCat.addEventListener('keydown', e=>{
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); setProfileAutomationMode(!profileAutomationMode); }
  });

  // ---------- Undo ----------
  // A snapshot captures the WHOLE document: every layer's pixels plus its
  // visibility/lock/opacity/blend mode/order, the active layer, and the
  // shared selection mask — since any of these (not just pixel edits) can be
  // undone.
  function snapshotState(){
    return {
      w: mainCanvas.width, h: mainCanvas.height,
      layers: layers.map(l => ({
        id:l.id, name:l.name, visible:l.visible, locked:l.locked, opacity:l.opacity, blendMode:l.blendMode,
        adjustmentType: l.adjustmentType||null,
        adjustmentParams: l.adjustmentParams ? JSON.parse(JSON.stringify(l.adjustmentParams)) : null,
        adjustmentSourceLayerId: l.adjustmentSourceLayerId||null,
        // A small, fixed-size, never-repainted canvas — safe to share by
        // reference across snapshots instead of cloning like the pixel data.
        adjustmentMaskThumb: l.adjustmentMaskThumb||null,
        img: l.ctx.getImageData(0,0,mainCanvas.width,mainCanvas.height)
      })),
      activeLayerId,
      mask: mctx.getImageData(0,0,mainCanvas.width,mainCanvas.height),
      hasSelection
    };
  }
  function pushUndo(preState){
    undoStack.push(preState);
    if(undoStack.length>15) undoStack.shift();
    // A fresh edit branches off from wherever we are — whatever was in the
    // redo stack no longer leads anywhere, so it can't be replayed.
    redoStack = [];
    updateHistoryButtons();
  }
  function restoreState(s){
    setCanvasSize(s.w,s.h);
    layers = s.layers.map(ls => layerFromSnapshot(ls, s.w, s.h));
    activeLayerId = s.activeLayerId;
    mctx.putImageData(s.mask,0,0);
    hasSelection = s.hasSelection;
    updateDims();
    compositeLayers();
    renderSelectionOverlay();
    renderLayerPanel();
  }
  // 실행 취소 (undo) and 되돌리기 (redo) walk the same history in opposite
  // directions: undo pops the last state off undoStack and parks the current
  // state on redoStack so 되돌리기 can bring it back; redo does the reverse.
  undoBtn.addEventListener('click', ()=>{
    if(undoStack.length===0) return;
    const s = undoStack.pop();
    redoStack.push(snapshotState());
    restoreState(s);
    updateHistoryButtons();
  });
  resetBtn.addEventListener('click', ()=>{
    if(redoStack.length===0) return;
    const s = redoStack.pop();
    undoStack.push(snapshotState());
    restoreState(s);
    updateHistoryButtons();
  });

  // ---------- Close / discard ----------
  function resetToEmptyState(){
    document.body.classList.add('no-image');
    canvasHolder.style.display='none';
    sidePanel.style.display='none';
    emptyState.style.display='';
    setCanvasSize(0,0);
    mainCanvas.style.width=''; mainCanvas.style.height='';
    overlayCanvas.style.width=''; overlayCanvas.style.height='';
    hasSelection=false;
    undoStack=[];
    redoStack=[];
    editingSnapshot=null;
    layers=[]; activeLayerId=null;
    strokeUndoStack=[]; strokeRedoStack=[];
    updateDrawHistoryButtons();
    layerPanel.classList.add('collapsed');
    layerToggleBtn.classList.remove('active');
    layerToggleBtn.style.display='none';
    layerList.innerHTML='';
    viewScale=1; userZoomed=false; panOffsetX=0; panOffsetY=0;
    lassoPoints=[]; dragStart=null; brushDrawing=false;
    drawingActive=false; lastDrawPos=null;
    setTool('none');
    cropFrame.hidden=true;
    cropModeActive=false;
    canvasHolder.classList.remove('crop-mode');
    canvasHolder.style.width=''; canvasHolder.style.height='';
    mainCanvas.style.left=''; mainCanvas.style.top='';
    overlayCanvas.style.display='';
    cropRatio=null; cropRotationDeg=0;
    frameW=0; frameH=0; imgScale=1; imgOffsetX=0; imgOffsetY=0;
    document.querySelectorAll('#group-crop .ratio-btn').forEach(b=> b.classList.toggle('active', b.dataset.ratio==='free'));
    updateRulerUI();
    lockAspectOn = true;
    lockAspectToggle.checked = true;
    cropAutoZoom = true;
    cropAutoZoomToggle.checked = true;
    circleCropToggle.checked = false;
    circleCropRow.hidden = true;
    circleCropMask.hidden = true;
    featherToggle.checked = false;
    featherWrap.style.display = 'none';
    featherOnMask = null;
    updateHistoryButtons();
    downloadBtn.disabled=true;
    closeBtn.disabled=true;
    dimsInfo.textContent='이미지 없음';
    fileInput.value='';
    resetEffectsInputs();
    showEffectGrid();
    resetSCInputs();
    resetLevelsInputs();
    curvePoints=[[0,0],[255,255]];
    drawCurveEditor();
    if(mobileTabBar){
      mobileTabBar.querySelectorAll('.tab-btn.active').forEach(b=>b.classList.remove('active'));
      sideGroups.querySelectorAll(':scope > .mobile-active').forEach(el=>el.classList.remove('mobile-active'));
    }
    activeMenuId = null;
    document.body.classList.remove('editing-mode');
    document.body.classList.remove('crop-editing');
    document.body.classList.remove('draw-editing');
    document.querySelectorAll('#sideGroups > .group').forEach(g=> g.classList.add('collapsed'));
  }
  closeBtn.addEventListener('click', ()=>{
    if(window.confirm('진행 상황은 저장되지 않습니다. 새 작업을 시작할까요?')){
      resetToEmptyState();
    }
  });

  // ---------- Tools ----------
  const toolButtons = document.querySelectorAll('[data-tool]');
  toolButtons.forEach(b=>{
    b.addEventListener('click', ()=> setTool(b.dataset.tool));
  });
  const bgToolButtons = document.querySelectorAll('[data-bgtool]');
  bgToolButtons.forEach(b=>{
    b.addEventListener('click', ()=> setTool(b.dataset.bgtool==='add' ? 'bg-add' : 'bg-sub'));
  });
  function setTool(t){
    currentTool = t;
    toolButtons.forEach(b=> b.classList.toggle('active', b.dataset.tool===t));
    bgToolButtons.forEach(b=>{
      const bt = b.dataset.bgtool==='add' ? 'bg-add' : 'bg-sub';
      b.classList.toggle('active', bt===t);
    });
    document.getElementById('brushSizeWrap').style.display = (t==='brush-add'||t==='brush-sub') ? 'flex':'none';
    document.getElementById('brushHardnessWrap').style.display = (t==='brush-add'||t==='brush-sub') ? 'flex':'none';
    overlayCanvas.style.cursor = t==='none' ? 'default' : 'crosshair';
    renderSelectionOverlay();
  }

  function ensureMaskInitialized(){
    if(!hasSelection){
      mctx.save();
      mctx.globalCompositeOperation='source-over';
      mctx.fillStyle='white';
      mctx.fillRect(0,0,maskCanvas.width,maskCanvas.height);
      mctx.restore();
      hasSelection = true;
    }
  }

  // ---------- Selection overlay rendering ----------
  const showSelOverlayChk = document.getElementById('showSelOverlay');
  function renderSelectionOverlay(){
    const w=overlayCanvas.width, h=overlayCanvas.height;
    octx.clearRect(0,0,w,h);
    if(hasSelection && showSelOverlayChk.checked){
      const maskData = mctx.getImageData(0,0,w,h).data;
      const out = octx.createImageData(w,h);
      for(let i=0;i<maskData.length;i+=4){
        const a = maskData[i+3];
        // Unselected area gets a darker, more opaque tint than before so it
        // reads as visibly dimmed, not just faintly blue-tinted.
        const tintAlpha = (255-a) * 0.5;
        out.data[i]=6; out.data[i+1]=10; out.data[i+2]=22; out.data[i+3]=tintAlpha;
      }
      octx.putImageData(out,0,0);
    }
    if(lassoPoints.length>1){
      octx.strokeStyle='#4fd1c5'; octx.lineWidth=1.5;
      octx.beginPath();
      octx.moveTo(lassoPoints[0][0], lassoPoints[0][1]);
      for(let p of lassoPoints) octx.lineTo(p[0],p[1]);
      octx.stroke();
    }
  }
  showSelOverlayChk.addEventListener('change', renderSelectionOverlay);
  // Selection actions no longer push their own undo step: opening 선택 영역
  // already began a session (beginEdit), and every edit made while it's open —
  // however many brush strokes, invert/clear clicks, feather adjustments — bundles
  // into one undo checkpoint when the header's 적용 is pressed.
  document.getElementById('invertSelBtn').addEventListener('click', ()=>{
    beginEdit();
    sessionDirty = true;
    ensureMaskInitialized();
    const w=maskCanvas.width,h=maskCanvas.height;
    const id = mctx.getImageData(0,0,w,h);
    for(let i=3;i<id.data.length;i+=4) id.data[i] = 255-id.data[i];
    mctx.putImageData(id,0,0);
    renderSelectionOverlay();
  });
  document.getElementById('clearSelBtn').addEventListener('click', ()=>{
    beginEdit();
    sessionDirty = true;
    mctx.clearRect(0,0,maskCanvas.width,maskCanvas.height);
    hasSelection=false;
    renderSelectionOverlay();
  });

  // Feather: toggled on/off via a switch. Turning it on captures the mask as
  // it was right then (still sharp) as a fixed baseline — the slider always
  // feathers FROM that baseline (never compounding blur on itself), and
  // turning it back off restores that exact baseline.
  const featherWrap = document.getElementById('featherWrap');
  const featherToggle = document.getElementById('featherToggle');
  const featherRange = document.getElementById('featherRange');
  let featherOnMask = null;
  featherToggle.addEventListener('change', ()=>{
    beginEdit();
    ensureMaskInitialized();
    sessionDirty = true;
    if(featherToggle.checked){
      featherWrap.style.display = '';
      featherOnMask = mctx.getImageData(0,0,maskCanvas.width,maskCanvas.height);
      featherRange.value = 20;
      document.getElementById('featherVal').textContent = '20';
      const blurred = boxBlurAlpha(featherOnMask, maskCanvas.width, maskCanvas.height, 20);
      mctx.putImageData(blurred,0,0);
    } else {
      featherWrap.style.display = 'none';
      if(featherOnMask) mctx.putImageData(featherOnMask,0,0);
      featherOnMask = null;
    }
    renderSelectionOverlay();
  });
  featherRange.addEventListener('input', ()=>{
    document.getElementById('featherVal').textContent = featherRange.value;
    if(!featherOnMask) return;
    sessionDirty = true;
    const r = parseInt(featherRange.value,10);
    const blurred = boxBlurAlpha(featherOnMask, maskCanvas.width, maskCanvas.height, r);
    mctx.putImageData(blurred,0,0);
    renderSelectionOverlay();
  });
  function resetFeatherUI(){
    featherToggle.checked = false;
    featherWrap.style.display = 'none';
    featherOnMask = null;
  }
  // Re-blurs whatever the mask currently is, at the feather panel's current
  // radius — called after every action that actually changes the selection
  // (a lasso completing, a brush stroke ending) so a feather that's already
  // on stays applied to the new shape, instead of only taking effect the
  // next time the toggle itself is flipped.
  function reapplyFeatherIfOn(){
    if(!featherToggle.checked) return;
    featherOnMask = mctx.getImageData(0,0,maskCanvas.width,maskCanvas.height);
    const r = parseInt(featherRange.value,10);
    const blurred = boxBlurAlpha(featherOnMask, maskCanvas.width, maskCanvas.height, r);
    mctx.putImageData(blurred,0,0);
  }
  // 영역 선택 opens with feather ON by default — mirrors exactly what
  // checking the box does, applied to whatever the current selection already
  // is. Doesn't mark the session dirty: it's a passive default, not something
  // the user asked for, so backing out via 취소 without touching anything
  // else stays a silent no-op instead of prompting a confirm.
  function applyDefaultFeather(){
    featherToggle.checked = true;
    featherWrap.style.display = '';
    featherRange.value = 20;
    document.getElementById('featherVal').textContent = '20';
    // Nothing to feather yet on a blank slate — and initializing the mask
    // here would wrongly pre-select the whole canvas, which then makes a
    // fresh lasso/brush selection a no-op (it can only ADD to the existing
    // mask, never replace it). Only pre-feather when a selection already
    // exists to soften (e.g. re-opening the menu on one made earlier).
    if(!hasSelection) return;
    featherOnMask = mctx.getImageData(0,0,maskCanvas.width,maskCanvas.height);
    const blurred = boxBlurAlpha(featherOnMask, maskCanvas.width, maskCanvas.height, 20);
    mctx.putImageData(blurred,0,0);
    renderSelectionOverlay();
  }
  function applySelectionAction(){ commitEdit(); resetFeatherUI(); }
  function cancelSelectionAction(){ cancelEdit(); resetFeatherUI(); }

  // ---------- Lasso & Brush interaction ----------
  let lassoPoints = [];
  let dragStart = null;
  let brushDrawing = false;
  let bgPaintingActive = false;

  function canvasPos(e){
    const rect = overlayCanvas.getBoundingClientRect();
    const scaleX = overlayCanvas.width/rect.width;
    const scaleY = overlayCanvas.height/rect.height;
    return [ (e.clientX-rect.left)*scaleX, (e.clientY-rect.top)*scaleY ];
  }

  function paintBrush(x,y,subtract){
    sessionDirty = true;
    const size = parseInt(document.getElementById('brushSize').value,10);
    const hardness = parseInt(document.getElementById('brushHardness').value,10)/100;
    const r = size/2;
    mctx.save();
    if(subtract){ ensureMaskInitialized(); mctx.globalCompositeOperation='destination-out'; }
    else mctx.globalCompositeOperation='source-over';
    // A radial gradient with equal inner/outer radius (hardness at its 100%
    // max, so r*hardness===r) renders as fully transparent in Chromium —
    // keep the inner radius at least half a px short of the outer one.
    const grad = mctx.createRadialGradient(x,y,Math.max(0,Math.min(r*hardness,r-0.5)),x,y,r);
    grad.addColorStop(0,'rgba(255,255,255,1)');
    grad.addColorStop(1,'rgba(255,255,255,0)');
    mctx.fillStyle = grad;
    mctx.beginPath(); mctx.arc(x,y,r,0,Math.PI*2); mctx.fill();
    mctx.restore();
    if(!subtract) hasSelection = true;
  }

  // ---------- Background removal ----------
  // Runs entirely client-side with no ML model: a flood fill seeded from
  // every border pixel treats anything color-connected to the edge (within a
  // tolerance) as background. This works well for the common case of a fairly
  // uniform backdrop, and the +/− brushes below cover whatever it gets wrong.
  const bgBrushSizeInput = document.getElementById('bgBrushSize');
  const bgBrushHardnessInput = document.getElementById('bgBrushHardness');
  bgBrushSizeInput.addEventListener('input', ()=>{ document.getElementById('bgBrushSizeVal').textContent = bgBrushSizeInput.value; });
  bgBrushHardnessInput.addEventListener('input', ()=>{ document.getElementById('bgBrushHardnessVal').textContent = bgBrushHardnessInput.value; });

  function detectBackgroundKeepMask(src, w, h){
    const n = w*h;
    const keep = new Uint8ClampedArray(n).fill(255);
    const visited = new Uint8Array(n);
    const TOLERANCE = 28; // neighbor-to-neighbor step tolerance (lets gradients through)
    const REF_TOLERANCE = 90; // max drift from the estimated background color
    const stack = [];
    function colorDist(i,j){
      const ii=i*4, jj=j*4;
      const dr=src[ii]-src[jj], dg=src[ii+1]-src[jj+1], db=src[ii+2]-src[jj+2];
      return Math.sqrt(dr*dr+dg*dg+db*db);
    }
    // Estimate a robust reference background color from the border pixels
    // using the most common coarsely-quantized color bucket (mode, not mean)
    // so a subject that partially touches the border can't skew the estimate.
    const buckets = new Map();
    function addBorderSample(i){
      const ii = i*4;
      const key = (src[ii]>>4)*256 + (src[ii+1]>>4)*16 + (src[ii+2]>>4);
      let b = buckets.get(key);
      if(!b){ b = {count:0, r:0, g:0, b:0}; buckets.set(key,b); }
      b.count++; b.r+=src[ii]; b.g+=src[ii+1]; b.b+=src[ii+2];
    }
    for(let x=0;x<w;x++){ addBorderSample(x); addBorderSample((h-1)*w+x); }
    for(let y=0;y<h;y++){ addBorderSample(y*w); addBorderSample(y*w+w-1); }
    let best = null;
    for(const b of buckets.values()){ if(!best || b.count>best.count) best = b; }
    const refR = best.r/best.count, refG = best.g/best.count, refB = best.b/best.count;
    function refDist(i){
      const ii=i*4;
      const dr=src[ii]-refR, dg=src[ii+1]-refG, db=src[ii+2]-refB;
      return Math.sqrt(dr*dr+dg*dg+db*db);
    }
    // Only seed the flood fill from border pixels that actually look like the
    // background color — a subject touching the border must not be seeded.
    function seed(i){ if(refDist(i) < REF_TOLERANCE) stack.push(i); }
    for(let x=0;x<w;x++){ seed(x); seed((h-1)*w+x); }
    for(let y=0;y<h;y++){ seed(y*w); seed(y*w+w-1); }
    while(stack.length){
      const i = stack.pop();
      if(visited[i]) continue;
      visited[i] = 1;
      keep[i] = 0;
      const x = i%w, y = (i-x)/w;
      // Both checks matter: the local step catches a sharp edge immediately,
      // while the global reference bound stops a long chain of small steps
      // from drifting all the way into a differently-colored subject.
      if(x>0 && !visited[i-1] && colorDist(i,i-1)<TOLERANCE && refDist(i-1)<REF_TOLERANCE) stack.push(i-1);
      if(x<w-1 && !visited[i+1] && colorDist(i,i+1)<TOLERANCE && refDist(i+1)<REF_TOLERANCE) stack.push(i+1);
      if(y>0 && !visited[i-w] && colorDist(i,i-w)<TOLERANCE && refDist(i-w)<REF_TOLERANCE) stack.push(i-w);
      if(y<h-1 && !visited[i+w] && colorDist(i,i+w)<TOLERANCE && refDist(i+w)<REF_TOLERANCE) stack.push(i+w);
    }
    return keep;
  }
  function bgTargetLayer(){
    if(!editingSnapshot) return null;
    return layers.find(l=>l.id===editingSnapshot.activeLayerId) || null;
  }
  // Re-derives the active layer's pixels as (original × current keep-mask) —
  // called after every auto-detect run or +/− brush stroke.
  function applyBgMaskToLayer(){
    const layer = bgTargetLayer();
    if(!layer || layer.locked) return;
    const layerSnap = editingSnapshot.layers.find(l=>l.id===editingSnapshot.activeLayerId);
    if(!layerSnap) return;
    const w = editingSnapshot.w, h = editingSnapshot.h;
    const base = layerSnap.img.data;
    const maskData = bgMaskCtx.getImageData(0,0,w,h).data;
    const out = new ImageData(w,h);
    for(let i=0;i<base.length;i+=4){
      out.data[i]=base[i]; out.data[i+1]=base[i+1]; out.data[i+2]=base[i+2];
      out.data[i+3] = Math.round(base[i+3] * (maskData[i+3]/255));
    }
    layer.ctx.putImageData(out,0,0);
    compositeLayers();
  }
  function runAutoBgDetect(){
    if(!editingSnapshot) return;
    const layerSnap = editingSnapshot.layers.find(l=>l.id===editingSnapshot.activeLayerId);
    if(!layerSnap) return;
    sessionDirty = true;
    const w = editingSnapshot.w, h = editingSnapshot.h;
    const keep = detectBackgroundKeepMask(layerSnap.img.data, w, h);
    // A light feather on the mask's own alpha softens the cutout edge instead
    // of leaving a hard, aliased silhouette.
    // Kept deliberately small: without color decontamination, feathering a
    // hard-edged cutout just reveals a thin ring of the original background
    // color at partial opacity — a mild 1px softening avoids obvious jaggies
    // without making that fringe more visible.
    const feathered = keep.length ? gaussianApprox(expandToRGBA(keep), w, h, 1) : keep;
    bgMaskCanvas.width = w; bgMaskCanvas.height = h;
    const maskImg = new ImageData(w,h);
    for(let i=0;i<w*h;i++){
      maskImg.data[i*4]=255; maskImg.data[i*4+1]=255; maskImg.data[i*4+2]=255;
      maskImg.data[i*4+3] = feathered[i*4+3];
    }
    bgMaskCtx.putImageData(maskImg,0,0);
    applyBgMaskToLayer();
  }
  function expandToRGBA(alphaOnly){
    const out = new Uint8ClampedArray(alphaOnly.length*4);
    for(let i=0;i<alphaOnly.length;i++) out[i*4+3]=alphaOnly[i];
    return out;
  }
  function paintBgMask(x,y,mode){
    if(!editingSnapshot) return;
    const layer = bgTargetLayer();
    if(!layer || layer.locked) return;
    sessionDirty = true;
    const size = parseInt(bgBrushSizeInput.value,10);
    const hardness = parseInt(bgBrushHardnessInput.value,10)/100;
    const r = size/2;
    bgMaskCtx.save();
    bgMaskCtx.globalCompositeOperation = mode==='sub' ? 'destination-out' : 'source-over';
    const grad = bgMaskCtx.createRadialGradient(x,y,Math.max(0,Math.min(r*hardness,r-0.5)),x,y,r);
    grad.addColorStop(0,'rgba(255,255,255,1)');
    grad.addColorStop(1,'rgba(255,255,255,0)');
    bgMaskCtx.fillStyle = grad;
    bgMaskCtx.beginPath(); bgMaskCtx.arc(x,y,r,0,Math.PI*2); bgMaskCtx.fill();
    bgMaskCtx.restore();
    applyBgMaskToLayer();
  }
  document.getElementById('bgAutoBtn').addEventListener('click', ()=> runAutoBgDetect());
  document.getElementById('bgResetBtn').addEventListener('click', ()=>{
    if(!editingSnapshot) return;
    sessionDirty = true;
    const w=editingSnapshot.w, h=editingSnapshot.h;
    bgMaskCanvas.width=w; bgMaskCanvas.height=h;
    bgMaskCtx.fillStyle='white';
    bgMaskCtx.fillRect(0,0,w,h);
    applyBgMaskToLayer();
  });
  function applyBgRemoveAction(){ commitEdit(); }
  function cancelBgRemoveAction(){ cancelEdit(); }

  // ---------- Draw tool (그리기): paints onto a brand-new top layer ----------
  const drawColorInput = document.getElementById('drawColor');
  const drawSizeInput = document.getElementById('drawSize');
  const drawHardnessInput = document.getElementById('drawHardness');
  const drawExposureInput = document.getElementById('drawExposure');
  let drawBrushType = 'round';
  document.querySelectorAll('#group-draw .ratio-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#group-draw .ratio-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      drawBrushType = btn.dataset.brushtype;
    });
  });
  drawSizeInput.addEventListener('input', ()=>{ document.getElementById('drawSizeVal').textContent = drawSizeInput.value; });
  drawHardnessInput.addEventListener('input', ()=>{ document.getElementById('drawHardnessVal').textContent = drawHardnessInput.value; });
  drawExposureInput.addEventListener('input', ()=>{ document.getElementById('drawExposureVal').textContent = drawExposureInput.value; });

  function hexToRgb(hex){
    const m = /^#([0-9a-f]{6})$/i.exec(hex||'');
    const n = m ? parseInt(m[1],16) : 0x4fd1c5;
    return [ (n>>16)&255, (n>>8)&255, n&255 ];
  }

  // A single dedicated drawing layer is created lazily on the very first
  let drawingActive = false;
  let lastDrawPos = null;

  // Per-stroke undo/redo, local to the current 그리기 session (separate from
  // the document-level undo/redo) — lets the header's 획 실행취소/다시실행
  // step back through individual strokes before committing the whole session.
  const drawUndoBtn = document.getElementById('drawUndoBtn');
  const drawRedoBtn = document.getElementById('drawRedoBtn');
  let strokeUndoStack = [];
  let strokeRedoStack = [];
  function updateDrawHistoryButtons(){
    drawUndoBtn.disabled = strokeUndoStack.length===0;
    drawRedoBtn.disabled = strokeRedoStack.length===0;
  }
  drawUndoBtn.addEventListener('click', ()=>{
    if(strokeUndoStack.length===0) return;
    const pre = strokeUndoStack.pop();
    strokeRedoStack.push(snapshotState());
    restoreLayersFrom(pre);
    updateDrawHistoryButtons();
  });
  drawRedoBtn.addEventListener('click', ()=>{
    if(strokeRedoStack.length===0) return;
    const nxt = strokeRedoStack.pop();
    strokeUndoStack.push(snapshotState());
    restoreLayersFrom(nxt);
    updateDrawHistoryButtons();
  });

  function paintDrawDab(x,y){
    if(!editingSnapshot) return;
    // Paint onto whichever layer was active when this 그리기 session began —
    // no automatic layer creation. Key off the session's pinned layer (not
    // whatever is active right now) so the layer panel can still be opened
    // mid-session, matching previewEffect's pattern.
    const layer = layers.find(l=>l.id===editingSnapshot.activeLayerId);
    if(!layer || layer.locked) return;
    sessionDirty = true;
    const size = parseInt(drawSizeInput.value,10);
    const hardness = parseInt(drawHardnessInput.value,10)/100;
    const exposure = parseInt(drawExposureInput.value,10)/100;
    const r = size/2;
    const [rr,gg,bb] = hexToRgb(drawColorInput.value);
    const lctx = layer.ctx;
    lctx.save();
    lctx.globalAlpha = exposure;
    if(drawBrushType==='square'){
      lctx.fillStyle = `rgb(${rr},${gg},${bb})`;
      lctx.fillRect(x-r, y-r, size, size);
    } else {
      const grad = lctx.createRadialGradient(x,y,Math.max(0,Math.min(r*hardness,r-0.5)),x,y,r);
      grad.addColorStop(0, `rgba(${rr},${gg},${bb},1)`);
      grad.addColorStop(1, `rgba(${rr},${gg},${bb},0)`);
      lctx.fillStyle = grad;
      lctx.beginPath(); lctx.arc(x,y,r,0,Math.PI*2); lctx.fill();
    }
    lctx.restore();
    compositeLayers();
  }
  function paintDrawLine(x1,y1,x2,y2){
    const size = parseInt(drawSizeInput.value,10);
    const dist = Math.hypot(x2-x1,y2-y1);
    const step = Math.max(1, size/4);
    const n = Math.max(1, Math.floor(dist/step));
    for(let i=1;i<=n;i++){
      const t = i/n;
      paintDrawDab(x1+(x2-x1)*t, y1+(y2-y1)*t);
    }
  }
  function applyDrawAction(){
    commitEdit();
    strokeUndoStack = []; strokeRedoStack = [];
    updateDrawHistoryButtons();
  }
  function cancelDrawAction(){
    cancelEdit();
    strokeUndoStack = []; strokeRedoStack = [];
    updateDrawHistoryButtons();
  }

  // ---------- Pinch to zoom + pan + rotate (two fingers) ----------
  const activePointers = new Map(); // pointerId -> {x,y} in client coords
  let pinchActive = false;
  let pinchStartDist = 0;
  let pinchStartScale = 1;
  let pinchStartAngle = 0;
  let pinchStartRotation = 0;
  let pinchStartMidX = 0, pinchStartMidY = 0;
  let pinchStartPanX = 0, pinchStartPanY = 0;
  let cropModeActive = false; // true while the 크롭 sub-panel is open

  function pointerDistance(){
    const pts = [...activePointers.values()];
    return Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
  }
  function pointerAngle(){
    const pts = [...activePointers.values()];
    return Math.atan2(pts[1].y-pts[0].y, pts[1].x-pts[0].x) * 180/Math.PI;
  }
  function pointerMidpoint(){
    const pts = [...activePointers.values()];
    return [ (pts[0].x+pts[1].x)/2, (pts[0].y+pts[1].y)/2 ];
  }
  // A pinch-to-zoom almost never keeps the two fingers perfectly aligned, so a
  // raw 1:1 angle-to-rotation mapping picks up rotation the user never meant —
  // a small dead zone ignores that incidental angle change entirely. Past the
  // dead zone the user IS deliberately rotating, where a damping factor below
  // 1 asks for more physical finger rotation per degree of actual rotation,
  // for finer control than a direct 1:1 mapping would give.
  const ROTATE_DEADZONE_DEG = 6;
  const ROTATE_SENSITIVITY = 0.4;
  function dampedRotationDelta(rawAngleDelta){
    const mag = Math.abs(rawAngleDelta);
    if(mag <= ROTATE_DEADZONE_DEG) return 0;
    return Math.sign(rawAngleDelta) * (mag-ROTATE_DEADZONE_DEG) * ROTATE_SENSITIVITY;
  }
  function startPinch(){
    endPeek(); // a second finger joining a before/after peek should zoom, not stay peeked
    // A second finger joining mid-stroke means this was a zoom/pan gesture, not
    // a drawing stroke — roll back whatever this stroke had painted so far.
    if(drawingActive && currentTool==='draw' && strokeUndoStack.length){
      restoreLayersFrom(strokeUndoStack.pop());
      updateDrawHistoryButtons();
    }
    pinchActive = true;
    pinchStartDist = pointerDistance();
    pinchStartScale = cropModeActive ? imgScale : viewScale;
    pinchStartAngle = pointerAngle();
    pinchStartRotation = cropRotationDeg;
    const [mx,my] = pointerMidpoint();
    pinchStartMidX = mx; pinchStartMidY = my;
    pinchStartPanX = cropModeActive ? imgOffsetX : panOffsetX;
    pinchStartPanY = cropModeActive ? imgOffsetY : panOffsetY;
    // a second finger cancels any in-progress single-finger tool action
    lassoPoints = [];
    brushDrawing = false;
    drawingActive = false;
    lastDrawPos = null;
    bgPaintingActive = false;
    dragStart = null;
    renderSelectionOverlay();
  }
  function updatePinch(){
    if(!pinchActive || activePointers.size<2 || pinchStartDist<=0) return;
    const scaleFactor = pointerDistance()/pinchStartDist;
    const [mx,my] = pointerMidpoint();
    const dx = mx-pinchStartMidX, dy = my-pinchStartMidY;
    // In crop mode, pinch-zoom/pan move the IMAGE behind the fixed frame instead
    // of the general view — the frame itself must never move or resize from this.
    if(cropModeActive){
      imgScale = clampImgScale(pinchStartScale * scaleFactor);
      imgOffsetX = pinchStartPanX + dx;
      imgOffsetY = pinchStartPanY + dy;
      clampImgOffset();
      sessionDirty = true;
      renderCropFrame();
    } else {
      viewScale = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, pinchStartScale * scaleFactor));
      userZoomed = true;
      panOffsetX = pinchStartPanX + dx;
      panOffsetY = pinchStartPanY + dy;
      clampPanOffset();
      applyCanvasDisplaySize();
    }
    if(cropModeActive){
      const angleDelta = dampedRotationDelta(pointerAngle()-pinchStartAngle);
      previewRotation(Math.max(-45, Math.min(45, pinchStartRotation+angleDelta)));
      updateRulerUI();
    }
  }

  overlayCanvas.addEventListener('pointerdown', e=>{
    try{ overlayCanvas.setPointerCapture(e.pointerId); }catch(err){}
    activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(activePointers.size>=2){ startPinch(); return; }
    if(currentTool==='none'){
      startPeek();
      return;
    }
    const [x,y] = canvasPos(e);
    if(currentTool==='lasso'){
      lassoPoints = [[x,y]];
    } else if(currentTool==='brush-add' || currentTool==='brush-sub'){
      beginEdit();
      brushDrawing = true;
      paintBrush(x,y,currentTool==='brush-sub');
      renderSelectionOverlay();
    } else if(currentTool==='draw'){
      beginEdit();
      const preStroke = snapshotState();
      drawingActive = true;
      lastDrawPos = [x,y];
      paintDrawDab(x,y);
      strokeUndoStack.push(preStroke);
      strokeRedoStack = [];
      updateDrawHistoryButtons();
    } else if(currentTool==='bg-add' || currentTool==='bg-sub'){

    if(activePointers.size>=2) return;

  // ---------- Resize ----------
  const resizeW = document.getElementById('resizeW'), resizeH = document.getElementById('resizeH');

  lockAspectToggle.addEventListener('change', ()=>{
    lockAspectOn = lockAspectToggle.checked;
  });
  function syncResizeInputs(){
    resizeW.value = mainCanvas.width;
    resizeH.value = mainCanvas.height;
    aspect = mainCanvas.width/mainCanvas.height;
  }
  // Resizing now live-previews (like the other adjustment menus) instead of
  // applying immediately — the header's 적용/취소 commits or discards it. Every
  // call rebuilds all layers fresh from editingSnapshot (never from the result
  // of a previous call), so repeated slider drags don't compound scaling loss.
  function previewResize(w,h){
    beginEdit();
    if(!editingSnapshot) return;
    sessionDirty = true;
    const baseW = editingSnapshot.w, baseH = editingSnapshot.h;
    setCanvasSize(w,h);
    layers = editingSnapshot.layers.map(ls=>{
      const layer = layerShellFromSnapshot(ls, w, h);
      const tmp = document.createElement('canvas');
      tmp.width = baseW; tmp.height = baseH;
      tmp.getContext('2d').putImageData(ls.img, 0, 0);
      layer.ctx.drawImage(tmp, 0,0,baseW,baseH, 0,0,w,h);
      return layer;
    });
    activeLayerId = editingSnapshot.activeLayerId;
    hasSelection=false;
    updateDims();
    compositeLayers();
    renderLayerPanel();
  }
  resizeW.addEventListener('input', ()=>{
    const w = Math.max(1, parseInt(resizeW.value||1,10));
    let h;
    if(lockAspectOn){ h = Math.max(1, Math.round(w/aspect)); resizeH.value = h; }
    else h = Math.max(1, parseInt(resizeH.value||1,10));
    previewResize(w,h);
  });
  resizeH.addEventListener('input', ()=>{
    const h = Math.max(1, parseInt(resizeH.value||1,10));
    let w;
    if(lockAspectOn){ w = Math.max(1, Math.round(h*aspect)); resizeW.value = w; }
    else w = Math.max(1, parseInt(resizeW.value||1,10));
    previewResize(w,h);
  });
  function applyResizeAction(){
    commitEdit();
    syncResizeInputs();
  }
  function cancelResizeAction(){
    cancelEdit();
    syncResizeInputs();
  }

  // ---------- Generic live-preview edit machinery ----------
  // sessionDirty tracks whether the CURRENT menu session actually changed
  // anything, so the header's 취소 can skip its confirm prompt when there's
  // nothing to lose (see cancelActiveMenu).
  let sessionDirty = false;
  function beginEdit(){
    if(editingSnapshot) return;
    editingSnapshot = snapshotState();
    sessionDirty = false;
  }
  // Effects/selective color/levels/curve only ever touch the ACTIVE layer's
  // pixels — everything else in the document stays exactly as it was.
  function previewEffect(effectFn){
    if(!editingSnapshot) return;
    // Key off the layer that was active when this session began, not whatever
    // is active right now — the layer panel can still be clicked mid-session.
    const layer = layers.find(l=>l.id===editingSnapshot.activeLayerId);
    if(!layer || layer.locked) return;
    const layerSnap = editingSnapshot.layers.find(l=>l.id===editingSnapshot.activeLayerId);
    if(!layerSnap) return;
    sessionDirty = true;
    const w=editingSnapshot.w, h=editingSnapshot.h;
    const base = new Uint8ClampedArray(layerSnap.img.data);
    const effect = effectFn(new Uint8ClampedArray(base), w, h);
    const out = new ImageData(w,h);
    const alphaAll = hasSelection ? mctx.getImageData(0,0,w,h).data : null;
    for(let i=0;i<base.length;i+=4){
      const a = alphaAll ? alphaAll[i+3]/255 : 1;
      out.data[i]   = base[i]  *(1-a) + effect[i]  *a;
      out.data[i+1] = base[i+1]*(1-a) + effect[i+1]*a;
      out.data[i+2] = base[i+2]*(1-a) + effect[i+2]*a;
      // The effect's own alpha channel matters too — a blur that softens a
      // brush stroke's edge does that by spreading its ALPHA outward, not
      // just its color. Keeping the original alpha here (as before) made the
      // blur invisible at any hard-alpha edge, e.g. a draw layer's stroke
      // against transparency.
      out.data[i+3] = base[i+3]*(1-a) + effect[i+3]*a;
    }
    layer.ctx.putImageData(out,0,0);
    compositeLayers();
  }
  // ---------- Adjustment layers (선택색상/레벨/곡선) ----------
  // Unlike 효과 (which bakes into the active layer in place), these three
  // read from one layer (previewSourceLayerId) and write into another
  // (previewTargetLayerId) — a brand-new layer for a fresh adjustment, or an
  // existing adjustment layer being re-edited. Both null outside such a
  // session. Reading the source's CURRENT pixels fresh every tick (rather
  // than a frozen snapshot) means re-editing never compounds on itself.
  let previewSourceLayerId = null;
  let previewTargetLayerId = null;
  function previewAdjustment(effectFn){
    if(!editingSnapshot || previewTargetLayerId==null) return;
    const target = layers.find(l=>l.id===previewTargetLayerId);
    const source = layers.find(l=>l.id===previewSourceLayerId);
    if(!target || !source || target.locked) return;
    sessionDirty = true;
    const w = mainCanvas.width, h = mainCanvas.height;
    const base = source.ctx.getImageData(0,0,w,h).data;
    const effect = effectFn(new Uint8ClampedArray(base), w, h);
    const out = new ImageData(w,h);
    const alphaAll = hasSelection ? mctx.getImageData(0,0,w,h).data : null;
    for(let i=0;i<base.length;i+=4){
      const a = alphaAll ? alphaAll[i+3]/255 : 1;
      out.data[i]   = base[i]  *(1-a) + effect[i]  *a;
      out.data[i+1] = base[i+1]*(1-a) + effect[i+1]*a;
      out.data[i+2] = base[i+2]*(1-a) + effect[i+2]*a;
      out.data[i+3] = base[i+3]*(1-a) + effect[i+3]*a;
    }
    target.ctx.putImageData(out,0,0);
    compositeLayers();
  }
  function nextAdjustmentLayerName(baseName, type){
    const count = layers.filter(l=>l.adjustmentType===type).length;
    return count===0 ? baseName : (baseName+' '+(count+1));
  }
  // Snapshots the CURRENT selection (if any) as a small, fixed-size black+alpha
  // canvas for the layer panel thumbnail — captured once at adjustment-layer
  // creation time so it stays accurate for that layer's whole lifetime
  // regardless of the selection being changed or cleared afterward, and so it
  // never needs to be resized when the image itself is later cropped/resized.
  // Returns null when there's no selection (the adjustment applies to the
  // whole layer), which the thumbnail renders as solid black.
  function captureAdjustmentMaskThumb(){
    if(!hasSelection) return null;
    const w = maskCanvas.width, h = maskCanvas.height;
    if(!w || !h) return null;
    const THUMB = 40;
    const src = mctx.getImageData(0,0,w,h).data;
    const blackAlpha = new ImageData(w,h);
    for(let i=0;i<src.length;i+=4) blackAlpha.data[i+3] = src[i+3];
    const full = document.createElement('canvas');
    full.width = w; full.height = h;
    full.getContext('2d').putImageData(blackAlpha,0,0);
    const thumb = document.createElement('canvas');
    thumb.width = THUMB; thumb.height = THUMB;
    thumb.getContext('2d').drawImage(full, 0, 0, THUMB, THUMB);
    return thumb;
  }
  // Called from onMenuOpen for group-sc/levels/curve. If the layer that was
  // already active IS a matching adjustment layer (the user selected it from
  // the panel to re-edit it), reuse it and return its stored params for the
  // caller to load into the UI. Otherwise create a brand-new layer right now
  // and leave activeLayerId untouched (so the active layer never changes just
  // from applying an adjustment).
  function beginAdjustmentSession(type, baseName){
    const active = activeLayer();
    if(!active) return null;
    if(active.adjustmentType===type){
      previewTargetLayerId = active.id;
      previewSourceLayerId = active.adjustmentSourceLayerId;
      return active.adjustmentParams;
    }
    // Since applying an adjustment never changes the active layer, the active
    // layer stays the untouched original image through an entire chain of
    // adjustments (선택색상 → 레벨 → 곡선 ...) unless there's some other,
    // separately user-added layer to actually keep it pointed at. Sourcing
    // every new adjustment from "the active layer" in that all-original case
    // would keep inserting each one right above the original instead of on
    // top of the previous adjustment — so when the original image is the
    // only non-adjustment layer in the stack, source from (and insert above)
    // the topmost layer instead, continuing the existing chain.
    const onlyOriginalLayer = layers.filter(l=>!l.adjustmentType).length===1;
    const source = onlyOriginalLayer ? layers[layers.length-1] : active;
    const newLayer = createLayer(nextAdjustmentLayerName(baseName, type), mainCanvas.width, mainCanvas.height);
    newLayer.ctx.drawImage(source.canvas, 0, 0);
    newLayer.adjustmentType = type;
    newLayer.adjustmentSourceLayerId = source.id;
    newLayer.adjustmentMaskThumb = captureAdjustmentMaskThumb();
    const idx = layers.indexOf(source);
    layers.splice(idx+1, 0, newLayer);
    // The source layer stays visible — since the new layer is a full
    // replacement of its pixels, this never changes what's actually shown
    // (the new layer fully covers it), but it keeps every layer's eye icon
    // correctly reflecting "on" and lets rebuildDependentAdjustmentLayers()
    // correctly reveal it if a layer above is later turned off.
    previewSourceLayerId = source.id;
    previewTargetLayerId = newLayer.id;
    compositeLayers();
    renderLayerPanel();
    return null;
  }
  function endAdjustmentSession(){
    previewSourceLayerId = null;
    previewTargetLayerId = null;
  }
  const ADJUSTMENT_MENU_ID = {sc:'group-sc', levels:'group-levels', curve:'group-curve'};
  const ADJUSTMENT_MENU_IDS = new Set(Object.values(ADJUSTMENT_MENU_ID));
  // Clicking an adjustment layer in the panel re-opens the menu that created
  // it (already pre-filled with its stored params via beginAdjustmentSession)
  // — mirrors whichever entry path the current layout actually uses (desktop
  // accordion vs mobile tab bar) so the UI ends up in the same state either
  // way would have left it.
  function openMenuFromLayerRow(id){
    const targetEl = document.getElementById(id);
    if(!targetEl || id===activeMenuId) return;
    if(activeMenuId) applyActiveMenu();
    if(isDesktopLayout()){
      document.querySelectorAll('#sideGroups > .group').forEach(g=> g.classList.add('collapsed'));
      targetEl.classList.remove('collapsed');
    } else {
      if(mobileTabBar){
        mobileTabBar.querySelectorAll('.tab-btn.active').forEach(b=>b.classList.remove('active'));
        const btn = mobileTabBar.querySelector('.tab-btn[data-target="'+id+'"]');
        if(btn) btn.classList.add('active');
      }
      sideGroups.querySelectorAll(':scope > .mobile-active').forEach(el=>el.classList.remove('mobile-active'));
      targetEl.classList.add('mobile-active');
      targetEl.classList.remove('collapsed');
    }
    enterMenu(id);
  }
  // Press-and-hold on the image (효과/선택색상/레벨/곡선 only, once something's
  // actually changed) shows the image as it was before this menu's edits, so
  // the user can compare before/after; releasing restores the live preview.

  let isPeeking = false;
  let peekAfterImage = null;
  let peekPrevTargetVisible = true, peekPrevSourceVisible = true;
  function canPeek(){
    return currentTool==='none' && PEEK_MENUS.has(activeMenuId) && !!editingSnapshot && sessionDirty;
  }
  function startPeek(){
    if(isPeeking || !canPeek()) return;

      // peek just swaps which of the pair is visible — remembering each
      // one's actual prior state (rather than assuming target-on/source-off)
      // so releasing restores exactly what was showing before the peek.
      const target = layers.find(l=>l.id===previewTargetLayerId);
      const source = layers.find(l=>l.id===previewSourceLayerId);

      peekPrevTargetVisible = target.visible;
      peekPrevSourceVisible = source.visible;

    const layerSnap = editingSnapshot.layers.find(l=>l.id===editingSnapshot.activeLayerId);
    if(!layer || !layerSnap) return;
    isPeeking = true;
    peekAfterImage = layer.ctx.getImageData(0,0,mainCanvas.width,mainCanvas.height);
    layer.ctx.putImageData(layerSnap.img,0,0);

  function endPeek(){
    if(!isPeeking) return;
    isPeeking = false;

      const source = layers.find(l=>l.id===previewSourceLayerId);
      if(target) target.visible = peekPrevTargetVisible;
      if(source) source.visible = peekPrevSourceVisible;
      compositeLayers();
      return;
    }
    const layer = editingSnapshot && layers.find(l=>l.id===editingSnapshot.activeLayerId);

    compositeLayers();

  function commitEdit(){
    if(!editingSnapshot) return;
