<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>포토샷 · 이미지 보정</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#15171a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="포토샷">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root{
    --bg:#15171a;
    --panel:#1c1f23;
    --panel-2:#22262b;
    --line:#2c3137;
    --text:#e7e9ec;
    --text-dim:#93999f;
    --accent:#4fd1c5;
    --accent-dim:#2f7d76;
    --danger:#e2725b;
    --mono: ui-monospace, "SFMono-Regular", Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  header{
    display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:8px;
    padding:10px 14px;
    background:var(--panel);
    border-bottom:1px solid var(--line);
    flex-shrink:0;
  }
  .header-side{display:flex;align-items:center;}
  .header-side-left{grid-column:1;justify-content:flex-start;}
  .header-side-right{grid-column:3;justify-content:flex-end;gap:8px;}
  .header-actions{grid-column:2;display:flex;gap:8px;justify-content:center;}
  .header-crop-size{grid-column:2;display:none;justify-content:center;align-items:center;font-family:var(--mono);font-size:13px;color:var(--accent);white-space:nowrap;}
  .header-close{grid-column:3;display:flex;justify-content:flex-end;}
  .iconbtn{width:36px;height:36px;padding:0;display:inline-flex;align-items:center;justify-content:center;}
  .iconbtn svg{width:18px;height:18px;}
  .iconbtn.close-btn:hover:not(:disabled){background:rgba(226,114,91,.15);border-color:var(--danger);color:var(--danger);}
  .menu-cancel,.menu-apply{display:none;}
  body.editing-mode .header-actions,
  body.editing-mode .header-close .iconbtn{display:none;}
  body.editing-mode .menu-cancel,
  body.editing-mode .menu-apply{display:inline-flex;}
  body.editing-mode .header-close{grid-column:3;display:flex;justify-content:flex-end;}
  body.crop-editing .header-crop-size{display:flex;}
  .toggle-btn.active{background:var(--accent-dim);border-color:var(--accent);color:#eafffb;}
  button{
    font-family:var(--sans);
    cursor:pointer;
    border-radius:6px;
    border:1px solid var(--line);
    background:var(--panel-2);
    color:var(--text);
    padding:7px 13px;
    font-size:13px;
    transition:background .12s,border-color .12s;
  }
  button:hover{background:#2a2f35;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  button.primary{background:var(--accent);border-color:var(--accent);color:#0b1615;font-weight:600;}
  button.primary:hover{background:#63d8cd;}
  button.danger{border-color:var(--danger);color:var(--danger);background:transparent;}
  button.danger:hover{background:rgba(226,114,91,.12);}
  button.ghost{background:transparent;}
  button.toolbtn{padding:8px 10px;}
  button.toolbtn.active{background:var(--accent-dim);border-color:var(--accent);color:#eafffb;}

  .layout{flex:1;display:flex;min-height:0;}
  .stage-wrap{
    flex:1;display:flex;align-items:center;justify-content:center;
    padding:24px;overflow:auto;position:relative;
    background:
      linear-gradient(45deg,#1a1c1f 25%,transparent 25%),
      linear-gradient(-45deg,#1a1c1f 25%,transparent 25%),
      linear-gradient(45deg,transparent 75%,#1a1c1f 75%),
      linear-gradient(-45deg,transparent 75%,#1a1c1f 75%);
    background-size:20px 20px;
    background-position:0 0,0 10px,10px -10px,-10px 0px;
    background-color:#101214;
  }
  .canvas-holder{position:relative;box-shadow:0 8px 30px rgba(0,0,0,.5);}
  .canvas-holder canvas{display:block;}
  #overlayCanvas{position:absolute;top:0;left:0;touch-action:none;}
  .canvas-holder.crop-mode{overflow:hidden;}
  .canvas-holder.crop-mode #mainCanvas{position:absolute;}

  /* ---------- Crop frame overlay ----------
     The frame itself never moves: it always stays centered in the fixed-size
     crop viewport. Dragging the backdrop (crop-frame) pans the image behind it;
     only the handles (children, pointer-events re-enabled) resize the frame. */
  .crop-frame{position:absolute;inset:0;overflow:hidden;pointer-events:auto;touch-action:none;z-index:20;cursor:move;}
  .crop-rect{
    position:absolute;pointer-events:none;
    box-shadow:0 0 0 9999px rgba(0,0,0,.55);
    border:1px solid rgba(255,255,255,.9);
  }
  .crop-gridline{position:absolute;background:rgba(255,255,255,.35);pointer-events:none;}
  .crop-gridline.v1{left:33.333%;top:0;bottom:0;width:1px;}
  .crop-gridline.v2{left:66.666%;top:0;bottom:0;width:1px;}
  .crop-gridline.h1{top:33.333%;left:0;right:0;height:1px;}
  .crop-gridline.h2{top:66.666%;left:0;right:0;height:1px;}
  .crop-handle{position:absolute;pointer-events:auto;touch-action:none;}
  .crop-handle.corner{width:22px;height:22px;}
  .crop-handle.corner::after{content:'';position:absolute;width:16px;height:16px;border:3px solid #fff;}
  .crop-handle.nw{top:-11px;left:-11px;cursor:nwse-resize;}
  .crop-handle.nw::after{top:3px;left:3px;border-right:none;border-bottom:none;}
  .crop-handle.ne{top:-11px;right:-11px;cursor:nesw-resize;}
  .crop-handle.ne::after{top:3px;right:3px;border-left:none;border-bottom:none;}
  .crop-handle.sw{bottom:-11px;left:-11px;cursor:nesw-resize;}
  .crop-handle.sw::after{bottom:3px;left:3px;border-right:none;border-top:none;}
  .crop-handle.se{bottom:-11px;right:-11px;cursor:nwse-resize;}
  .crop-handle.se::after{bottom:3px;right:3px;border-left:none;border-top:none;}
  .crop-handle.n{top:-11px;left:50%;width:40px;height:22px;margin-left:-20px;cursor:ns-resize;}
  .crop-handle.s{bottom:-11px;left:50%;width:40px;height:22px;margin-left:-20px;cursor:ns-resize;}
  .crop-handle.e{right:-11px;top:50%;width:22px;height:40px;margin-top:-20px;cursor:ew-resize;}
  .crop-handle.w{left:-11px;top:50%;width:22px;height:40px;margin-top:-20px;cursor:ew-resize;}
  .crop-handle.n::after,.crop-handle.s::after{content:'';position:absolute;left:50%;top:50%;width:24px;height:4px;margin-left:-12px;margin-top:-2px;background:#fff;border-radius:2px;}
  .crop-handle.e::after,.crop-handle.w::after{content:'';position:absolute;left:50%;top:50%;width:4px;height:24px;margin-left:-2px;margin-top:-12px;background:#fff;border-radius:2px;}
  .empty-state{
    color:var(--text-dim);text-align:center;font-size:14px;line-height:1.7;
  }
  .empty-state button{margin-top:10px;}

  /* ---------- Layers (bookmark tab + flyout panel) ---------- */
  .layer-tab-btn{
    position:absolute;top:14px;right:0;z-index:31;
    width:44px;height:38px;padding:0;
    display:flex;align-items:center;justify-content:center;
    background:var(--panel-2);border:1px solid var(--line);border-right:none;
    border-radius:8px 0 0 8px;color:var(--text);
    box-shadow:-2px 2px 8px rgba(0,0,0,.35);
  }
  .layer-tab-btn svg{width:19px;height:19px;}
  .layer-tab-btn.active{background:var(--accent-dim);border-color:var(--accent);color:#eafffb;}
  .layer-panel{
    position:absolute;top:58px;right:0;z-index:30;
    width:250px;max-width:calc(100% - 12px);max-height:min(60vh,420px);
    display:flex;flex-direction:column;overflow:hidden;
    background:var(--panel);border:1px solid var(--line);border-radius:8px;
    box-shadow:-2px 4px 16px rgba(0,0,0,.45);
  }
  .layer-panel.collapsed{display:none;}
  .layer-panel-header{padding:9px 12px;font-size:12px;font-weight:600;color:var(--text-dim);border-bottom:1px solid var(--line);}
  .layer-list{overflow-y:auto;padding:6px;display:flex;flex-direction:column;gap:4px;}
  .layer-row{
    display:grid;grid-template-columns:28px 1fr auto auto;grid-template-rows:auto auto;
    align-items:center;column-gap:8px;row-gap:4px;
    padding:6px 8px;border-radius:6px;border:1px solid transparent;
    background:var(--panel-2);touch-action:none;
  }
  .layer-row.selected{border-color:var(--accent);background:rgba(79,209,197,.1);}
  .layer-row.dragging{opacity:.55;}
  .layer-thumb{grid-row:1;grid-column:1;width:28px;height:28px;border-radius:4px;background:#000;border:1px solid var(--line);}
  .layer-name{grid-row:1;grid-column:2;font-size:12px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .layer-icon-btn{grid-row:1;width:26px;height:26px;padding:0;display:flex;align-items:center;justify-content:center;background:transparent;border-color:transparent;color:var(--text-dim);}
  .layer-icon-btn svg{width:16px;height:16px;}
  .layer-icon-btn.off{color:var(--text-dim);opacity:.4;}
  .layer-icon-btn.on{color:var(--accent);opacity:1;}
  .layer-opacity-row{grid-row:2;grid-column:1 / -1;display:flex;align-items:center;gap:6px;}
  .layer-opacity-row input[type=range]{flex:1;height:14px;}
  .layer-opacity-row span{font-family:var(--mono);font-size:10px;color:var(--text-dim);width:30px;text-align:right;}
  input[type=color]{width:100%;height:34px;padding:2px;background:var(--bg);border:1px solid var(--line);border-radius:5px;cursor:pointer;}

  aside{
    width:320px;flex-shrink:0;
    background:var(--panel);
    border-left:1px solid var(--line);
    overflow-y:auto;
    padding:14px;
  }
  .toolrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px;}
  .ratio-row{display:flex;gap:6px;flex-wrap:wrap;}
  .ratio-btn{flex:1 1 auto;padding:6px 8px;font-size:12px;}
  .ratio-btn.active{background:var(--accent-dim);border-color:var(--accent);color:#eafffb;}
  .rotate-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;}
  .rotate-value{font-family:var(--mono);font-size:13px;color:var(--accent);}
  .rotate-ruler{position:relative;width:100%;height:40px;overflow:hidden;border-radius:6px;background:var(--bg);border:1px solid var(--line);touch-action:none;cursor:ew-resize;}
  .rotate-ruler-track{position:absolute;left:50%;width:4000px;margin-left:-2000px;top:0;bottom:0;}
  .ruler-tick{position:absolute;bottom:0;width:1px;height:8px;background:var(--text-dim);}
  .ruler-tick.mid{height:13px;}
  .ruler-tick.major{height:20px;background:var(--text);}
  .rotate-ruler-needle{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--accent);pointer-events:none;z-index:2;}
  .group{
    border:1px solid var(--line);border-radius:8px;margin-bottom:10px;overflow:hidden;background:var(--panel-2);
  }
  .group > summary{
    padding:10px 12px;cursor:pointer;font-size:13px;font-weight:600;
    list-style:none;display:flex;align-items:center;justify-content:space-between;
    color:var(--text);
  }
  .group > summary::-webkit-details-marker{display:none;}
  .group > summary:after{content:'−';color:var(--text-dim);font-weight:400;}
  .group.collapsed > summary:after{content:'+';}
  /* Once a menu is open, its own name is redundant (you just picked it from the
     tab bar / clicked it) — hide the summary entirely and show just the controls. */
  .group:not(.collapsed) > summary{display:none;}
  .group-body{padding:4px 12px 14px 12px;display:flex;flex-direction:column;gap:10px;}
  .group.collapsed > .group-body{display:none;}
  label.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--text-dim);}
  label.field .row{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--text);}
  input[type=range]{width:100%;accent-color:var(--accent);}
  input[type=number]{
    background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:5px;padding:5px 7px;font-family:var(--mono);font-size:12px;width:100%;
  }
  select{
    background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:5px;padding:6px 7px;font-size:12px;width:100%;
  }
  .btnrow{display:flex;gap:6px;}
  .btnrow button{flex:1;}
  .hint{font-size:11px;color:var(--text-dim);line-height:1.5;margin:0;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .slider-with-input{display:flex;align-items:center;gap:8px;}
  .slider-with-input input[type=range]{flex:1;}
  .pct-box{position:relative;flex:0 0 auto;}
  .pct-box input[type=number]{width:60px;padding-right:16px;text-align:right;}
  .pct-box::after{content:'%';position:absolute;right:7px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--text-dim);pointer-events:none;}
  .checkline{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-dim);}
  .toggle-btn{width:100%;}
  #curveCanvas{background:#101214;border:1px solid var(--line);border-radius:6px;cursor:crosshair;width:100%;height:auto;display:block;touch-action:none;}
  footer{
    padding:8px 18px;border-top:1px solid var(--line);background:var(--panel);
    font-size:11px;color:var(--text-dim);display:flex;justify-content:space-between;flex-shrink:0;
  }
  input[type=file]{display:none;}

  /* ---------- Mobile bottom menu bar ---------- */
  .mobile-tabbar{display:none;}
  .mobile-tabbar button.tab-btn{
    flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:7px 14px;border:none;border-radius:8px;background:transparent;
    color:var(--text-dim);font-size:10px;line-height:1;white-space:nowrap;
  }
  .mobile-tabbar button.tab-btn svg{width:20px;height:20px;flex-shrink:0;}
  .mobile-tabbar button.tab-btn.active{color:var(--accent);background:rgba(79,209,197,.14);}

  @media (max-width: 860px){
    header{padding:8px 10px;column-gap:4px;}
    .header-actions{gap:4px;}

    .layout{flex-direction:column;position:relative;}
    .stage-wrap{padding:10px;}

    aside#sidePanel{
      width:100%;flex:0 1 auto;
      display:flex;flex-direction:column;
      border-left:none;border-top:1px solid var(--line);
      padding:0;overflow:visible;background:var(--panel);
    }
    .mobile-tabbar{
      order:2;flex:0 0 auto;
      display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;
      gap:2px;padding:4px 6px;
    }
    .mobile-tabbar::-webkit-scrollbar{height:3px;}
    /* Only that menu's control bar should remain while editing — the tab bar
       (used to pick a menu in the first place) disappears until Apply/Cancel. */
    body.editing-mode .mobile-tabbar{display:none;}

    /* Panels take up real space (pushing/shrinking the image area above) instead
       of floating over the image, so opening a taller panel visibly shrinks the
       image to fit whatever room is left. */
    aside#sidePanel > .group{display:none;}
    aside#sidePanel > .group.mobile-active{
      order:1;
      display:block;
      max-height:60vh;overflow-y:auto;
      background:var(--panel);border-top:1px solid var(--line);
      margin:0;border-radius:0;border-left:none;border-right:none;border-bottom:none;
    }
    aside#sidePanel .group-body{display:flex!important;flex-direction:column;gap:10px;}
    aside#sidePanel .group > summary{pointer-events:none;}
    aside#sidePanel .group > summary:after{content:'';}
  }
</style>
</head>
<body>

<header>
  <input type="file" id="fileInput" accept="image/*">
  <div class="header-side header-side-left">
    <button id="menuCancelBtn" class="menu-cancel" type="button">취소</button>
  </div>
  <div class="header-actions">
    <button id="undoBtn" class="iconbtn" disabled type="button" title="실행 취소" aria-label="실행 취소">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg>
    </button>
    <button id="resetBtn" class="iconbtn" disabled type="button" title="되돌리기" aria-label="되돌리기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg>
    </button>
    <button id="downloadBtn" class="iconbtn primary" disabled type="button" title="다운로드" aria-label="다운로드">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    </button>
  </div>
  <div class="header-crop-size" id="headerCropSize"></div>
  <div class="header-close header-side-right">
    <button id="closeBtn" class="iconbtn close-btn" disabled type="button" title="닫기" aria-label="닫기">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg>
    </button>
    <button id="menuApplyBtn" class="menu-apply primary" type="button">적용</button>
  </div>
</header>

<div class="layout">
  <div class="stage-wrap" id="stageWrap">
    <div class="empty-state" id="emptyState">
      이미지를 업로드하면 편집을 시작할 수 있어요<br>
      <button class="primary" type="button" onclick="document.getElementById('fileInput').click()">이미지 선택하기</button>
    </div>
    <div class="canvas-holder" id="canvasHolder" style="display:none;">
      <canvas id="mainCanvas"></canvas>
      <canvas id="overlayCanvas"></canvas>
      <div class="crop-frame" id="cropFrame" hidden>
        <div class="crop-rect" id="cropFrameRect">
          <div class="crop-gridline v1"></div><div class="crop-gridline v2"></div>
          <div class="crop-gridline h1"></div><div class="crop-gridline h2"></div>
          <div class="crop-handle edge n" data-handle="n"></div>
          <div class="crop-handle edge s" data-handle="s"></div>
          <div class="crop-handle edge e" data-handle="e"></div>
          <div class="crop-handle edge w" data-handle="w"></div>
          <div class="crop-handle corner nw" data-handle="nw"></div>
          <div class="crop-handle corner ne" data-handle="ne"></div>
          <div class="crop-handle corner sw" data-handle="sw"></div>
          <div class="crop-handle corner se" data-handle="se"></div>
        </div>
      </div>
    </div>
    <button id="layerToggleBtn" class="layer-tab-btn" type="button" title="레이어" aria-label="레이어" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 21 7 12 12 3 7"/><polyline points="3 12 12 17 21 12"/><polyline points="3 17 12 22 21 17"/></svg>
    </button>
    <div class="layer-panel collapsed" id="layerPanel">
      <div class="layer-panel-header">레이어</div>
      <div class="layer-list" id="layerList"></div>
    </div>
  </div>

  <aside id="sidePanel" style="display:none;">

    <nav class="mobile-tabbar" id="mobileTabBar">
      <button class="tab-btn" type="button" data-target="group-draw">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
        <span>그리기</span>
      </button>
      <button class="tab-btn" type="button" data-target="group-selection">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2" stroke-dasharray="4 3"/></svg>
        <span>선택영역</span>
      </button>
      <button class="tab-btn" type="button" data-target="group-crop">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>
        <span>크롭</span>
      </button>
      <button class="tab-btn" type="button" data-target="group-resize">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
        <span>사이즈 조절</span>
      </button>
      <button class="tab-btn" type="button" data-target="group-effects">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8z"/></svg>
        <span>효과</span>
      </button>
      <button class="tab-btn" type="button" data-target="group-sc">
