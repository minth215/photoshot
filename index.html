  // ---------- Local persistence (survive a PWA background/reload) ----------
  // As an installed PWA, the OS/browser can discard this page's whole JS
  // state while it's backgrounded and it comes back as a fresh reload —
  // losing everything unless it's saved somewhere that outlives the page.
  // IndexedDB (not localStorage: layer pixels are ImageData objects, which
  // structured-clone straight into IndexedDB and would blow past
  // localStorage's much smaller quota) holds one single record: the whole
  // project as of the last save. It's opportunistic — any failure (quota,
  // private browsing, IndexedDB unavailable) just means this session isn't
  // recoverable, never a hard error for the editor itself.
  const IDB_NAME = 'photoshot-db', IDB_STORE = 'project', IDB_KEY = 'current';
  let idbOpenPromise = null;
  function openProjectDB(){
    if(idbOpenPromise) return idbOpenPromise;
    idbOpenPromise = new Promise((resolve,reject)=>{
      if(!window.indexedDB){ reject(new Error('no indexedDB')); return; }
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = ()=>{ req.result.createObjectStore(IDB_STORE); };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> reject(req.error);
    });
    return idbOpenPromise;
  }
  async function saveProjectToStorage(){
    if(!mainCanvas.width || !mainCanvas.height) return;
    const snap = snapshotState();
    const record = {
      w: snap.w, h: snap.h, activeLayerId: snap.activeLayerId, hasSelection: snap.hasSelection, mask: snap.mask,
      layers: snap.layers.map(l=>({
        id:l.id, name:l.name, visible:l.visible, locked:l.locked, opacity:l.opacity, blendMode:l.blendMode,
        adjustmentType:l.adjustmentType, adjustmentParams:l.adjustmentParams, adjustmentSourceLayerId:l.adjustmentSourceLayerId,
        // Store the thumbnail's own pixels (structured-cloneable) rather than
        // the <canvas> element itself, which IndexedDB can't clone.
        adjustmentMaskThumb: l.adjustmentMaskThumb ? l.adjustmentMaskThumb.getContext('2d').getImageData(0,0,l.adjustmentMaskThumb.width,l.adjustmentMaskThumb.height) : null,
        img: l.img
      }))
    };
    try{
      const db = await openProjectDB();
      await new Promise((resolve,reject)=>{
        const tx = db.transaction(IDB_STORE,'readwrite');
        tx.objectStore(IDB_STORE).put(record, IDB_KEY);
        tx.oncomplete = resolve;
        tx.onerror = ()=> reject(tx.error);
      });
    }catch(err){ /* not recoverable this session — editing itself is unaffected */ }
  }
  async function clearProjectStorage(){

        const tx = db.transaction(IDB_STORE,'readwrite');

        tx.oncomplete = resolve;
        tx.onerror = ()=> reject(tx.error);
      });
    }catch(err){}
  }
  async function loadProjectFromStorage(){

        const req = tx.objectStore(IDB_STORE).get(IDB_KEY);
        req.onsuccess = ()=> resolve(req.result || null);
        req.onerror = ()=> reject(req.error);
      });
    }catch(err){ return null; }
  }
  // Debounced on every edit (pushUndo covers essentially every discrete
  // action) so a burst of edits doesn't re-save the whole canvas on each
  // one; flushed immediately whenever the page is about to actually
  // disappear, since a debounce timer never gets to fire after that.
  let projectSaveTimer = null;

    if(projectSaveTimer) clearTimeout(projectSaveTimer);

  // ---------- Selection overlay rendering (Photoshop-style marching ants) ----------
  const showSelOverlayChk = document.getElementById('showSelOverlay');
  const selectionTopbar = document.getElementById('selectionTopbar');
  const clearSelFloatBtn = document.getElementById('clearSelFloatBtn');

  // Traces the mask's alpha boundary (thresholded at 50%) into one or more
  // closed polylines, cached as Path2D — recomputed only when the mask
  // itself actually changes (see maskVersion below), never per animation
  // frame or during a live lasso/shape drag preview, since a full-canvas
  // pixel scan on every pointermove would be far too slow.
  let selectionContourPaths = [];
  let maskVersion = 0;
  let contourMaskVersion = -1;
  function computeSelectionContours(){
    selectionContourPaths = [];
    const w = maskCanvas.width, h = maskCanvas.height;
    if(!hasSelection || !w || !h) return;
    const data = mctx.getImageData(0,0,w,h).data;
    const THRESH = 128;
    const sel = (x,y) => (x>=0 && y>=0 && x<w && y<h) ? data[(y*w+x)*4+3] >= THRESH : false;
    // Adjacency graph over grid VERTICES (integer corner points), one edge
    // per selected/unselected pixel boundary — a well-formed region's
    // boundary is then just a set of simple loops through this graph.
    const key = (x,y) => x*(h+1)+y;
    const adj = new Map();
    function addEdge(x1,y1,x2,y2){
      const k1=key(x1,y1), k2=key(x2,y2);
      if(!adj.has(k1)) adj.set(k1,[]);
      if(!adj.has(k2)) adj.set(k2,[]);
      adj.get(k1).push(k2);
      adj.get(k2).push(k1);
    }
    for(let y=0;y<h;y++){
      for(let x=0;x<w;x++){
        if(!sel(x,y)) continue;
        if(!sel(x,y-1)) addEdge(x,y,x+1,y);
        if(!sel(x,y+1)) addEdge(x,y+1,x+1,y+1);
        if(!sel(x-1,y)) addEdge(x,y,x,y+1);
        if(!sel(x+1,y)) addEdge(x+1,y,x+1,y+1);
      }
    }
    const visitedEdges = new Set();
    const edgeKey = (a,b) => a<b ? a*1e9+b : b*1e9+a;
    for(const [startKey, neighbors] of adj){
      for(const n0 of neighbors){
        const ek0 = edgeKey(startKey, n0);
        if(visitedEdges.has(ek0)) continue;
        const verts = [startKey];
        visitedEdges.add(ek0);
        let cur = n0;
        verts.push(cur);
        while(cur!==startKey){
          const opts = adj.get(cur) || [];
          let next = -1;
          for(const o of opts){
            const oek = edgeKey(cur,o);
            if(!visitedEdges.has(oek)){ next = o; break; }
          }
          if(next===-1) break;
          visitedEdges.add(edgeKey(cur,next));
          cur = next;
          verts.push(cur);
          if(verts.length > (w+1)*(h+1)) break; // safety valve
        }
        if(verts.length>2){
          const path = new Path2D();
          const vx = k => Math.floor(k/(h+1)), vy = k => k - vx(k)*(h+1);
          path.moveTo(vx(verts[0]), vy(verts[0]));
          for(let i=1;i<verts.length;i++) path.lineTo(vx(verts[i]), vy(verts[i]));
          selectionContourPaths.push(path);
        }
      }
    }
  }
  let antsPhase = 0;
  let antsRAF = null;
  function stepAnts(){
    antsPhase = (antsPhase+0.35) % 12;
    drawSelectionOverlayFrame();
    antsRAF = requestAnimationFrame(stepAnts);
  }
  function updateSelectionFloatUI(){
    const show = hasSelection && !cropModeActive;
    selectionTopbar.hidden = !show;
    const animating = show && showSelOverlayChk.checked;
    if(animating && !antsRAF) antsRAF = requestAnimationFrame(stepAnts);
    else if(!animating && antsRAF){ cancelAnimationFrame(antsRAF); antsRAF = null; }
  }
  // The actual draw — cheap, reused every animation frame. renderSelectionOverlay()
  // (below) is the one that also decides whether the contour needs re-tracing.
  function drawSelectionOverlayFrame(){
    const w=overlayCanvas.width, h=overlayCanvas.height;
    octx.clearRect(0,0,w,h);
    if(hasSelection && showSelOverlayChk.checked){
      // Classic black/white marching ants: two passes of the same dash
      // pattern, offset by half a cycle, so the line reads against any
      // background instead of just one color's dashes disappearing into it.
      octx.save();
      octx.lineWidth = 1;
      octx.setLineDash([6,6]);
      octx.lineDashOffset = -antsPhase;
      octx.strokeStyle = '#000';
      for(const p of selectionContourPaths) octx.stroke(p);
      octx.lineDashOffset = -antsPhase+6;
      octx.strokeStyle = '#fff';
      for(const p of selectionContourPaths) octx.stroke(p);
      octx.restore();
    }
    if(lassoPoints.length>1){
      octx.strokeStyle='#3ddc97'; octx.lineWidth=1.5;
      octx.beginPath();
      octx.moveTo(lassoPoints[0][0], lassoPoints[0][1]);
      for(let p of lassoPoints) octx.lineTo(p[0],p[1]);
      octx.stroke();
    }
    if(shapeSelectStart && shapeSelectCurrent){
      const r = computeShapeRect(shapeSelectStart[0], shapeSelectStart[1], shapeSelectCurrent[0], shapeSelectCurrent[1], isShapeAspectLocked());
      octx.strokeStyle='#3ddc97'; octx.lineWidth=1.5;
      traceShapePath(octx, currentTool, r);
      octx.stroke();
    }

  // The general-purpose "selection state changed, please redraw" entry
  // point used throughout the file — re-traces the contour only when
  // maskVersion has actually moved since the last trace (bumped wherever
  // mctx's pixels are genuinely mutated), so calling this on every lasso
  // pointermove during a drag (mask untouched, only the live preview
  // moves) stays cheap.
  function renderSelectionOverlay(){
    if(maskVersion!==contourMaskVersion){
      computeSelectionContours();
      contourMaskVersion = maskVersion;
    }
    updateSelectionFloatUI();
    drawSelectionOverlayFrame();
  }
  showSelOverlayChk.addEventListener('change', renderSelectionOverlay);
  clearSelFloatBtn.addEventListener('click', ()=>{
    beginEdit();

  // Selection actions no longer push their own undo step: opening 선택 영역
  // already began a session (beginEdit), and every edit made while it's open —
  // however many brush strokes, invert/clear clicks, feather adjustments — bundles
  // into one undo checkpoint when the header's 적용 is pressed.
  document.getElementById('invertSelBtn').addEventListener('click', ()=>{
    beginEdit();
    sessionDirty = true;
    ensureMaskInitialized();
    const w=maskCanvas.width,h=maskCanvas.height;
    const id = mctx.getImageData(0,0,w,h);
    for(let i=3;i<id.data.length;i+=4) id.data[i] = 255-id.data[i];
    mctx.putImageData(id,0,0);
    maskVersion++;
    renderSelectionOverlay();
  });

  // Feather: toggled on/off via a switch. Turning it on captures the mask as
  // it was right then (still sharp) as a fixed baseline — the slider always
  // feathers FROM that baseline (never compounding blur on itself), and
  // turning it back off restores that exact baseline.
  const featherWrap = document.getElementById('featherWrap');
  const featherToggle = document.getElementById('featherToggle');
  const featherRange = document.getElementById('featherRange');
  let featherOnMask = null;
  featherToggle.addEventListener('change', ()=>{
    beginEdit();
    ensureMaskInitialized();
    sessionDirty = true;
    if(featherToggle.checked){
      featherWrap.style.display = '';
      featherOnMask = mctx.getImageData(0,0,maskCanvas.width,maskCanvas.height);
      featherRange.value = 20;
      document.getElementById('featherVal').textContent = '20';
      const blurred = boxBlurAlpha(featherOnMask, maskCanvas.width, maskCanvas.height, 20);
      mctx.putImageData(blurred,0,0);
    } else {
      featherWrap.style.display = 'none';
      if(featherOnMask) mctx.putImageData(featherOnMask,0,0);
      featherOnMask = null;
    }
    maskVersion++;
    renderSelectionOverlay();
  });
  featherRange.addEventListener('input', ()=>{
    document.getElementById('featherVal').textContent = featherRange.value;
    if(!featherOnMask) return;
    sessionDirty = true;
    const r = parseInt(featherRange.value,10);
    const blurred = boxBlurAlpha(featherOnMask, maskCanvas.width, maskCanvas.height, r);
    mctx.putImageData(blurred,0,0);
    maskVersion++;
    renderSelectionOverlay();
  });
  function resetFeatherUI(){
    featherToggle.checked = false;
    featherWrap.style.display = 'none';
    featherOnMask = null;
  }
  // Re-blurs whatever the mask currently is, at the feather panel's current
  // radius — called after every action that actually changes the selection
  // (a lasso completing, a brush stroke ending) so a feather that's already
  // on stays applied to the new shape, instead of only taking effect the
  // next time the toggle itself is flipped.
  function reapplyFeatherIfOn(){
    if(!featherToggle.checked) return;
    featherOnMask = mctx.getImageData(0,0,maskCanvas.width,maskCanvas.height);
    const r = parseInt(featherRange.value,10);
    const blurred = boxBlurAlpha(featherOnMask, maskCanvas.width, maskCanvas.height, r);
    mctx.putImageData(blurred,0,0);
    maskVersion++;
  }
  // 영역 선택 opens with feather ON by default — mirrors exactly what
  // checking the box does, applied to whatever the current selection already
  // is. Doesn't mark the session dirty: it's a passive default, not something
  // the user asked for, so backing out via 취소 without touching anything
  // else stays a silent no-op instead of prompting a confirm.
  function applyDefaultFeather(){
    featherToggle.checked = true;
    featherWrap.style.display = '';
    featherRange.value = 20;
    document.getElementById('featherVal').textContent = '20';
    // Nothing to feather yet on a blank slate — and initializing the mask
    // here would wrongly pre-select the whole canvas, which then makes a
    // fresh lasso/brush selection a no-op (it can only ADD to the existing
    // mask, never replace it). Only pre-feather when a selection already
    // exists to soften (e.g. re-opening the menu on one made earlier).
    if(!hasSelection) return;
    featherOnMask = mctx.getImageData(0,0,maskCanvas.width,maskCanvas.height);
    const blurred = boxBlurAlpha(featherOnMask, maskCanvas.width, maskCanvas.height, 20);
    mctx.putImageData(blurred,0,0);
    maskVersion++;
    renderSelectionOverlay();
  }
  function applySelectionAction(){ commitEdit(); resetFeatherUI(); }
  function cancelSelectionAction(){ cancelEdit(); resetFeatherUI(); }

  // ---------- Lasso & shape selection interaction ----------
  let lassoPoints = [];
  let dragStart = null;
  let bgPaintingActive = false;

  function canvasPos(e){
    const rect = overlayCanvas.getBoundingClientRect();
    const scaleX = overlayCanvas.width/rect.width;
    const scaleY = overlayCanvas.height/rect.height;
    return [ (e.clientX-rect.left)*scaleX, (e.clientY-rect.top)*scaleY ];
  }

  // 사각형/원 selection: drag out a bounding box from the pointerdown point
  // to wherever the pointer currently is. Locking the aspect (square/circle,
  // never an oval) is driven by whichever of two equivalent modifiers is
  // currently active — Shift on a physical keyboard, or a second finger
  // touching down while the first is still dragging (checked live off
  // activePointers.size rather than a stored flag, so it can't go stale if
  // events arrive out of order).
  let shiftHeld = false;
  window.addEventListener('keydown', e=>{
    if(e.key==='Shift' && !shiftHeld){
      shiftHeld = true;
      if(shapeSelectPointerId!=null) renderSelectionOverlay();
    }
  });
  window.addEventListener('keyup', e=>{
    if(e.key==='Shift'){
      shiftHeld = false;
      if(shapeSelectPointerId!=null) renderSelectionOverlay();
    }
  });
  let shapeSelectPointerId = null;
  let shapeSelectStart = null;
  let shapeSelectCurrent = null;
  function isShapeAspectLocked(){
    return shiftHeld || (shapeSelectPointerId!=null && activePointers.size>=2);
  }
  // Normalizes a drag into a top-left-origin {x,y,w,h} box; when locked,
  // both sides are forced to the larger of the two, each keeping the
  // direction (sign) the drag was already heading in.
  function computeShapeRect(x0,y0,x1,y1,locked){
    let w = x1-x0, h = y1-y0;
    if(locked){
      const s = Math.max(Math.abs(w), Math.abs(h));
      w = (w<0?-1:1)*s;
      h = (h<0?-1:1)*s;
    }
    const x = w<0 ? x0+w : x0;
    const y = h<0 ? y0+h : y0;
    return {x, y, w:Math.abs(w), h:Math.abs(h)};
  }
  // Shared by both the live preview (renderSelectionOverlay) and the
  // pointerup finalize step, so the two can never draw different shapes.
  function traceShapePath(ctx, tool, r){
    ctx.beginPath();
    if(tool==='rect-select') ctx.rect(r.x, r.y, r.w, r.h);
    else ctx.ellipse(r.x+r.w/2, r.y+r.h/2, r.w/2, r.h/2, 0, 0, Math.PI*2);
  }

  // ---------- Background removal ----------
  // Runs entirely client-side with no ML model: a flood fill seeded from
  // every border pixel treats anything color-connected to the edge (within a
  // tolerance) as background. This works well for the common case of a fairly
  // uniform backdrop, and the +/− brushes below cover whatever it gets wrong.
  const bgBrushSizeInput = document.getElementById('bgBrushSize');
  const bgBrushHardnessInput = document.getElementById('bgBrushHardness');
  bgBrushSizeInput.addEventListener('input', ()=>{ document.getElementById('bgBrushSizeVal').textContent = bgBrushSizeInput.value; });
  bgBrushHardnessInput.addEventListener('input', ()=>{ document.getElementById('bgBrushHardnessVal').textContent = bgBrushHardnessInput.value; });

  function detectBackgroundKeepMask(src, w, h){
    const n = w*h;
    const keep = new Uint8ClampedArray(n).fill(255);
    const visited = new Uint8Array(n);
    const TOLERANCE = 28; // neighbor-to-neighbor step tolerance (lets gradients through)
    const REF_TOLERANCE = 90; // max drift from the estimated background color
    const stack = [];
    function colorDist(i,j){
      const ii=i*4, jj=j*4;
      const dr=src[ii]-src[jj], dg=src[ii+1]-src[jj+1], db=src[ii+2]-src[jj+2];
      return Math.sqrt(dr*dr+dg*dg+db*db);
    }
    // Estimate a robust reference background color from the border pixels
    // using the most common coarsely-quantized color bucket (mode, not mean)
    // so a subject that partially touches the border can't skew the estimate.
    const buckets = new Map();
    function addBorderSample(i){
      const ii = i*4;
      const key = (src[ii]>>4)*256 + (src[ii+1]>>4)*16 + (src[ii+2]>>4);
      let b = buckets.get(key);
      if(!b){ b = {count:0, r:0, g:0, b:0}; buckets.set(key,b); }
      b.count++; b.r+=src[ii]; b.g+=src[ii+1]; b.b+=src[ii+2];
    }
    for(let x=0;x<w;x++){ addBorderSample(x); addBorderSample((h-1)*w+x); }
    for(let y=0;y<h;y++){ addBorderSample(y*w); addBorderSample(y*w+w-1); }
    let best = null;
    for(const b of buckets.values()){ if(!best || b.count>best.count) best = b; }
    const refR = best.r/best.count, refG = best.g/best.count, refB = best.b/best.count;
    function refDist(i){
      const ii=i*4;
      const dr=src[ii]-refR, dg=src[ii+1]-refG, db=src[ii+2]-refB;
      return Math.sqrt(dr*dr+dg*dg+db*db);
    }
    // Only seed the flood fill from border pixels that actually look like the
    // background color — a subject touching the border must not be seeded.
    function seed(i){ if(refDist(i) < REF_TOLERANCE) stack.push(i); }
    for(let x=0;x<w;x++){ seed(x); seed((h-1)*w+x); }
    for(let y=0;y<h;y++){ seed(y*w); seed(y*w+w-1); }
    while(stack.length){
      const i = stack.pop();
      if(visited[i]) continue;
      visited[i] = 1;
      keep[i] = 0;
      const x = i%w, y = (i-x)/w;
      // Both checks matter: the local step catches a sharp edge immediately,
      // while the global reference bound stops a long chain of small steps
      // from drifting all the way into a differently-colored subject.
      if(x>0 && !visited[i-1] && colorDist(i,i-1)<TOLERANCE && refDist(i-1)<REF_TOLERANCE) stack.push(i-1);
      if(x<w-1 && !visited[i+1] && colorDist(i,i+1)<TOLERANCE && refDist(i+1)<REF_TOLERANCE) stack.push(i+1);
      if(y>0 && !visited[i-w] && colorDist(i,i-w)<TOLERANCE && refDist(i-w)<REF_TOLERANCE) stack.push(i-w);
      if(y<h-1 && !visited[i+w] && colorDist(i,i+w)<TOLERANCE && refDist(i+w)<REF_TOLERANCE) stack.push(i+w);
    }
    return keep;
  }
  function bgTargetLayer(){
    if(!editingSnapshot) return null;
    return layers.find(l=>l.id===editingSnapshot.activeLayerId) || null;
  }
  // Re-derives the active layer's pixels as (original × current keep-mask) —
  // called after every auto-detect run or +/− brush stroke.
  function applyBgMaskToLayer(){
    const layer = bgTargetLayer();
    if(!layer || layer.locked) return;
    const layerSnap = editingSnapshot.layers.find(l=>l.id===editingSnapshot.activeLayerId);
    if(!layerSnap) return;
    const w = editingSnapshot.w, h = editingSnapshot.h;
    const base = layerSnap.img.data;
    const maskData = bgMaskCtx.getImageData(0,0,w,h).data;
    const out = new ImageData(w,h);
    for(let i=0;i<base.length;i+=4){
      out.data[i]=base[i]; out.data[i+1]=base[i+1]; out.data[i+2]=base[i+2];
      out.data[i+3] = Math.round(base[i+3] * (maskData[i+3]/255));
    }
    layer.ctx.putImageData(out,0,0);
    compositeLayers();
  }
  function runAutoBgDetect(){
    if(!editingSnapshot) return;
    const layerSnap = editingSnapshot.layers.find(l=>l.id===editingSnapshot.activeLayerId);
    if(!layerSnap) return;
    sessionDirty = true;
    const w = editingSnapshot.w, h = editingSnapshot.h;
    const keep = detectBackgroundKeepMask(layerSnap.img.data, w, h);
    // A light feather on the mask's own alpha softens the cutout edge instead
    // of leaving a hard, aliased silhouette.
    // Kept deliberately small: without color decontamination, feathering a
    // hard-edged cutout just reveals a thin ring of the original background
    // color at partial opacity — a mild 1px softening avoids obvious jaggies
    // without making that fringe more visible.
    const feathered = keep.length ? gaussianApprox(expandToRGBA(keep), w, h, 1) : keep;
    bgMaskCanvas.width = w; bgMaskCanvas.height = h;
    const maskImg = new ImageData(w,h);
    for(let i=0;i<w*h;i++){
      maskImg.data[i*4]=255; maskImg.data[i*4+1]=255; maskImg.data[i*4+2]=255;
      maskImg.data[i*4+3] = feathered[i*4+3];
    }
    bgMaskCtx.putImageData(maskImg,0,0);
    applyBgMaskToLayer();
  }
  function expandToRGBA(alphaOnly){
    const out = new Uint8ClampedArray(alphaOnly.length*4);
    for(let i=0;i<alphaOnly.length;i++) out[i*4+3]=alphaOnly[i];
    return out;
  }
  function paintBgMask(x,y,mode){
    if(!editingSnapshot) return;
    const layer = bgTargetLayer();
    if(!layer || layer.locked) return;
    sessionDirty = true;
    const size = parseInt(bgBrushSizeInput.value,10);
    const hardness = parseInt(bgBrushHardnessInput.value,10)/100;
    const r = size/2;
    bgMaskCtx.save();
    bgMaskCtx.globalCompositeOperation = mode==='sub' ? 'destination-out' : 'source-over';
    const grad = bgMaskCtx.createRadialGradient(x,y,Math.max(0,Math.min(r*hardness,r-0.5)),x,y,r);
    grad.addColorStop(0,'rgba(255,255,255,1)');
    grad.addColorStop(1,'rgba(255,255,255,0)');
    bgMaskCtx.fillStyle = grad;
    bgMaskCtx.beginPath(); bgMaskCtx.arc(x,y,r,0,Math.PI*2); bgMaskCtx.fill();
    bgMaskCtx.restore();
    applyBgMaskToLayer();
  }
  document.getElementById('bgAutoBtn').addEventListener('click', ()=> runAutoBgDetect());
  document.getElementById('bgResetBtn').addEventListener('click', ()=>{
    if(!editingSnapshot) return;
    sessionDirty = true;
    const w=editingSnapshot.w, h=editingSnapshot.h;
    bgMaskCanvas.width=w; bgMaskCanvas.height=h;
    bgMaskCtx.fillStyle='white';
    bgMaskCtx.fillRect(0,0,w,h);
    applyBgMaskToLayer();
  });
  function applyBgRemoveAction(){ commitEdit(); }
  function cancelBgRemoveAction(){ cancelEdit(); }

  // ---------- Draw tool (그리기): paints onto a brand-new top layer ----------
  const drawColorInput = document.getElementById('drawColor');
  const drawSizeInput = document.getElementById('drawSize');
  const drawHardnessInput = document.getElementById('drawHardness');
  const drawExposureInput = document.getElementById('drawExposure');
  let drawBrushType = 'round';
  document.querySelectorAll('#group-draw .ratio-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#group-draw .ratio-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      drawBrushType = btn.dataset.brushtype;
    });
  });
  drawSizeInput.addEventListener('input', ()=>{ document.getElementById('drawSizeVal').textContent = drawSizeInput.value; });
  drawHardnessInput.addEventListener('input', ()=>{ document.getElementById('drawHardnessVal').textContent = drawHardnessInput.value; });
  drawExposureInput.addEventListener('input', ()=>{ document.getElementById('drawExposureVal').textContent = drawExposureInput.value; });

  function hexToRgb(hex){
    const m = /^#([0-9a-f]{6})$/i.exec(hex||'');
    const n = m ? parseInt(m[1],16) : 0x3ddc97;
    return [ (n>>16)&255, (n>>8)&255, n&255 ];
  }
  function rgbToHex(r,g,b){
    return '#' + [r,g,b].map(v=> Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
  }
  // 5-point star outline, centered at (cx,cy), tip pointing straight up.
  function traceStarPath(pctx, cx, cy, outerR){
    const innerR = outerR*0.45;
    let rot = -Math.PI/2;
    const step = Math.PI/5;
    pctx.beginPath();
    pctx.moveTo(cx+Math.cos(rot)*outerR, cy+Math.sin(rot)*outerR);
    for(let i=0;i<5;i++){
      rot += step;
      pctx.lineTo(cx+Math.cos(rot)*innerR, cy+Math.sin(rot)*innerR);
      rot += step;
      pctx.lineTo(cx+Math.cos(rot)*outerR, cy+Math.sin(rot)*outerR);
    }
    pctx.closePath();
  }
  // Shared Photoshop-style brush stamp, used by both 그리기 and 번/닷지 — only
  // the color and composite operation differ between painting a color and
  // dodging/burning (white/black blended via the browser's own native
  // color-dodge/color-burn, same as layer blend modes elsewhere in the app).
  // 원형/사각형 branches are byte-for-byte the pre-existing 그리기 behavior;
  // 별/스프레이 are the new shapes, added alongside them.
  function stampBrush(pctx, x, y, shape, size, hardness, alpha, rgb){
    const r = size/2;
    const [rr,gg,bb] = rgb;
    pctx.save();
    pctx.globalAlpha = alpha;
    if(shape==='square'){
      pctx.fillStyle = `rgb(${rr},${gg},${bb})`;
      pctx.fillRect(x-r, y-r, size, size);
    } else if(shape==='star'){
      // Arbitrary-shape softness: fill the crisp path, then blur it — a hard
      // star (hardness=1) gets no blur, a soft one blurs proportionally to size.
      const blurPx = (1-hardness) * r * 0.6;
      pctx.filter = blurPx>0.05 ? `blur(${blurPx}px)` : 'none';
      pctx.fillStyle = `rgb(${rr},${gg},${bb})`;
      traceStarPath(pctx, x, y, r);
      pctx.fill();
      pctx.filter = 'none';
    } else if(shape==='spray'){
      // Scatter a cloud of small dots instead of a solid fill — density scales
      // with brush size, each dot's own alpha fades out past the hardness radius.
      const dotCount = Math.max(6, Math.round(r/1.5));
      const dotR = Math.max(0.6, size*0.025);
      const edgeR = r*hardness;
      pctx.fillStyle = `rgb(${rr},${gg},${bb})`;
      for(let i=0;i<dotCount;i++){
        const ang = Math.random()*Math.PI*2;
        const dist = Math.random()*r;
        const edgeFactor = dist<=edgeR ? 1 : Math.max(0, 1-(dist-edgeR)/Math.max(0.001,r-edgeR));
        if(edgeFactor<=0) continue;
        pctx.globalAlpha = alpha * edgeFactor * (0.5+Math.random()*0.5);
        pctx.beginPath();
        pctx.arc(x+Math.cos(ang)*dist, y+Math.sin(ang)*dist, dotR, 0, Math.PI*2);
        pctx.fill();
      }
    } else { // round
      const grad = pctx.createRadialGradient(x,y,Math.max(0,Math.min(r*hardness,r-0.5)),x,y,r);
      grad.addColorStop(0, `rgba(${rr},${gg},${bb},1)`);
      grad.addColorStop(1, `rgba(${rr},${gg},${bb},0)`);
      pctx.fillStyle = grad;
      pctx.beginPath(); pctx.arc(x,y,r,0,Math.PI*2); pctx.fill();
    }
    pctx.restore();
  }

  // A single dedicated drawing layer is created lazily on the very first
  let drawingActive = false;
  let lastDrawPos = null;

  // Per-stroke undo/redo, local to the current 그리기 session (separate from
  // the document-level undo/redo) — lets the header's 획 실행취소/다시실행
  // step back through individual strokes before committing the whole session.
  const drawUndoBtn = document.getElementById('drawUndoBtn');
  const drawRedoBtn = document.getElementById('drawRedoBtn');
  let strokeUndoStack = [];
  let strokeRedoStack = [];
  function updateDrawHistoryButtons(){
    drawUndoBtn.disabled = strokeUndoStack.length===0;
    drawRedoBtn.disabled = strokeRedoStack.length===0;
  }
  drawUndoBtn.addEventListener('click', ()=>{
    if(strokeUndoStack.length===0) return;
    const pre = strokeUndoStack.pop();
    strokeRedoStack.push(snapshotState());
    restoreLayersFrom(pre);
    updateDrawHistoryButtons();
  });
  drawRedoBtn.addEventListener('click', ()=>{
    if(strokeRedoStack.length===0) return;
    const nxt = strokeRedoStack.pop();
    strokeUndoStack.push(snapshotState());
    restoreLayersFrom(nxt);
    updateDrawHistoryButtons();
  });

  function paintDrawDab(x,y){
    if(!editingSnapshot) return;
    // Paint onto whichever layer was active when this 그리기 session began —
    // no automatic layer creation. Key off the session's pinned layer (not
    // whatever is active right now) so the layer panel can still be opened
    // mid-session, matching previewEffect's pattern.
    const layer = layers.find(l=>l.id===editingSnapshot.activeLayerId);
    if(!layer || layer.locked) return;
    sessionDirty = true;
    const size = parseInt(drawSizeInput.value,10);
    const hardness = parseInt(drawHardnessInput.value,10)/100;
    const exposure = parseInt(drawExposureInput.value,10)/100;
    stampBrush(layer.ctx, x, y, drawBrushType, size, hardness, exposure, hexToRgb(drawColorInput.value));
    compositeLayers();
  }
  function paintDrawLine(x1,y1,x2,y2){
    const size = parseInt(drawSizeInput.value,10);
    const dist = Math.hypot(x2-x1,y2-y1);
    const step = Math.max(1, size/4);
    const n = Math.max(1, Math.floor(dist/step));
    for(let i=1;i<=n;i++){
      const t = i/n;
      paintDrawDab(x1+(x2-x1)*t, y1+(y2-y1)*t);
    }
  }
  function applyDrawAction(){
    commitEdit();
    strokeUndoStack = []; strokeRedoStack = [];
    updateDrawHistoryButtons();
  }
  function cancelDrawAction(){
    cancelEdit();
    strokeUndoStack = []; strokeRedoStack = [];
    updateDrawHistoryButtons();
  }

  // 스포이드: samples the composited image (mainCanvas), not just the active
  // layer, matching "what the user actually sees" — non-destructive, so it
  // reads pixels directly rather than going through beginEdit()/sessionDirty.
  function sampleEyedropper(x,y){
    const px = Math.max(0, Math.min(mainCanvas.width-1, Math.floor(x)));
    const py = Math.max(0, Math.min(mainCanvas.height-1, Math.floor(y)));
    const [r,g,b] = ctx.getImageData(px,py,1,1).data;
    drawColorInput.value = rgbToHex(r,g,b);
  }

  // ---------- Burn/Dodge tool (번/닷지): same incremental brush-stamp model
  // as 그리기 above, but instead of painting a flat color it manually
  // scales each pixel under the brush toward white/black — applied straight
  // onto the active layer, no new layer created.
  //
  // Two things this deliberately does NOT do, both tried and rejected first:
  // (1) The browser's native color-dodge/color-burn globalCompositeOperation
  //     (like layer blend modes elsewhere in this app use), stamping an
  //     actual white/black pixel as the blend's source color — that forces
  //     the spec's Cs>=1 (dodge) / Cs<=0 (burn) branch on every dab, so the
  //     formula collapses to flat "B=1"/"B=0" regardless of the pixel's own
  //     tone, and the dab's alpha ends up just doing plain linear
  //     interpolation toward pure white/black — i.e. acting like a
  //     white/black brush.
  // (2) The Color Dodge/Color Burn BLEND-MODE formula (from the W3C
  //     compositing spec) applied manually per pixel with exposure fed in as
  //     its Cs input — better than (1) but still wrong: that formula is
  //     extremely non-linear per channel (its slope explodes as Cb
  //     approaches the burned-toward extreme), so at a LOW exposure it can
  //     still swing a mid-tone pixel hard, and — critically — each of the
  //     three channels swings by a different amount depending on its own
  //     starting value, visibly shifting the pixel's hue/saturation instead
  //     of just its brightness (Photoshop's own Dodge/Burn TOOL is not the
  //     same thing as its Color Dodge/Color Burn BLEND MODE, despite the
  //     shared name).
  // What Photoshop's tool actually reads as at the Midtones range (the
  // default, and the only one this app offers) is much closer to a plain
  // photographic screen/multiply scale: burn multiplies every channel by
  // the SAME (1-exposure) factor, which by construction can never change
  // the R:G:B ratio — only brightness moves, never hue/saturation — and the
  // change is directly proportional to exposure (25% exposure = roughly a
  // 25% brightness cut per full-strength dab, not a disproportionate jump).
  // Dodge mirrors it as a screen scale. The brush's own alpha (from
  // stampBrush's shape/hardness falloff) still supplies the spatial
  // coverage — how much of the dab touches each pixel — entirely separate
  // from exposure, which is the strength of the tonal move itself.
  const dbSizeInput = document.getElementById('dbSize');
  const dbHardnessInput = document.getElementById('dbHardness');
  const dbExposureInput = document.getElementById('dbExposure');
  let dbBrushType = 'round';
  let dbTool = 'burn';
  document.querySelectorAll('#group-dodgeburn [data-dbbrushtype]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#group-dodgeburn [data-dbbrushtype]').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      dbBrushType = btn.dataset.dbbrushtype;
    });
  });
  document.querySelectorAll('#group-dodgeburn [data-dbtool]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#group-dodgeburn [data-dbtool]').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      dbTool = btn.dataset.dbtool;
      setTool(dbTool==='burn' ? 'db-burn' : 'db-dodge');
    });
  });
  dbSizeInput.addEventListener('input', ()=>{ document.getElementById('dbSizeVal').textContent = dbSizeInput.value; });
  dbHardnessInput.addEventListener('input', ()=>{ document.getElementById('dbHardnessVal').textContent = dbHardnessInput.value; });
  dbExposureInput.addEventListener('input', ()=>{ document.getElementById('dbExposureVal').textContent = dbExposureInput.value; });

  // A scratch canvas reused across dabs (resized only when the brush's own
  // footprint changes) to avoid allocating a new canvas on every dab —
  // stampBrush draws the shape's alpha falloff onto it at full strength
  // (alpha=1, opaque white), which is then read back as the dab's per-pixel
  // spatial coverage mask, entirely separate from the exposure-driven blend.
  const dbMaskCanvas = document.createElement('canvas');
  const dbMaskCtx = dbMaskCanvas.getContext('2d', {willReadFrequently:true});
  function brushMaskDim(size){
    // Padding covers the star shape's blur filter bleeding past its own r.
    return Math.max(1, Math.ceil(size + 8));
  }
  // A real brush stroke is many overlapping dabs (a dab roughly every
  // size/4 px of travel, and a mouse/touch fires pointermove far more often
  // than that) — re-applying the multiply/screen formula on top of its OWN
  // last result at every single one of those dabs compounds fast: even a
  // "gentle" 25% exposure burn, reapplied 10+ times over the same spot in
  // one unbroken drag, multiplies down to near-black in a fraction of a
  // second, which reads as "the brush just paints black/white" exactly like
  // the bug this was meant to fix. Photoshop's own tool doesn't compound
  // like that within a single stroke: dodgeburn a spot repeatedly without
  // lifting the pointer and it approaches one dab's worth of change, not
  // zero/max.
  //
  // The fix mirrors that: dbStrokeBase is a snapshot of the active layer
  // taken once at the stroke's first dab (pointerdown) — every dab for the
  // rest of that stroke blends from THIS frozen base, never from whatever
  // the previous dab just wrote. dbCoverage is a same-size per-pixel "how
  // much of this stroke's brush has this pixel seen so far" map that only
  // ever takes the MAX across dabs (not a sum/compounded union) — so
  // scrubbing back and forth over the same spot within one stroke converges
  // to that pixel's peak brush alpha, then stays there for the rest of the
  // stroke. Lifting the pointer and starting a fresh stroke resets both,
  // which is what lets repeated separate strokes keep pushing further,
  // exactly like the real tool.
  let dbStrokeBase = null; // {data:Uint8ClampedArray, w, h} snapshot of the layer at stroke start
  let dbStrokeLayerId = null;
  let dbCoverage = null; // Uint8ClampedArray, one byte per pixel, full layer size
  function resetDodgeBurnStroke(){
    dbStrokeBase = null;
    dbStrokeLayerId = null;
    dbCoverage = null;
  }
  function paintDodgeBurnDab(x,y){
    if(!editingSnapshot) return;
    const layer = layers.find(l=>l.id===editingSnapshot.activeLayerId);
    if(!layer || layer.locked) return;
    sessionDirty = true;
    const size = parseInt(dbSizeInput.value,10);
    const hardness = parseInt(dbHardnessInput.value,10)/100;
    const exposure = parseInt(dbExposureInput.value,10)/100;
    const isBurn = currentTool==='db-burn';
    const w = layer.canvas.width, h = layer.canvas.height;

    if(dbStrokeBase===null || dbStrokeLayerId!==layer.id){
      dbStrokeBase = layer.ctx.getImageData(0,0,w,h).data;
      dbStrokeLayerId = layer.id;
      dbCoverage = new Uint8ClampedArray(w*h);
    }

    const dim = brushMaskDim(size);
    if(dbMaskCanvas.width!==dim || dbMaskCanvas.height!==dim){
      dbMaskCanvas.width = dim; dbMaskCanvas.height = dim;
    } else {
      dbMaskCtx.clearRect(0,0,dim,dim);
    }
    stampBrush(dbMaskCtx, dim/2, dim/2, dbBrushType, size, hardness, 1, [255,255,255]);

    const left = Math.round(x - dim/2), top = Math.round(y - dim/2);
    const sx = Math.max(0, left), sy = Math.max(0, top);
    const ex = Math.min(w, left+dim), ey = Math.min(h, top+dim);
    const rw = ex-sx, rh = ey-sy;
    if(rw<=0 || rh<=0) return;

    const maskData = dbMaskCtx.getImageData(sx-left, sy-top, rw, rh).data;
    // Fold this dab into the running per-pixel MAX coverage for the stroke.
    for(let ry=0; ry<rh; ry++){
      for(let rx=0; rx<rw; rx++){
        const covIdx = (sy+ry)*w + (sx+rx);
        const dabA = maskData[(ry*rw+rx)*4+3];
        if(dabA>dbCoverage[covIdx]) dbCoverage[covIdx] = dabA;
      }
    }
    // Recompute this region from the STROKE'S ORIGINAL pixels + current
    // coverage — never from whatever's currently sitting in the canvas —
    // so repeated overlapping dabs within one stroke never compound.
    const region = layer.ctx.createImageData(rw, rh);
    const outData = region.data;
    for(let ry=0; ry<rh; ry++){
      for(let rx=0; rx<rw; rx++){
        const px = sx+rx, py = sy+ry;
        const baseIdx = (py*w+px)*4;
        const outIdx = (ry*rw+rx)*4;
        const as = dbCoverage[py*w+px]/255;
        if(as<=0){
          outData[outIdx]=dbStrokeBase[baseIdx]; outData[outIdx+1]=dbStrokeBase[baseIdx+1];
          outData[outIdx+2]=dbStrokeBase[baseIdx+2]; outData[outIdx+3]=dbStrokeBase[baseIdx+3];
          continue;
        }
        // Burn multiplies every channel by the same factor (hue/saturation-
        // preserving, proportional to exposure); dodge is its screen-blend
        // mirror. See the comment above this section for why — not the
        // Color Dodge/Color Burn blend-mode formula.
        for(let c=0;c<3;c++){
          const cb = dbStrokeBase[baseIdx+c]/255;
          const b = isBurn ? cb*(1-exposure) : 1-(1-cb)*(1-exposure);
          outData[outIdx+c] = Math.round((as*b + (1-as)*cb)*255);
        }
        // Alpha channel is left untouched — dodge/burn only ever changes
        // tone, never transparency.
        outData[outIdx+3] = dbStrokeBase[baseIdx+3];
      }
    }
    layer.ctx.putImageData(region, sx, sy);
    compositeLayers();
  }
  function paintDodgeBurnLine(x1,y1,x2,y2){
    const size = parseInt(dbSizeInput.value,10);
    const dist = Math.hypot(x2-x1,y2-y1);
    const step = Math.max(1, size/4);
    const n = Math.max(1, Math.floor(dist/step));
    for(let i=1;i<=n;i++){
      const t = i/n;
      paintDodgeBurnDab(x1+(x2-x1)*t, y1+(y2-y1)*t);
    }
  }
  // Shares 그리기's strokeUndoStack/strokeRedoStack and header 획 실행취소/다시실행
  // buttons — the two menus are never open at the same time, so one stack
  // serves whichever brush tool is actually active.
  function applyDodgeBurnAction(){
    commitEdit();
    strokeUndoStack = []; strokeRedoStack = [];
    updateDrawHistoryButtons();
    resetDodgeBurnStroke();
  }
  function cancelDodgeBurnAction(){
    cancelEdit();
    strokeUndoStack = []; strokeRedoStack = [];
    updateDrawHistoryButtons();
    resetDodgeBurnStroke();
  }

  // ---------- Pinch to zoom + pan + rotate (two fingers) ----------
  const activePointers = new Map(); // pointerId -> {x,y} in client coords
  let pinchActive = false;
  let pinchStartDist = 0;
  let pinchStartScale = 1;
  let pinchStartAngle = 0;
  let pinchStartRotation = 0;
  let pinchStartMidX = 0, pinchStartMidY = 0;
  let pinchStartPanX = 0, pinchStartPanY = 0;
  let cropModeActive = false; // true while the 크롭 sub-panel is open

  function pointerDistance(){
    const pts = [...activePointers.values()];
    return Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
  }
  function pointerAngle(){
    const pts = [...activePointers.values()];
    return Math.atan2(pts[1].y-pts[0].y, pts[1].x-pts[0].x) * 180/Math.PI;
  }
  function pointerMidpoint(){
    const pts = [...activePointers.values()];
    return [ (pts[0].x+pts[1].x)/2, (pts[0].y+pts[1].y)/2 ];
  }
  // A pinch-to-zoom almost never keeps the two fingers perfectly aligned, so a
  // raw 1:1 angle-to-rotation mapping picks up rotation the user never meant —
  // a small dead zone ignores that incidental angle change entirely. Past the
  // dead zone the user IS deliberately rotating, where a damping factor below
  // 1 asks for more physical finger rotation per degree of actual rotation,
  // for finer control than a direct 1:1 mapping would give.
  const ROTATE_DEADZONE_DEG = 6;
  const ROTATE_SENSITIVITY = 0.4;
  function dampedRotationDelta(rawAngleDelta){
    const mag = Math.abs(rawAngleDelta);
    if(mag <= ROTATE_DEADZONE_DEG) return 0;
    return Math.sign(rawAngleDelta) * (mag-ROTATE_DEADZONE_DEG) * ROTATE_SENSITIVITY;
  }
  function startPinch(){
    endPeek(); // a second finger joining a before/after peek should zoom, not stay peeked
    // A second finger joining mid-stroke means this was a zoom/pan gesture, not
    // a drawing stroke — roll back whatever this stroke had painted so far.
    if(drawingActive && (currentTool==='draw'||currentTool==='db-dodge'||currentTool==='db-burn') && strokeUndoStack.length){
      restoreLayersFrom(strokeUndoStack.pop());
      updateDrawHistoryButtons();
      resetDodgeBurnStroke();
    }
    pinchActive = true;
    pinchStartDist = pointerDistance();
    pinchStartScale = cropModeActive ? imgScale : viewScale;
    pinchStartAngle = pointerAngle();
    pinchStartRotation = cropRotationDeg;
    const [mx,my] = pointerMidpoint();
    pinchStartMidX = mx; pinchStartMidY = my;
    pinchStartPanX = cropModeActive ? imgOffsetX : panOffsetX;
    pinchStartPanY = cropModeActive ? imgOffsetY : panOffsetY;
    // a second finger cancels any in-progress single-finger tool action
    lassoPoints = [];
    drawingActive = false;
    lastDrawPos = null;
    bgPaintingActive = false;
    dragStart = null;
    renderSelectionOverlay();
  }
  function updatePinch(){
    if(!pinchActive || activePointers.size<2 || pinchStartDist<=0) return;
    const scaleFactor = pointerDistance()/pinchStartDist;
    const [mx,my] = pointerMidpoint();
    const dx = mx-pinchStartMidX, dy = my-pinchStartMidY;
    // In crop mode, pinch-zoom/pan move the IMAGE behind the fixed frame instead
    // of the general view — the frame itself must never move or resize from this.
    if(cropModeActive){
      imgScale = clampImgScale(pinchStartScale * scaleFactor);
      imgOffsetX = pinchStartPanX + dx;
      imgOffsetY = pinchStartPanY + dy;
      clampImgOffset();
      sessionDirty = true;
      renderCropFrame();
    } else {
      viewScale = Math.min(MAX_ZOOM, Math.max(MIN_ZOOM, pinchStartScale * scaleFactor));
      userZoomed = true;
      panOffsetX = pinchStartPanX + dx;
      panOffsetY = pinchStartPanY + dy;
      clampPanOffset();
      applyCanvasDisplaySize();
    }
    if(cropModeActive){
      const angleDelta = dampedRotationDelta(pointerAngle()-pinchStartAngle);
      previewRotation(Math.max(-45, Math.min(45, pinchStartRotation+angleDelta)));
      updateRulerUI();
    }
  }

  overlayCanvas.addEventListener('pointerdown', e=>{
    try{ overlayCanvas.setPointerCapture(e.pointerId); }catch(err){}
    activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(activePointers.size>=2){
      // A second finger touching down mid-drag on a 사각형/원 selection is
      // the touch equivalent of holding Shift — it locks the shape's aspect
      // instead of starting a pinch. This is checked purely off pointer
      // state (not viewport width), so it works the same on an iPad
      // rendering the desktop layout as it does on a phone.
      if(shapeSelectPointerId!=null){ renderSelectionOverlay(); return; }
      startPinch();
      return;
    }
    if(currentTool==='none'){
      startPeek();
      return;
    }
    const [x,y] = canvasPos(e);
    if(currentTool==='lasso'){
      lassoPoints = [[x,y]];
    } else if(currentTool==='rect-select' || currentTool==='ellipse-select'){
      shapeSelectPointerId = e.pointerId;
      shapeSelectStart = [x,y];
      shapeSelectCurrent = [x,y];
      renderSelectionOverlay();
    } else if(currentTool==='draw'){
      beginEdit();
      const preStroke = snapshotState();
      drawingActive = true;
      lastDrawPos = [x,y];
      paintDrawDab(x,y);
      strokeUndoStack.push(preStroke);
      strokeRedoStack = [];
      updateDrawHistoryButtons();
    } else if(currentTool==='db-dodge' || currentTool==='db-burn'){
      beginEdit();
      const preStroke = snapshotState();
      drawingActive = true;
      lastDrawPos = [x,y];
      paintDodgeBurnDab(x,y);
      strokeUndoStack.push(preStroke);
      strokeRedoStack = [];
      updateDrawHistoryButtons();
    } else if(currentTool==='eyedrop'){
      sampleEyedropper(x,y);
    } else if(currentTool==='bg-add' || currentTool==='bg-sub'){
      beginEdit();
      bgPaintingActive = true;
      paintBgMask(x,y, currentTool==='bg-sub' ? 'sub' : 'add');
    }
  });
  overlayCanvas.addEventListener('pointermove', e=>{
    if(activePointers.has(e.pointerId)) activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
    if(pinchActive){ updatePinch(); return; }
    if(shapeSelectPointerId!=null){
      // Only the primary finger's own movement updates the shape — an
      // auxiliary aspect-lock finger just needs to be down, not dragged.
      if(e.pointerId===shapeSelectPointerId){
        shapeSelectCurrent = canvasPos(e);
        renderSelectionOverlay();
      } else if(activePointers.size>=2){
        renderSelectionOverlay(); // reflects the lock engaging/disengaging
      }
      return;
    }
    if(activePointers.size>=2) return;
    if(currentTool==='none') return;
    const [x,y] = canvasPos(e);
    if(currentTool==='lasso' && lassoPoints.length){
      lassoPoints.push([x,y]);
      renderSelectionOverlay();
    } else if(drawingActive && currentTool==='draw' && lastDrawPos){
      paintDrawLine(lastDrawPos[0], lastDrawPos[1], x, y);
      lastDrawPos = [x,y];
    } else if(drawingActive && (currentTool==='db-dodge'||currentTool==='db-burn') && lastDrawPos){
      paintDodgeBurnLine(lastDrawPos[0], lastDrawPos[1], x, y);
      lastDrawPos = [x,y];
    } else if(currentTool==='eyedrop' && e.buttons){
      // Live-sample while dragging, same as clicking — lets you drag around
      // the image to preview colors before releasing.
      sampleEyedropper(x,y);
    } else if(bgPaintingActive && (currentTool==='bg-add'||currentTool==='bg-sub')){
      paintBgMask(x,y, currentTool==='bg-sub' ? 'sub' : 'add');
    }
  });
  function releasePointer(e){
    activePointers.delete(e.pointerId);
    if(activePointers.size<2 && pinchActive){
      pinchActive = false;
      return true; // this up-event ended a pinch gesture, not a tool action
    }
    return false;
  }
  overlayCanvas.addEventListener('pointerup', e=>{
    endPeek();
    if(shapeSelectPointerId!=null){
      if(e.pointerId!==shapeSelectPointerId){
        // The auxiliary aspect-lock finger lifted — keep dragging with the
        // primary finger, just fall back to freeform.
        activePointers.delete(e.pointerId);
        renderSelectionOverlay();
        return;
      }
      // Capture the lock state (Shift, or another finger STILL down right
      // now) before removing this pointer, since isShapeAspectLocked()
      // itself checks activePointers.size.
      const locked = isShapeAspectLocked();
      activePointers.delete(e.pointerId);
      const r = computeShapeRect(shapeSelectStart[0], shapeSelectStart[1], shapeSelectCurrent[0], shapeSelectCurrent[1], locked);
      if(r.w>1 && r.h>1){
        beginEdit();
        sessionDirty = true;
        mctx.save();
        mctx.globalCompositeOperation='source-over';
        mctx.fillStyle='white';
        traceShapePath(mctx, currentTool, r);
        mctx.fill();
        mctx.restore();
        hasSelection = true;
        maskVersion++;
        reapplyFeatherIfOn();
      }
      shapeSelectPointerId = null;
      shapeSelectStart = null;
      shapeSelectCurrent = null;
      renderSelectionOverlay();
      return;
    }
    if(releasePointer(e)){ dragStart=null; return; }
    if(currentTool==='lasso' && lassoPoints.length>2){
      beginEdit();
      sessionDirty = true;
      mctx.save();
      mctx.globalCompositeOperation='source-over';
      mctx.fillStyle='white';
      mctx.beginPath();
      mctx.moveTo(lassoPoints[0][0], lassoPoints[0][1]);
      for(let p of lassoPoints) mctx.lineTo(p[0],p[1]);
      mctx.closePath(); mctx.fill();
      mctx.restore();
      hasSelection = true;
      maskVersion++;
      lassoPoints = [];
      reapplyFeatherIfOn();
      renderSelectionOverlay();
    } else if(currentTool==='lasso'){
      lassoPoints=[];
    }
    if(currentTool==='draw'||currentTool==='db-dodge'||currentTool==='db-burn'){
      drawingActive=false;
      lastDrawPos=null;
      resetDodgeBurnStroke();
    }
    if(currentTool==='bg-add'||currentTool==='bg-sub'){
      bgPaintingActive=false;
    }
    dragStart=null;
  });
  overlayCanvas.addEventListener('pointercancel', e=>{
    endPeek();
    drawingActive=false;
    lastDrawPos=null;
    resetDodgeBurnStroke();
    bgPaintingActive=false;
    if(shapeSelectPointerId===e.pointerId){
      shapeSelectPointerId = null;
      shapeSelectStart = null;
      shapeSelectCurrent = null;
      renderSelectionOverlay();
    }
    releasePointer(e);
  });

  // ---------- Resize ----------
  const resizeW = document.getElementById('resizeW'), resizeH = document.getElementById('resizeH');
  const lockAspectToggle = document.getElementById('lockAspectToggle');
  let aspect = 1;
  let lockAspectOn = true;
  lockAspectToggle.addEventListener('change', ()=>{
    lockAspectOn = lockAspectToggle.checked;
  });
  function syncResizeInputs(){
    resizeW.value = mainCanvas.width;
    resizeH.value = mainCanvas.height;
    aspect = mainCanvas.width/mainCanvas.height;
  }
  // Resizing now live-previews (like the other adjustment menus) instead of
  // applying immediately — the header's 적용/취소 commits or discards it. Every
  // call rebuilds all layers fresh from editingSnapshot (never from the result
  // of a previous call), so repeated slider drags don't compound scaling loss.
  function previewResize(w,h){
    beginEdit();
    if(!editingSnapshot) return;
    sessionDirty = true;
    const baseW = editingSnapshot.w, baseH = editingSnapshot.h;
    setCanvasSize(w,h);
    layers = editingSnapshot.layers.map(ls=>{
      const layer = layerShellFromSnapshot(ls, w, h);
      const tmp = document.createElement('canvas');
      tmp.width = baseW; tmp.height = baseH;
      tmp.getContext('2d').putImageData(ls.img, 0, 0);
      layer.ctx.drawImage(tmp, 0,0,baseW,baseH, 0,0,w,h);
      return layer;
    });
    activeLayerId = editingSnapshot.activeLayerId;
    hasSelection=false;
    maskVersion++;
    updateSelectionFloatUI();
    updateDims();
    compositeLayers();
    renderLayerPanel();
  }
  resizeW.addEventListener('input', ()=>{
    const w = Math.max(1, parseInt(resizeW.value||1,10));
    let h;
    if(lockAspectOn){ h = Math.max(1, Math.round(w/aspect)); resizeH.value = h; }
    else h = Math.max(1, parseInt(resizeH.value||1,10));
    previewResize(w,h);
  });
  resizeH.addEventListener('input', ()=>{
    const h = Math.max(1, parseInt(resizeH.value||1,10));
    let w;
    if(lockAspectOn){ w = Math.max(1, Math.round(h*aspect)); resizeW.value = w; }
    else w = Math.max(1, parseInt(resizeW.value||1,10));
    previewResize(w,h);
  });
  function applyResizeAction(){
    commitEdit();
    syncResizeInputs();
  }
  function cancelResizeAction(){
    cancelEdit();
    syncResizeInputs();
  }

  // ---------- Generic live-preview edit machinery ----------
  // sessionDirty tracks whether the CURRENT menu session actually changed
  // anything, so the header's 취소 can skip its confirm prompt when there's
  // nothing to lose (see cancelActiveMenu).
  let sessionDirty = false;
  function beginEdit(){
    if(editingSnapshot) return;
    editingSnapshot = snapshotState();
    sessionDirty = false;
  }
  // Effects/selective color/levels/curve only ever touch the ACTIVE layer's
  // pixels — everything else in the document stays exactly as it was.
  function previewEffect(effectFn){
    if(!editingSnapshot) return;
    // Key off the layer that was active when this session began, not whatever
    // is active right now — the layer panel can still be clicked mid-session.
    const layer = layers.find(l=>l.id===editingSnapshot.activeLayerId);
    if(!layer || layer.locked) return;
    const layerSnap = editingSnapshot.layers.find(l=>l.id===editingSnapshot.activeLayerId);
    if(!layerSnap) return;
    sessionDirty = true;
    const w=editingSnapshot.w, h=editingSnapshot.h;
    const base = new Uint8ClampedArray(layerSnap.img.data);
    const effect = effectFn(new Uint8ClampedArray(base), w, h);
    const out = new ImageData(w,h);
    const alphaAll = hasSelection ? mctx.getImageData(0,0,w,h).data : null;
    for(let i=0;i<base.length;i+=4){
      const a = alphaAll ? alphaAll[i+3]/255 : 1;
      out.data[i]   = base[i]  *(1-a) + effect[i]  *a;
      out.data[i+1] = base[i+1]*(1-a) + effect[i+1]*a;
      out.data[i+2] = base[i+2]*(1-a) + effect[i+2]*a;
      // The effect's own alpha channel matters too — a blur that softens a
      // brush stroke's edge does that by spreading its ALPHA outward, not
      // just its color. Keeping the original alpha here (as before) made the
      // blur invisible at any hard-alpha edge, e.g. a draw layer's stroke
      // against transparency.
      out.data[i+3] = base[i+3]*(1-a) + effect[i+3]*a;
    }
    layer.ctx.putImageData(out,0,0);
    compositeLayers();
  }
  // ---------- Adjustment layers (선택색상/레벨/곡선) ----------
  // Unlike 효과 (which bakes into the active layer in place), these three
  // read from one layer (previewSourceLayerId) and write into another
  // (previewTargetLayerId) — a brand-new layer for a fresh adjustment, or an
  // existing adjustment layer being re-edited. Both null outside such a
  // session. Reading the source's CURRENT pixels fresh every tick (rather
  // than a frozen snapshot) means re-editing never compounds on itself.
  let previewSourceLayerId = null;
  let previewTargetLayerId = null;
  function previewAdjustment(effectFn){
    if(!editingSnapshot || previewTargetLayerId==null) return;
    const target = layers.find(l=>l.id===previewTargetLayerId);
    const source = layers.find(l=>l.id===previewSourceLayerId);
    if(!target || !source || target.locked) return;
    sessionDirty = true;
    const w = mainCanvas.width, h = mainCanvas.height;
    const base = source.ctx.getImageData(0,0,w,h).data;
    const effect = effectFn(new Uint8ClampedArray(base), w, h);
    const out = new ImageData(w,h);
    const alphaAll = hasSelection ? mctx.getImageData(0,0,w,h).data : null;
    for(let i=0;i<base.length;i+=4){
      const a = alphaAll ? alphaAll[i+3]/255 : 1;
      out.data[i]   = base[i]  *(1-a) + effect[i]  *a;
      out.data[i+1] = base[i+1]*(1-a) + effect[i+1]*a;
      out.data[i+2] = base[i+2]*(1-a) + effect[i+2]*a;
      out.data[i+3] = base[i+3]*(1-a) + effect[i+3]*a;
    }
    target.ctx.putImageData(out,0,0);
    // Re-editing a layer that ISN'T topmost (e.g. going back to tweak the
    // first of two 선택색상 layers while a 레벨 sits above it) would otherwise
    // leave that 레벨 showing its old, frozen bake — it was never told this
    // layer's pixels just changed. Cascade the same rebuild eye-toggling uses
    // so every whole-layer adjustment above this one reflects it live too.
    rebuildDependentAdjustmentLayers(layers.indexOf(target));
    compositeLayers();
  }
  function nextAdjustmentLayerName(baseName, type){
    const count = layers.filter(l=>l.adjustmentType===type).length;
    return count===0 ? baseName : (baseName+' '+(count+1));
  }
  // Snapshots the CURRENT selection (if any) as a small, fixed-size black+alpha
  // canvas for the layer panel thumbnail — captured once at adjustment-layer
  // creation time so it stays accurate for that layer's whole lifetime
  // regardless of the selection being changed or cleared afterward, and so it
  // never needs to be resized when the image itself is later cropped/resized.
  // Returns null when there's no selection (the adjustment applies to the
  // whole layer), which the thumbnail renders as solid black.
  function captureAdjustmentMaskThumb(){
    if(!hasSelection) return null;
    const w = maskCanvas.width, h = maskCanvas.height;
    if(!w || !h) return null;
    const THUMB = 40;
    const src = mctx.getImageData(0,0,w,h).data;
    const blackAlpha = new ImageData(w,h);
    for(let i=0;i<src.length;i+=4) blackAlpha.data[i+3] = src[i+3];
    const full = document.createElement('canvas');
    full.width = w; full.height = h;
    full.getContext('2d').putImageData(blackAlpha,0,0);
    const thumb = document.createElement('canvas');
    thumb.width = THUMB; thumb.height = THUMB;
    thumb.getContext('2d').drawImage(full, 0, 0, THUMB, THUMB);
    return thumb;
  }
  // Called from onMenuOpen for group-sc/levels/curve. If the layer that was
  // already active IS a matching adjustment layer (the user selected it from
  // the panel to re-edit it), reuse it and return its stored params for the
  // caller to load into the UI. Otherwise create a brand-new layer right now
  // and leave activeLayerId untouched (so the active layer never changes just
  // from applying an adjustment).
  function beginAdjustmentSession(type, baseName){
    const active = activeLayer();
    if(!active) return null;
    if(active.adjustmentType===type){
      previewTargetLayerId = active.id;
      previewSourceLayerId = active.adjustmentSourceLayerId;
      return active.adjustmentParams;
    }
    // Since applying an adjustment never changes the active layer, the active
    // layer stays the untouched original image through an entire chain of
    // adjustments (선택색상 → 레벨 → 곡선 ...) unless there's some other,
    // separately user-added layer to actually keep it pointed at. Sourcing
    // every new adjustment from "the active layer" in that all-original case
    // would keep inserting each one right above the original instead of on
    // top of the previous adjustment — so when the original image is the
    // only non-adjustment layer in the stack, source from (and insert above)
    // the topmost layer instead, continuing the existing chain.
    const onlyOriginalLayer = layers.filter(l=>!l.adjustmentType).length===1;
    const source = onlyOriginalLayer ? layers[layers.length-1] : active;
    const newLayer = createLayer(nextAdjustmentLayerName(baseName, type), mainCanvas.width, mainCanvas.height);
    newLayer.ctx.drawImage(source.canvas, 0, 0);
    newLayer.adjustmentType = type;
    newLayer.adjustmentSourceLayerId = source.id;
    newLayer.adjustmentMaskThumb = captureAdjustmentMaskThumb();
    const idx = layers.indexOf(source);
    layers.splice(idx+1, 0, newLayer);
    // The source layer stays visible — since the new layer is a full
    // replacement of its pixels, this never changes what's actually shown
    // (the new layer fully covers it), but it keeps every layer's eye icon
    // correctly reflecting "on" and lets rebuildDependentAdjustmentLayers()
    // correctly reveal it if a layer above is later turned off.
    previewSourceLayerId = source.id;
    previewTargetLayerId = newLayer.id;
    compositeLayers();
    renderLayerPanel();
    return null;
  }
  function endAdjustmentSession(){
    previewSourceLayerId = null;
    previewTargetLayerId = null;
  }
  const ADJUSTMENT_MENU_ID = {sc:'group-sc', levels:'group-levels', curve:'group-curve'};
  const ADJUSTMENT_MENU_IDS = new Set(Object.values(ADJUSTMENT_MENU_ID));
  // Clicking an adjustment layer in the panel re-opens the menu that created
  // it (already pre-filled with its stored params via beginAdjustmentSession)
  // — mirrors whichever entry path the current layout actually uses (desktop
  // accordion vs mobile tab bar) so the UI ends up in the same state either
  // way would have left it.
  function openMenuFromLayerRow(id){
    const targetEl = document.getElementById(id);
    if(!targetEl || id===activeMenuId) return;
    if(activeMenuId) applyActiveMenu();
    if(isDesktopLayout()){
      document.querySelectorAll('#sideGroups > .group').forEach(g=> g.classList.add('collapsed'));
      targetEl.classList.remove('collapsed');
    } else {
      if(mobileTabBar){
        mobileTabBar.querySelectorAll('.tab-btn.active').forEach(b=>b.classList.remove('active'));
        const btn = mobileTabBar.querySelector('.tab-btn[data-target="'+id+'"]');
        if(btn) btn.classList.add('active');
      }
      sideGroups.querySelectorAll(':scope > .mobile-active').forEach(el=>el.classList.remove('mobile-active'));
      targetEl.classList.add('mobile-active');
      targetEl.classList.remove('collapsed');
    }
    enterMenu(id);
  }
  // Press-and-hold on the image (효과/선택색상/레벨/곡선 only, once something's
  // actually changed) shows the image as it was before this menu's edits, so
  // the user can compare before/after; releasing restores the live preview.
  const PEEK_MENUS = new Set(['group-effects','group-sc','group-levels','group-curve']);
  let isPeeking = false;
  let peekAfterImage = null;
  let peekPrevTargetVisible = true, peekPrevSourceVisible = true;
  function canPeek(){
    return currentTool==='none' && PEEK_MENUS.has(activeMenuId) && !!editingSnapshot && sessionDirty;
  }
  function startPeek(){
    if(isPeeking || !canPeek()) return;
    if(previewTargetLayerId!=null){
      // Adjustment-layer session: "before" is simply the source layer, so
      // peek just swaps which of the pair is visible — remembering each
      // one's actual prior state (rather than assuming target-on/source-off)
      // so releasing restores exactly what was showing before the peek.
      const target = layers.find(l=>l.id===previewTargetLayerId);
      const source = layers.find(l=>l.id===previewSourceLayerId);
      if(!target || !source) return;
      isPeeking = true;
      peekPrevTargetVisible = target.visible;
      peekPrevSourceVisible = source.visible;
      target.visible = false; source.visible = true;
      // Swapping visibility alone only changes what's on screen if target is
      // the topmost layer — any 선택색상/레벨/곡선 layer stacked above it is
      // its own opaque, separately-baked canvas that still shows the old
      // "after" pixels regardless, fully masking the comparison. Re-baking
      // those dependents now (same call previewAdjustment() makes on every
      // live edit) makes the peek visible through them too.
      rebuildDependentAdjustmentLayers(layers.indexOf(target));
      compositeLayers();
      return;
    }
    const layer = layers.find(l=>l.id===editingSnapshot.activeLayerId);
    const layerSnap = editingSnapshot.layers.find(l=>l.id===editingSnapshot.activeLayerId);
    if(!layer || !layerSnap) return;
    isPeeking = true;
    peekAfterImage = layer.ctx.getImageData(0,0,mainCanvas.width,mainCanvas.height);
    layer.ctx.putImageData(layerSnap.img,0,0);
    // Same reasoning as above: an adjustment layer stacked above the one
    // being edited via 효과 needs its bake refreshed too, or it'll keep
    // showing the "after" pixels straight through the peek.
    rebuildDependentAdjustmentLayers(layers.indexOf(layer));
    compositeLayers();
  }
  function endPeek(){
    if(!isPeeking) return;
    isPeeking = false;
    if(previewTargetLayerId!=null){
      const target = layers.find(l=>l.id===previewTargetLayerId);
      const source = layers.find(l=>l.id===previewSourceLayerId);
      if(target) target.visible = peekPrevTargetVisible;
      if(source) source.visible = peekPrevSourceVisible;
      if(target) rebuildDependentAdjustmentLayers(layers.indexOf(target));
      compositeLayers();
      return;
    }
    const layer = editingSnapshot && layers.find(l=>l.id===editingSnapshot.activeLayerId);
    if(layer && peekAfterImage) layer.ctx.putImageData(peekAfterImage,0,0);
    peekAfterImage = null;
    if(layer) rebuildDependentAdjustmentLayers(layers.indexOf(layer));
    compositeLayers();
  }
  function commitEdit(){
    if(!editingSnapshot) return;
    pushUndo(editingSnapshot);
    editingSnapshot = null;
    sessionDirty = false;
  }
  function cancelEdit(){
    if(!editingSnapshot) return;
    restoreState(editingSnapshot);
    editingSnapshot = null;
    sessionDirty = false;
  }

  // ---------- Crop frame (fixed & centered; image pans/zooms behind it) ----------
  // The frame's size/position is defined purely in the crop viewport's own CSS-px
  // space and is ALWAYS centered — it never moves. Panning (one finger) and
  // pinch-zooming (two fingers) instead move/scale the IMAGE (mainCanvas) behind
  // the fixed frame; only ratio buttons and handle drags change the frame's size.
  const cropFrame = document.getElementById('cropFrame');
  const cropFrameRect = document.getElementById('cropFrameRect');
  const circleCropRow = document.getElementById('circleCropRow');
  const circleCropToggle = document.getElementById('circleCropToggle');
  const circleCropMask = document.getElementById('circleCropMask');
  const circleCropMaskCtx = circleCropMask.getContext('2d');
  const rotateRuler = document.getElementById('rotateRuler');
  const rotateRulerTrack = document.getElementById('rotateRulerTrack');
  const rotateValueEl = document.getElementById('rotateValue');
  const cropAutoZoomToggle = document.getElementById('cropAutoZoomToggle');
  const MIN_CROP = 20;
  const PX_PER_DEG = 6;
  let cropRatio = null;      // null = free, else numeric width/height
  let cropAutoZoom = true;  // when on, every handle-resize re-fits the selection to fill the viewport
  let cropRotationDeg = 0;
  let cropViewportW = 0, cropViewportH = 0; // fixed crop-mode viewport size, CSS px
  let frameW = 0, frameH = 0;               // crop frame size, CSS px (always centered)
  let imgScale = 1;                          // crop-mode image zoom, CSS px per canvas px
  let imgOffsetX = 0, imgOffsetY = 0;        // image-center pan offset from viewport center, CSS px

  function defaultFrameSize(R){
    const vw = cropViewportW, vh = cropViewportH;
    // Free mode (R==null) has no ratio lock of its own, but its DEFAULT frame
    // must still match the image's own aspect ratio so the initial crop region
    // covers the whole photo (no pixels truncated) — only the fill margin
    // differs from a purely cosmetic scale, not from any actual cropping.
    const effR = (R==null) ? (mainCanvas.width / mainCanvas.height) : R;
    let w = vw*0.85, h = w/effR;
    if(h > vh*0.85){ h = vh*0.85; w = h*effR; }
    return { w: Math.max(MIN_CROP, w), h: Math.max(MIN_CROP, h) };
  }

  // The image must always fully cover the frame so a crop always has real pixel
  // data behind every corner — this is the minimum zoom allowed.
  function minImgScale(){
    if(!frameW || !frameH || !mainCanvas.width || !mainCanvas.height) return 1;
    return Math.max(frameW/mainCanvas.width, frameH/mainCanvas.height);
  }
  function clampImgScale(s){
    return Math.max(minImgScale(), Math.min(MAX_ZOOM, s));
  }
  function clampImgOffset(){
    const dispW = mainCanvas.width*imgScale, dispH = mainCanvas.height*imgScale;
    const maxX = Math.max(0, (dispW-frameW)/2), maxY = Math.max(0, (dispH-frameH)/2);
    imgOffsetX = Math.max(-maxX, Math.min(maxX, imgOffsetX));
    imgOffsetY = Math.max(-maxY, Math.min(maxY, imgOffsetY));
  }
  // Resets the frame to a fresh centered default and the image to "fit the frame
  // exactly, no pan" — used whenever a crop session starts over (menu opened,
  // ratio changed, or the previous session applied/cancelled).
  function resetCropView(){
    const sz = defaultFrameSize(cropRatio);
    frameW = sz.w; frameH = sz.h;
    imgScale = minImgScale();
    imgOffsetX = 0; imgOffsetY = 0;
  }

  function updateCropSizeReadout(){
    if(!cropModeActive) return;
    const w = Math.max(1, Math.round(frameW/imgScale));
    const h = Math.max(1, Math.round(frameH/imgScale));
    headerCropSize.textContent = w + ' × ' + h + ' px';
  }

  // Purely a visual preview of what a circular crop would look like — only
  // offered for the 1:1 ratio, and never affects the actual crop pixels
  // applyCropAction() produces (still a plain square). Paints black over the
  // square frame everywhere except an inscribed circle, using
  // destination-out to punch the circle out as a transparent hole so the
  // dark app background shows through it (reads as "cut away").
  function renderCircleCropMask(){
    if(!circleCropToggle.checked || cropRatio!==1){
      circleCropMask.hidden = true;
      circleCropMaskCtx.clearRect(0,0,circleCropMask.width,circleCropMask.height);
      return;
    }
    const w = Math.max(1, Math.round(frameW)), h = Math.max(1, Math.round(frameH));
    circleCropMask.width = w; circleCropMask.height = h;
    circleCropMaskCtx.clearRect(0,0,w,h);
    circleCropMaskCtx.globalCompositeOperation = 'source-over';
    circleCropMaskCtx.fillStyle = '#000';
    circleCropMaskCtx.fillRect(0,0,w,h);
    circleCropMaskCtx.globalCompositeOperation = 'destination-out';
    circleCropMaskCtx.beginPath();
    circleCropMaskCtx.arc(w/2, h/2, Math.min(w,h)/2, 0, Math.PI*2);
    circleCropMaskCtx.fill();
    circleCropMaskCtx.globalCompositeOperation = 'source-over';
    circleCropMask.hidden = false;
  }
  function updateCircleCropRowVisibility(){
    const isSquare = cropRatio===1;
    circleCropRow.hidden = !isSquare;
    if(!isSquare) circleCropToggle.checked = false;
    renderCircleCropMask();
  }
  circleCropToggle.addEventListener('change', renderCircleCropMask);

  function renderCropFrame(){
    if(!cropModeActive) return;
    cropFrameRect.style.left = ((cropViewportW-frameW)/2)+'px';
    cropFrameRect.style.top = ((cropViewportH-frameH)/2)+'px';
    cropFrameRect.style.width = frameW+'px';
    cropFrameRect.style.height = frameH+'px';
    const dispW = mainCanvas.width*imgScale, dispH = mainCanvas.height*imgScale;
    mainCanvas.style.left = (cropViewportW/2 + imgOffsetX - dispW/2)+'px';
    mainCanvas.style.top = (cropViewportH/2 + imgOffsetY - dispH/2)+'px';
    mainCanvas.style.width = dispW+'px';
    mainCanvas.style.height = dispH+'px';
    updateCropSizeReadout();
    renderCircleCropMask();
  }

  function showCropFrame(){
    beginEdit();
    cropModeActive = true;
    const avail = stageAvailSize();
    cropViewportW = avail.w; cropViewportH = avail.h;
    canvasHolder.classList.add('crop-mode');
    canvasHolder.style.width = cropViewportW+'px';
    canvasHolder.style.height = cropViewportH+'px';
    // Crop mode positions mainCanvas via left/top, not the general pan's
    // transform — clear any leftover transform so the two don't stack.
    mainCanvas.style.transform = '';
    overlayCanvas.style.transform = '';
    overlayCanvas.style.display = 'none';
    if(isDesktopLayout() && mainCanvas.width && mainCanvas.height){
      // Desktop: start the crop frame at whatever scale the user was already
      // viewing (covering the whole image) instead of a freshly computed fit —
      // opening 크롭 must never look like a sudden zoom. Only an actual
      // adjustment (ratio button, handle drag, manual zoom) changes it from here.
      const carryScale = Math.min(viewScale, computeFitScale());
      frameW = mainCanvas.width * carryScale;
      frameH = mainCanvas.height * carryScale;
      imgScale = carryScale;
      imgOffsetX = 0; imgOffsetY = 0;
    } else {
      resetCropView();
    }
    cropAutoZoom = true;
    cropAutoZoomToggle.checked = true;
    circleCropToggle.checked = false;
    updateCircleCropRowVisibility();
    cropFrame.hidden = false;
    renderCropFrame();
    updateSelectionFloatUI();
  }
  // Committing/discarding the pending edit is handled by applyCropAction/
  // cancelCropAction (via the header's 적용/취소) before this ever runs, so
  // hiding the frame here is purely visual.
  function hideCropFrame(){
    cropFrame.hidden = true;
    cropModeActive = false;
    canvasHolder.classList.remove('crop-mode');
    canvasHolder.style.width = '';
    canvasHolder.style.height = '';
    mainCanvas.style.left = '';
    mainCanvas.style.top = '';
    overlayCanvas.style.display = '';
    fitToScreen();
    updateSelectionFloatUI();
  }
  // Adapts the CURRENT crop rectangle to a newly-picked ratio instead of
  // discarding it — trims whichever dimension is now too big for the new
  // ratio evenly off both sides (e.g. a free-form 10x20 selection becomes
  // 10x10 for a 1:1 ratio, 5px off the top and 5px off the bottom), so
  // switching ratios keeps as much of what the user already framed as
  // possible instead of resetting to a brand new default region.
  function adaptFrameToRatio(R){
    if(R==null || !frameW || !frameH) return; // free ratio: no forced shape to adapt to
    const curR = frameW/frameH;
    let w = frameW, h = frameH;
    if(curR > R) w = h*R; else if(curR < R) h = w/R;
    frameW = Math.max(MIN_CROP, w); frameH = Math.max(MIN_CROP, h);
    clampImgOffset();
  }
  document.querySelectorAll('#group-crop .ratio-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#group-crop .ratio-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const rv = btn.dataset.ratio;
      cropRatio = rv==='free' ? null : rv==='original' ? (mainCanvas.width/mainCanvas.height) : (()=>{ const [a,b]=rv.split(':').map(Number); return a/b; })();
      adaptFrameToRatio(cropRatio);
      if(cropAutoZoom) zoomToFitFrame();
      updateCircleCropRowVisibility();
      sessionDirty = true;
      renderCropFrame();
    });
  });
  cropAutoZoomToggle.addEventListener('change', ()=>{
    cropAutoZoom = cropAutoZoomToggle.checked;
  });

  // ---------- 프로필 사진 자동화: forced square crop + auto pipeline ----------
  let forcedCropActive = false;
  // Opens 크롭 already locked to 정사각형 with no other ratio, no 취소, and no
  // switching to another menu (see the body.forced-crop rules) — 적용 is the
  // only way out, and it can only ever produce a square result.
  function startForcedSquareCrop(){
    forcedCropActive = true;
    document.body.classList.add('forced-crop');
    enterMenu('group-crop');
    const squareBtn = document.querySelector('#group-crop .ratio-btn[data-ratio="1:1"]');
    if(squareBtn) squareBtn.click();
    circleCropToggle.checked = true;
    renderCircleCropMask();
  }
  function endForcedCropLock(){
    forcedCropActive = false;
    document.body.classList.remove('forced-crop');
  }
  // Applies the 프로필 사진 자동화 pipeline to whatever was just square-cropped:
  // resize, then blur/noise baked into the layer, then 선택색상/레벨/곡선 as
  // chained adjustment layers (배경-선택색상-레벨-곡선), ending with the layer
  // panel open so that stack is immediately visible. Each step reuses the
  // exact same begin/preview/apply functions the real menus use, just driven
  // directly instead of through UI interaction. Every value comes from
  // currentAutomationSettings() — the logged-in user's own saved settings
  // (자동화 모드 설정 modal), or AUTOMATION_DEFAULTS when nothing's saved yet.
  function runProfileAutomationPipeline(){
    const s = currentAutomationSettings();
    previewResize(s.resize, s.resize);
    commitEdit();

    currentEffectName = 'blur';
    blurRange.value = s.blur;
    document.getElementById('blurVal').textContent = s.blur;
    runEffectsPreview();
    applyEffectsAction();

    currentEffectName = 'noise';
    noiseRange.value = s.noise;
    document.getElementById('noiseVal').textContent = s.noise;
    runEffectsPreview();
    applyEffectsAction();

    beginEdit();
    beginAdjustmentSession('sc', '선택색상');
    resetSCValues();
    scValues[s.scRange] = {c:s.scC, m:s.scM, y:s.scY, k:s.scK};
    scCurrentRange = s.scRange;
    scRangeSelect.value = s.scRange;
    syncSCInputs();
    runSCPreview();
    applySCAction();
    endAdjustmentSession();

    beginEdit();
    beginAdjustmentSession('levels', '레벨');
    lvInB.value = s.lvInB; lvInW.value = s.lvInW; lvGamma.value = s.lvGamma;
    lvOutB.value = s.lvOutB; lvOutW.value = s.lvOutW;
    computeLevelsHistogram();
    drawLevelsInputCanvas();
    drawLevelsOutputCanvas();
    runLevelsPreview();
    applyLevelsAction();
    endAdjustmentSession();

    beginEdit();
    beginAdjustmentSession('curve', '곡선');
    curvePoints = JSON.parse(JSON.stringify(s.curvePoints));
    runCurvePreview();
    applyCurveAction();
    endAdjustmentSession();

    pushUndo(snapshotState());
    const lipsLayer = createLayer('입술', mainCanvas.width, mainCanvas.height);
    lipsLayer.blendMode = s.lipsBlendMode;
    lipsLayer.opacity = s.lipsOpacity/100;
    layers.push(lipsLayer);
    activeLayerId = lipsLayer.id;
    compositeLayers();
    renderLayerPanel();

    if(layerPanel.classList.contains('collapsed')) toggleLayerPanel();
  }

  // A single-finger drag resizes a handle (frame stays centered, growing/shrinking
  // symmetrically about its own center) or, anywhere else on the crop-frame
  // backdrop, pans the image. A second finger landing anywhere hands off to the
  // shared two-finger pinch/rotate gesture — sharing the same activePointers/
  // pinchActive state overlayCanvas uses, so a gesture can start with one or both
  // fingers on a handle or inside the crop area.
  //
  // Listeners are attached once (persistent), not per-drag, because real
  // multi-touch can land both fingers on the very same element: pointer capture
  // and pointerup are per-pointerId, so a dynamically-added/removed listener pair
  // gets torn down by whichever finger's pointerup happens to fire first — even
  // if that isn't the finger that started the single-pointer drag. A `primaryId`
  // closure variable instead tracks which pointer (if any) owns the current
  // single-pointer action, mirroring how overlayCanvas's own tool handlers work.
  function attachGestureAwareDrag(el, {start, move, end}){
    let primaryId = null;
    let ctx = null;
    el.addEventListener('pointerdown', e=>{
