  function cancelEdit(){
    if(!editingSnapshot) return;
    restoreState(editingSnapshot);
    editingSnapshot = null;
    sessionDirty = false;
  }

  // ---------- Crop frame (fixed & centered; image pans/zooms behind it) ----------
  // The frame's size/position is defined purely in the crop viewport's own CSS-px
  // space and is ALWAYS centered — it never moves. Panning (one finger) and
  // pinch-zooming (two fingers) instead move/scale the IMAGE (mainCanvas) behind
  // the fixed frame; only ratio buttons and handle drags change the frame's size.
  const cropFrame = document.getElementById('cropFrame');
  const cropFrameRect = document.getElementById('cropFrameRect');
  const circleCropRow = document.getElementById('circleCropRow');
  const circleCropToggle = document.getElementById('circleCropToggle');
  const circleCropMask = document.getElementById('circleCropMask');
  const circleCropMaskCtx = circleCropMask.getContext('2d');
  const rotateRuler = document.getElementById('rotateRuler');
  const rotateRulerTrack = document.getElementById('rotateRulerTrack');
  const rotateValueEl = document.getElementById('rotateValue');
  const cropAutoZoomToggle = document.getElementById('cropAutoZoomToggle');
  const MIN_CROP = 20;
  const PX_PER_DEG = 6;
  let cropRatio = null;      // null = free, else numeric width/height
  let cropAutoZoom = true;  // when on, every handle-resize re-fits the selection to fill the viewport
  let cropRotationDeg = 0;
  let cropViewportW = 0, cropViewportH = 0; // fixed crop-mode viewport size, CSS px
  let frameW = 0, frameH = 0;               // crop frame size, CSS px (always centered)
  let imgScale = 1;                          // crop-mode image zoom, CSS px per canvas px
  let imgOffsetX = 0, imgOffsetY = 0;        // image-center pan offset from viewport center, CSS px

  function defaultFrameSize(R){
    const vw = cropViewportW, vh = cropViewportH;
    // Free mode (R==null) has no ratio lock of its own, but its DEFAULT frame
    // must still match the image's own aspect ratio so the initial crop region
    // covers the whole photo (no pixels truncated) — only the fill margin
    // differs from a purely cosmetic scale, not from any actual cropping.
    const effR = (R==null) ? (mainCanvas.width / mainCanvas.height) : R;
    let w = vw*0.85, h = w/effR;
    if(h > vh*0.85){ h = vh*0.85; w = h*effR; }
    return { w: Math.max(MIN_CROP, w), h: Math.max(MIN_CROP, h) };
  }

  // The image must always fully cover the frame so a crop always has real pixel
  // data behind every corner — this is the minimum zoom allowed.
  function minImgScale(){
    if(!frameW || !frameH || !mainCanvas.width || !mainCanvas.height) return 1;
    return Math.max(frameW/mainCanvas.width, frameH/mainCanvas.height);
  }
  function clampImgScale(s){
    return Math.max(minImgScale(), Math.min(MAX_ZOOM, s));
  }
  function clampImgOffset(){
    const dispW = mainCanvas.width*imgScale, dispH = mainCanvas.height*imgScale;
    const maxX = Math.max(0, (dispW-frameW)/2), maxY = Math.max(0, (dispH-frameH)/2);
    imgOffsetX = Math.max(-maxX, Math.min(maxX, imgOffsetX));
    imgOffsetY = Math.max(-maxY, Math.min(maxY, imgOffsetY));
  }
  // Resets the frame to a fresh centered default and the image to "fit the frame
  // exactly, no pan" — used whenever a crop session starts over (menu opened,
  // ratio changed, or the previous session applied/cancelled).
  function resetCropView(){
    const sz = defaultFrameSize(cropRatio);
    frameW = sz.w; frameH = sz.h;
    imgScale = minImgScale();
    imgOffsetX = 0; imgOffsetY = 0;
  }

  function updateCropSizeReadout(){
    if(!cropModeActive) return;
    const w = Math.max(1, Math.round(frameW/imgScale));
    const h = Math.max(1, Math.round(frameH/imgScale));
    headerCropSize.textContent = w + ' × ' + h + ' px';
  }

  // Purely a visual preview of what a circular crop would look like — only
  // offered for the 1:1 ratio, and never affects the actual crop pixels
  // applyCropAction() produces (still a plain square). Paints black over the
  // square frame everywhere except an inscribed circle, using
  // destination-out to punch the circle out as a transparent hole so the
  // dark app background shows through it (reads as "cut away").
  function renderCircleCropMask(){
    if(!circleCropToggle.checked || cropRatio!==1){
      circleCropMask.hidden = true;
      circleCropMaskCtx.clearRect(0,0,circleCropMask.width,circleCropMask.height);
      return;
    }
    const w = Math.max(1, Math.round(frameW)), h = Math.max(1, Math.round(frameH));
    circleCropMask.width = w; circleCropMask.height = h;
    circleCropMaskCtx.clearRect(0,0,w,h);
    circleCropMaskCtx.globalCompositeOperation = 'source-over';
    circleCropMaskCtx.fillStyle = '#000';
    circleCropMaskCtx.fillRect(0,0,w,h);
    circleCropMaskCtx.globalCompositeOperation = 'destination-out';
    circleCropMaskCtx.beginPath();
    circleCropMaskCtx.arc(w/2, h/2, Math.min(w,h)/2, 0, Math.PI*2);
    circleCropMaskCtx.fill();
    circleCropMaskCtx.globalCompositeOperation = 'source-over';
    circleCropMask.hidden = false;
  }
  function updateCircleCropRowVisibility(){
    const isSquare = cropRatio===1;
    circleCropRow.hidden = !isSquare;
    if(!isSquare) circleCropToggle.checked = false;
    renderCircleCropMask();
  }
  circleCropToggle.addEventListener('change', renderCircleCropMask);

  function renderCropFrame(){
    if(!cropModeActive) return;
    cropFrameRect.style.left = ((cropViewportW-frameW)/2)+'px';
    cropFrameRect.style.top = ((cropViewportH-frameH)/2)+'px';
    cropFrameRect.style.width = frameW+'px';
    cropFrameRect.style.height = frameH+'px';
    const dispW = mainCanvas.width*imgScale, dispH = mainCanvas.height*imgScale;
    mainCanvas.style.left = (cropViewportW/2 + imgOffsetX - dispW/2)+'px';
    mainCanvas.style.top = (cropViewportH/2 + imgOffsetY - dispH/2)+'px';
    mainCanvas.style.width = dispW+'px';
    mainCanvas.style.height = dispH+'px';
    updateCropSizeReadout();
    renderCircleCropMask();
  }

  function showCropFrame(){
    beginEdit();
    cropModeActive = true;
    const avail = stageAvailSize();
    cropViewportW = avail.w; cropViewportH = avail.h;
    canvasHolder.classList.add('crop-mode');
    canvasHolder.style.width = cropViewportW+'px';
    canvasHolder.style.height = cropViewportH+'px';
    // Crop mode positions mainCanvas via left/top, not the general pan's
    // transform — clear any leftover transform so the two don't stack.
    mainCanvas.style.transform = '';
    overlayCanvas.style.transform = '';
    overlayCanvas.style.display = 'none';
    if(isDesktopLayout() && mainCanvas.width && mainCanvas.height){
      // Desktop: start the crop frame at whatever scale the user was already
      // viewing (covering the whole image) instead of a freshly computed fit —
      // opening 크롭 must never look like a sudden zoom. Only an actual
      // adjustment (ratio button, handle drag, manual zoom) changes it from here.
      const carryScale = Math.min(viewScale, computeFitScale());
      frameW = mainCanvas.width * carryScale;
      frameH = mainCanvas.height * carryScale;
      imgScale = carryScale;
      imgOffsetX = 0; imgOffsetY = 0;
    } else {
      resetCropView();
    }
    cropAutoZoom = true;
    cropAutoZoomToggle.checked = true;
    circleCropToggle.checked = false;
    updateCircleCropRowVisibility();
    cropFrame.hidden = false;
    renderCropFrame();
  }
  // Committing/discarding the pending edit is handled by applyCropAction/
  // cancelCropAction (via the header's 적용/취소) before this ever runs, so
  // hiding the frame here is purely visual.
  function hideCropFrame(){
    cropFrame.hidden = true;
    cropModeActive = false;
    canvasHolder.classList.remove('crop-mode');
    canvasHolder.style.width = '';
    canvasHolder.style.height = '';
    mainCanvas.style.left = '';
    mainCanvas.style.top = '';
    overlayCanvas.style.display = '';
    fitToScreen();
  }
  // Adapts the CURRENT crop rectangle to a newly-picked ratio instead of
  // discarding it — trims whichever dimension is now too big for the new
  // ratio evenly off both sides (e.g. a free-form 10x20 selection becomes
  // 10x10 for a 1:1 ratio, 5px off the top and 5px off the bottom), so
  // switching ratios keeps as much of what the user already framed as
  // possible instead of resetting to a brand new default region.
  function adaptFrameToRatio(R){
    if(R==null || !frameW || !frameH) return; // free ratio: no forced shape to adapt to
    const curR = frameW/frameH;
    let w = frameW, h = frameH;
    if(curR > R) w = h*R; else if(curR < R) h = w/R;
    frameW = Math.max(MIN_CROP, w); frameH = Math.max(MIN_CROP, h);
    clampImgOffset();
  }
  document.querySelectorAll('#group-crop .ratio-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.querySelectorAll('#group-crop .ratio-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      const rv = btn.dataset.ratio;
      cropRatio = rv==='free' ? null : rv==='original' ? (mainCanvas.width/mainCanvas.height) : (()=>{ const [a,b]=rv.split(':').map(Number); return a/b; })();
      adaptFrameToRatio(cropRatio);
      if(cropAutoZoom) zoomToFitFrame();
      updateCircleCropRowVisibility();
      sessionDirty = true;
      renderCropFrame();
    });
  });
  cropAutoZoomToggle.addEventListener('change', ()=>{
    cropAutoZoom = cropAutoZoomToggle.checked;
  });

  // ---------- 프로필 사진 자동화: forced square crop + auto pipeline ----------
  let forcedCropActive = false;
  // Opens 크롭 already locked to 정사각형 with no other ratio, no 취소, and no
  // switching to another menu (see the body.forced-crop rules) — 적용 is the
  // only way out, and it can only ever produce a square result.
  function startForcedSquareCrop(){
    forcedCropActive = true;
    document.body.classList.add('forced-crop');
    enterMenu('group-crop');
    const squareBtn = document.querySelector('#group-crop .ratio-btn[data-ratio="1:1"]');
    if(squareBtn) squareBtn.click();
    circleCropToggle.checked = true;
    renderCircleCropMask();
  }
  function endForcedCropLock(){
    forcedCropActive = false;
    document.body.classList.remove('forced-crop');
  }
  // Applies the fixed 프로필 사진 자동화 pipeline to whatever was just square-
  // cropped: resize, then blur/noise baked into the layer, then 선택색상/
  // 레벨/곡선 as chained adjustment layers (배경-선택색상-레벨-곡선), ending
  // with the layer panel open so that stack is immediately visible. Each step
  // reuses the exact same begin/preview/apply functions the real menus use,
  // just driven directly instead of through UI interaction.
  function runProfileAutomationPipeline(){
    previewResize(700,700);
    commitEdit();

    currentEffectName = 'blur';
    blurRange.value = 2;
    document.getElementById('blurVal').textContent = '2';
    runEffectsPreview();
    applyEffectsAction();

    currentEffectName = 'noise';
    noiseRange.value = 12;
    document.getElementById('noiseVal').textContent = '12';
    runEffectsPreview();
    applyEffectsAction();

    beginEdit();
    beginAdjustmentSession('sc', '선택색상');
    resetSCValues();
    scValues.black.k = 100;
    scCurrentRange = 'black';
    scRangeSelect.value = 'black';
    syncSCInputs();
    runSCPreview();
    applySCAction();
    endAdjustmentSession();

    beginEdit();
    beginAdjustmentSession('levels', '레벨');
    lvInB.value = 20; lvInW.value = 255; lvGamma.value = 130; lvOutB.value = 0; lvOutW.value = 255;
    document.getElementById('lvInBVal').textContent = '20';
    document.getElementById('lvInWVal').textContent = '255';
    document.getElementById('lvGammaVal').textContent = '1.30';
    document.getElementById('lvOutBVal').textContent = '0';
    document.getElementById('lvOutWVal').textContent = '255';
    runLevelsPreview();
    applyLevelsAction();
    endAdjustmentSession();

    beginEdit();
    beginAdjustmentSession('curve', '곡선');
    curvePoints = [[0,0],[65,79],[177,194],[255,255]];
    runCurvePreview();
    applyCurveAction();
    endAdjustmentSession();

    if(layerPanel.classList.contains('collapsed')) toggleLayerPanel();
  }

  // A single-finger drag resizes a handle (frame stays centered, growing/shrinking
  // symmetrically about its own center) or, anywhere else on the crop-frame
  // backdrop, pans the image. A second finger landing anywhere hands off to the
  // shared two-finger pinch/rotate gesture — sharing the same activePointers/
  // pinchActive state overlayCanvas uses, so a gesture can start with one or both
  // fingers on a handle or inside the crop area.
  //
  // Listeners are attached once (persistent), not per-drag, because real
  // multi-touch can land both fingers on the very same element: pointer capture
  // and pointerup are per-pointerId, so a dynamically-added/removed listener pair
  // gets torn down by whichever finger's pointerup happens to fire first — even
  // if that isn't the finger that started the single-pointer drag. A `primaryId`
  // closure variable instead tracks which pointer (if any) owns the current
  // single-pointer action, mirroring how overlayCanvas's own tool handlers work.
  function attachGestureAwareDrag(el, {start, move, end}){
    let primaryId = null;
    let ctx = null;
    el.addEventListener('pointerdown', e=>{
      activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if(activePointers.size>=2){ if(!pinchActive) startPinch(); return; }
      if(primaryId!==null) return;
      const c = start(e);
      if(c===false) return;
      try{ el.setPointerCapture(e.pointerId); }catch(err){}
      primaryId = e.pointerId;
      ctx = c;
    });
    el.addEventListener('pointermove', e=>{
      if(activePointers.has(e.pointerId)) activePointers.set(e.pointerId, {x:e.clientX, y:e.clientY});
      if(pinchActive){ updatePinch(); return; }
      if(activePointers.size>=2) return;
      if(e.pointerId!==primaryId || primaryId===null) return;
      move(e, ctx);
    });
    function endPrimary(e){
      if(e.pointerId===primaryId){
        const wasCtx = ctx;
        primaryId=null; ctx=null;
        if(end) end(e, wasCtx);
      }
      releasePointer(e);
    }
    el.addEventListener('pointerup', endPrimary);
    el.addEventListener('pointercancel', endPrimary);
  }

  // Anchor-based resize: dragging one edge/corner only moves that edge — the
  // opposite edge/corner stays visually fixed against the image (handled by
  // the caller compensating imgOffsetX/Y using the w/h delta returned here).
  function resizeFrame(handle, dx, dy, startFrame){
    const moveT = handle.includes('n'), moveB = handle.includes('s');
    const moveL = handle.includes('w'), moveR = handle.includes('e');
    const isCorner = (moveT||moveB) && (moveL||moveR);
    const maxW = cropViewportW, maxH = cropViewportH;
    let w = startFrame.w, h = startFrame.h;
    if(cropRatio==null){
      if(moveL||moveR) w = startFrame.w + (moveR?dx:-dx);
      if(moveT||moveB) h = startFrame.h + (moveB?dy:-dy);
      w = Math.max(MIN_CROP, Math.min(maxW, w));
      h = Math.max(MIN_CROP, Math.min(maxH, h));
    } else {
      const R = cropRatio;
      if(isCorner){
        const dW = moveR?dx:-dx;
        const dH = (moveB?dy:-dy) * R;
        const d = Math.abs(dW) > Math.abs(dH) ? dW : dH;
        w = Math.max(MIN_CROP, startFrame.w + d);
      } else if(moveL||moveR){
        w = Math.max(MIN_CROP, startFrame.w + (moveR?dx:-dx));
      } else {
        h = Math.max(MIN_CROP, startFrame.h + (moveB?dy:-dy));
        w = h*R;
      }
      if(isCorner || moveL || moveR) h = w/R;
      if(w>maxW){ w=maxW; h=w/R; }
      if(h>maxH){ h=maxH; w=h*R; }
      w = Math.max(MIN_CROP, w); h = Math.max(MIN_CROP, h);
    }
    return {w, h};
  }
  // Re-fits whatever is currently selected (frame's own aspect ratio, and the
  // exact image-space rectangle it covers) to fill the crop viewport, without
  // changing which pixels are selected — used by the 자동 확대 toggle after
  // every handle-resize.
  function zoomToFitFrame(){
    if(!frameW || !frameH || !mainCanvas.width || !mainCanvas.height) return;
    const R = frameW/frameH;
    const cx = mainCanvas.width/2 - imgOffsetX/imgScale;
    const cy = mainCanvas.height/2 - imgOffsetY/imgScale;
    const wImg = frameW/imgScale, hImg = frameH/imgScale;
    const sz = defaultFrameSize(R);
    frameW = sz.w; frameH = sz.h; // tentative, so minImgScale() below reflects the new frame size
    imgScale = clampImgScale(sz.w/wImg);
    imgOffsetX = (mainCanvas.width/2 - cx) * imgScale;
    imgOffsetY = (mainCanvas.height/2 - cy) * imgScale;
    clampImgOffset();
    renderCropFrame();
  }

  document.querySelectorAll('.crop-handle').forEach(handle=>{
    const h = handle.dataset.handle;
    const moveT = h.includes('n'), moveB = h.includes('s');
    const moveL = h.includes('w'), moveR = h.includes('e');
    attachGestureAwareDrag(handle, {
      start(e){
        e.preventDefault(); e.stopPropagation();
        return { startX:e.clientX, startY:e.clientY, startFrame:{w:frameW,h:frameH}, startOffX:imgOffsetX, startOffY:imgOffsetY, scale:imgScale };
      },
      move(e2, hctx){
        // The frame is always re-centered in the viewport by CSS, so a width/
        // height change is split evenly across both edges on screen — growing
        // by d only moves either edge by d/2. Doubling the raw pointer delta
        // here makes the edge under the user's finger track it 1:1; the pan
        // compensation below (using that same halved delta) is what then
        // keeps the *opposite* edge looking anchored to the image.
        const dx = (e2.clientX-hctx.startX)*2, dy = (e2.clientY-hctx.startY)*2;
        const dispW = mainCanvas.width*hctx.scale, dispH = mainCanvas.height*hctx.scale;
        function tentative(k){
          const sz = resizeFrame(h, dx*k, dy*k, hctx.startFrame);
          const deltaW = sz.w-hctx.startFrame.w, deltaH = sz.h-hctx.startFrame.h;
          let offX = hctx.startOffX, offY = hctx.startOffY;
          if(moveR) offX = hctx.startOffX - deltaW/2;
          else if(moveL) offX = hctx.startOffX + deltaW/2;
          if(moveB) offY = hctx.startOffY - deltaH/2;
          else if(moveT) offY = hctx.startOffY + deltaH/2;
          return {sz, offX, offY};
        }
        // The image is never re-zoomed mid-drag (that would yank the picture
        // around under the user's hand), so growth is capped at whatever the
        // image's current size/pan can actually still cover — found by
        // bisecting how much of the raw drag to honor — instead of growing
        // past the edge and having to snap back the other way afterward.
        function fits(t){
          if(Math.max(t.sz.w/mainCanvas.width, t.sz.h/mainCanvas.height) > hctx.scale+1e-6) return false;
          const maxX = Math.max(0,(dispW-t.sz.w)/2), maxY = Math.max(0,(dispH-t.sz.h)/2);
          return Math.abs(t.offX) <= maxX+0.5 && Math.abs(t.offY) <= maxY+0.5;
        }
        let k = 1;
        if(!fits(tentative(1))){
          let lo=0, hi=1;
          for(let i=0;i<24;i++){
            const mid=(lo+hi)/2;
            if(fits(tentative(mid))) lo=mid; else hi=mid;
          }
          k = lo;
        }
        const {sz, offX, offY} = tentative(k);
        frameW = sz.w; frameH = sz.h;
        imgOffsetX = offX; imgOffsetY = offY;
        clampImgOffset();
        sessionDirty = true;
        renderCropFrame();
      },
      end(){
        if(cropAutoZoom) zoomToFitFrame();
      }
    });
  });

  // Dragging anywhere on the crop-frame backdrop (inside or outside the visible
  // window) pans the image — the frame itself never moves.
  attachGestureAwareDrag(cropFrame, {
    start(e){
      e.preventDefault();
      return { startX:e.clientX, startY:e.clientY, startOffX:imgOffsetX, startOffY:imgOffsetY };
    },
    move(e2, pctx){
      imgOffsetX = pctx.startOffX + (e2.clientX-pctx.startX);
      imgOffsetY = pctx.startOffY + (e2.clientY-pctx.startY);
      clampImgOffset();
      sessionDirty = true;
      renderCropFrame();
    }
  });

  // ---------- Rotation (straighten): ruler drag + two-finger gesture ----------
  function rotatedBounds(w,h,deg){
    const rad = deg*Math.PI/180;
    return {
      w: Math.round(Math.abs(w*Math.cos(rad)) + Math.abs(h*Math.sin(rad))),
      h: Math.round(Math.abs(w*Math.sin(rad)) + Math.abs(h*Math.cos(rad)))
    };
  }
  function previewRotation(deg){
    if(!editingSnapshot) return;
    sessionDirty = true;
    cropRotationDeg = deg;
    const baseW = editingSnapshot.w, baseH = editingSnapshot.h;
    const {w:newW, h:newH} = rotatedBounds(baseW, baseH, deg);
    setCanvasSize(newW, newH);
    // Rebuilt fresh from editingSnapshot each call (same reasoning as
    // previewResize) so every layer rotates from its original pixels, not a
    // resampled result of the previous angle.
    layers = editingSnapshot.layers.map(ls=>{
      const layer = layerShellFromSnapshot(ls, newW, newH);
      const tmp = document.createElement('canvas');
      tmp.width = baseW; tmp.height = baseH;
      tmp.getContext('2d').putImageData(ls.img, 0, 0);
      layer.ctx.save();
      layer.ctx.translate(newW/2, newH/2);
      layer.ctx.rotate(deg*Math.PI/180);
      layer.ctx.drawImage(tmp, -baseW/2, -baseH/2);
      layer.ctx.restore();
      return layer;
    });
    activeLayerId = editingSnapshot.activeLayerId;
    // The frame itself never changes from a rotation — only the image's own pixel
    // bounds grew, so the zoom/pan just need re-clamping against the new size.
    if(cropModeActive){
      imgScale = clampImgScale(imgScale);
      clampImgOffset();
      renderCropFrame();
    }
    updateRulerUI();
    compositeLayers();
    renderLayerPanel();
  }
  function updateRulerUI(){
    rotateRulerTrack.style.transform = 'translateX(' + (-cropRotationDeg*PX_PER_DEG) + 'px)';
    rotateValueEl.textContent = Math.round(cropRotationDeg)+'°';
  }
  (function buildRulerTicks(){
    const frag = document.createDocumentFragment();
    for(let d=-45; d<=45; d++){
      const tick = document.createElement('div');
      tick.className = 'ruler-tick' + (d%10===0?' major':(d%5===0?' mid':''));
      tick.style.left = (2000 + d*PX_PER_DEG) + 'px';
      frag.appendChild(tick);
    }
    rotateRulerTrack.appendChild(frag);
  })();
  rotateRuler.addEventListener('pointerdown', e=>{
    beginEdit();
    try{ rotateRuler.setPointerCapture(e.pointerId); }catch(err){}
    const startX = e.clientX, startDeg = cropRotationDeg;
    function onMove(e2){
      const dx = e2.clientX-startX;
      previewRotation(Math.max(-45, Math.min(45, startDeg + dx/PX_PER_DEG)));
    }
    function onUp(){
      rotateRuler.removeEventListener('pointermove', onMove);
      rotateRuler.removeEventListener('pointerup', onUp);
      rotateRuler.removeEventListener('pointercancel', onUp);
    }
    rotateRuler.addEventListener('pointermove', onMove);
    rotateRuler.addEventListener('pointerup', onUp);
    rotateRuler.addEventListener('pointercancel', onUp);
  });

  function applyCropAction(){
    if(!editingSnapshot) beginEdit();
    commitEdit();
    const cropPxW = Math.max(1, Math.round(frameW/imgScale));
    const cropPxH = Math.max(1, Math.round(frameH/imgScale));
    const srcX = Math.round(mainCanvas.width/2 - (frameW/2+imgOffsetX)/imgScale);
    const srcY = Math.round(mainCanvas.height/2 - (frameH/2+imgOffsetY)/imgScale);
    const x = Math.max(0, Math.min(srcX, mainCanvas.width-cropPxW));
    const y = Math.max(0, Math.min(srcY, mainCanvas.height-cropPxH));
    const oldLayers = layers;
    layers = oldLayers.map(l=>{
      const {canvas, ctx:lctx} = makeLayerCanvas(cropPxW, cropPxH);
      lctx.drawImage(l.canvas, x,y,cropPxW,cropPxH, 0,0,cropPxW,cropPxH);
      return { id:l.id, name:l.name, canvas, ctx:lctx, visible:l.visible, locked:l.locked, opacity:l.opacity, blendMode:l.blendMode };
    });
    setCanvasSize(cropPxW,cropPxH);
    hasSelection=false;
    syncResizeInputs();
    updateDims();
    cropRotationDeg = 0;
    frameW = 0; frameH = 0; // force a fresh centered view next time crop opens
    updateRulerUI();
    compositeLayers();
    renderLayerPanel();
  }
  function cancelCropAction(){
    cancelEdit();
    cropRotationDeg = 0;
    frameW = 0; frameH = 0;
    updateRulerUI();
  }

  // ---------- Box blur helpers ----------
  function boxBlurPass(src,w,h,radius){
    if(radius<1) return src;
    const out = new Uint8ClampedArray(src.length);
    // horizontal
    const tmp = new Float32Array(src.length);
    for(let y=0;y<h;y++){
      let rSum=0,gSum=0,bSum=0,aSum=0,count=0;
      const rowStart = y*w*4;
      for(let x=-radius;x<=radius;x++){
        const xi = Math.min(w-1,Math.max(0,x));
        const idx = rowStart+xi*4;
        rSum+=src[idx];gSum+=src[idx+1];bSum+=src[idx+2];aSum+=src[idx+3];count++;
      }
      for(let x=0;x<w;x++){
        const idx = rowStart+x*4;
        tmp[idx]=rSum/count; tmp[idx+1]=gSum/count; tmp[idx+2]=bSum/count; tmp[idx+3]=aSum/count;
        const addX = Math.min(w-1,x+radius+1), remX = Math.max(0,x-radius);
        const addIdx = rowStart+addX*4, remIdx = rowStart+remX*4;
        rSum += src[addIdx]-src[remIdx]; gSum += src[addIdx+1]-src[remIdx+1];
        bSum += src[addIdx+2]-src[remIdx+2]; aSum += src[addIdx+3]-src[remIdx+3];
      }
    }
    // vertical
    for(let x=0;x<w;x++){
      let rSum=0,gSum=0,bSum=0,aSum=0,count=0;
      for(let y=-radius;y<=radius;y++){
        const yi = Math.min(h-1,Math.max(0,y));
        const idx = (yi*w+x)*4;
        rSum+=tmp[idx];gSum+=tmp[idx+1];bSum+=tmp[idx+2];aSum+=tmp[idx+3];count++;
      }
      for(let y=0;y<h;y++){
        const idx=(y*w+x)*4;
        out[idx]=rSum/count; out[idx+1]=gSum/count; out[idx+2]=bSum/count; out[idx+3]=aSum/count;
        const addY = Math.min(h-1,y+radius+1), remY = Math.max(0,y-radius);
        const addIdx=(addY*w+x)*4, remIdx=(remY*w+x)*4;
        rSum += tmp[addIdx]-tmp[remIdx]; gSum += tmp[addIdx+1]-tmp[remIdx+1];
        bSum += tmp[addIdx+2]-tmp[remIdx+2]; aSum += tmp[addIdx+3]-tmp[remIdx+3];
      }
    }
    return out;
  }
  function gaussianApprox(src,w,h,radius){
    let out = src;
    out = boxBlurPass(out,w,h,radius);
    out = boxBlurPass(out,w,h,radius);
    out = boxBlurPass(out,w,h,radius);
    return out;
  }
  // Blurring raw (unpremultiplied) RGB near a transparent edge — e.g. a draw
  // layer's brush stroke against an empty background — averages in whatever
  // color sits under fully-transparent neighbors (usually black), darkening
  // the edge instead of just fading it out. Premultiplying first makes a
  // transparent pixel's color contribution genuinely zero, and dividing back
  // out by the (also blurred) alpha afterward recovers correct edge colors.
  function premultiplyAlpha(src){
    const out = new Uint8ClampedArray(src.length);
    for(let i=0;i<src.length;i+=4){
      const a = src[i+3]/255;
      out[i]=src[i]*a; out[i+1]=src[i+1]*a; out[i+2]=src[i+2]*a; out[i+3]=src[i+3];
    }
    return out;
  }
  function unpremultiplyAlpha(src){
    const out = new Uint8ClampedArray(src.length);
    for(let i=0;i<src.length;i+=4){
      const a = src[i+3];
      if(a>0){
        const f = 255/a;
        out[i]=src[i]*f; out[i+1]=src[i+1]*f; out[i+2]=src[i+2]*f;
      }
      out[i+3]=a;
    }
    return out;
  }
  function boxBlurAlpha(imgData,w,h,radius){
    const src = imgData.data;
    const alphaRGBA = new Uint8ClampedArray(src.length);
    for(let i=3;i<src.length;i+=4) alphaRGBA[i]=src[i];
    const blurred = radius<1 ? alphaRGBA : gaussianApprox(alphaRGBA,w,h,radius);
    const out = new ImageData(w,h);
    for(let i=0;i<src.length;i+=4){
      out.data[i]=255; out.data[i+1]=255; out.data[i+2]=255; out.data[i+3]=blurred[i+3];
    }
    return out;
  }

  // ---------- Effects: 블러 / 노이즈 / 흑백 (picker grid → per-effect detail) ----------
  const blurRange = document.getElementById('blurRange');
  const noiseRange = document.getElementById('noiseRange');
  const noiseMonoChk = document.getElementById('noiseMono');
  const bwRange = document.getElementById('bwRange');

  function addNoise(result, amt, mono){
    for(let i=0;i<result.length;i+=4){
      if(mono){
        const n = (Math.random()*2-1)*amt;
        result[i]+=n; result[i+1]+=n; result[i+2]+=n;
      } else {
        // Photoshop's default noise perturbs each channel independently,
        // producing colored speckle rather than pure luminance grain.
        result[i]   += (Math.random()*2-1)*amt;
        result[i+1] += (Math.random()*2-1)*amt;
        result[i+2] += (Math.random()*2-1)*amt;
      }
    }
  }
  function applyGrayscale(result, amt){
    const t = amt/100;
    for(let i=0;i<result.length;i+=4){
      const gray = result[i]*0.299 + result[i+1]*0.587 + result[i+2]*0.114;
      result[i]   = result[i]  *(1-t) + gray*t;
      result[i+1] = result[i+1]*(1-t) + gray*t;
      result[i+2] = result[i+2]*(1-t) + gray*t;
    }
  }
  // Only the currently-picked tile's own slider is ever live — otherwise a
  // leftover value on another effect's slider (e.g. blur/noise's non-zero
  // defaults) would silently stack onto whichever effect is actually open.
  let currentEffectName = null;
  function runEffectsPreview(){
    beginEdit();
    const radius = currentEffectName==='blur' ? parseInt(blurRange.value,10) : 0;
    const noiseAmt = currentEffectName==='noise' ? parseInt(noiseRange.value,10) : 0;
    const noiseMono = noiseMonoChk.checked;
    const bwAmt = currentEffectName==='bw' ? parseInt(bwRange.value,10) : 0;
    previewEffect((data,w,h)=>{
      let result = radius>0 ? unpremultiplyAlpha(gaussianApprox(premultiplyAlpha(data),w,h,radius)) : data;
      if(noiseAmt>0){ result = new Uint8ClampedArray(result); addNoise(result, noiseAmt, noiseMono); }
      if(bwAmt>0){ result = new Uint8ClampedArray(result); applyGrayscale(result, bwAmt); }
      return result;
    });
  }
  blurRange.addEventListener('input', ()=>{document.getElementById('blurVal').textContent=blurRange.value; runEffectsPreview();});
  noiseRange.addEventListener('input', ()=>{document.getElementById('noiseVal').textContent=noiseRange.value; runEffectsPreview();});

  // Picker grid ⇄ per-effect detail navigation.
  const effectGridEl = document.getElementById('effectGrid');
  function showEffectGrid(){
    effectGridEl.hidden = false;
    document.querySelectorAll('.effect-detail').forEach(el=> el.hidden=true);
    // Back at the picker, no single effect is "selected" — revert the live
    // preview to the untouched image rather than leaving the last-picked

    currentEffectName = null;

  }
  function showEffectDetail(name){
    effectGridEl.hidden = true;
    document.querySelectorAll('.effect-detail').forEach(el=> el.hidden=true);
    const map = {blur:'effectDetailBlur', noise:'effectDetailNoise', bw:'effectDetailBw'};

  // Each thumbnail previews what that one effect alone (at a fixed,
  // representative strength) would look like on the image as it is right
  // now — regenerated once per 효과 session, not live with the sliders,
  // since it's a "what is this filter" swatch rather than the real preview.
  function renderEffectThumbnails(){
    if(!editingSnapshot) return;
    const layerSnap = editingSnapshot.layers.find(l=>l.id===editingSnapshot.activeLayerId);
    if(!layerSnap) return;
    const THUMB = 96;
    const srcCanvas = document.createElement('canvas');
    srcCanvas.width = editingSnapshot.w; srcCanvas.height = editingSnapshot.h;
    srcCanvas.getContext('2d').putImageData(layerSnap.img, 0, 0);
    const sw = editingSnapshot.w, sh = editingSnapshot.h;
    const side = Math.min(sw, sh);
    const sx = (sw-side)/2, sy = (sh-side)/2;

    function baseThumbData(){
      const c = document.createElement('canvas');
      c.width = THUMB; c.height = THUMB;
      const tctx = c.getContext('2d');
      tctx.drawImage(srcCanvas, sx, sy, side, side, 0, 0, THUMB, THUMB);
      return tctx.getImageData(0,0,THUMB,THUMB);
    }
    function paint(canvasId, transformFn){
      const canvasEl = document.getElementById(canvasId);
      canvasEl.width = THUMB; canvasEl.height = THUMB;
      const id = baseThumbData();
      if(transformFn) transformFn(id.data);
      canvasEl.getContext('2d').putImageData(id,0,0);
    }
    paint('effectThumbBlur', data=>{
      const blurred = unpremultiplyAlpha(gaussianApprox(premultiplyAlpha(data), THUMB, THUMB, 4));
      data.set(blurred);
    });
    paint('effectThumbNoise', data=> addNoise(data, 35, false));
    paint('effectThumbBw', data=> applyGrayscale(data, 100));
  }

  // ---------- Selective color (Photoshop-style: 9 color ranges × C/M/Y/K) ----------
  function rgbToHue(r,g,b){
    r/=255;g/=255;b/=255;
    const max=Math.max(r,g,b), min=Math.min(r,g,b);
    let h=0;
    if(max!==min){
      const d = max-min;
      if(max===r) h = ((g-b)/d)%6;
      else if(max===g) h = (b-r)/d+2;
      else h = (r-g)/d+4;
      h*=60; if(h<0) h+=360;
    }
    return h;
  }
  function hueDist(a,b){
    let d = Math.abs(a-b)%360;
    return d>180 ? 360-d : d;
  }
  const scRangeSelect = document.getElementById('scRange');
  const scC = document.getElementById('scC'), scCNum = document.getElementById('scCNum');
  const scM = document.getElementById('scM'), scMNum = document.getElementById('scMNum');
  const scY = document.getElementById('scY'), scYNum = document.getElementById('scYNum');
  const scK = document.getElementById('scK'), scKNum = document.getElementById('scKNum');
  const SC_RANGES = ['red','yellow','green','cyan','blue','magenta','white','neutral','black'];
  const SC_HUE_CENTER = {red:0,yellow:60,green:120,cyan:180,blue:240,magenta:300};
  let scValues = {};
  let scCurrentRange = 'red';
  function resetSCValues(){
    SC_RANGES.forEach(r=> scValues[r] = {c:0,m:0,y:0,k:0});
  }
  resetSCValues();

  // Each pixel gets a 0..1 membership weight per color range: the six hue-based
  // ranges are weighted by both hue proximity and saturation (so a nearly-gray
  // pixel doesn't get pulled by a chromatic range), and the three tonal ranges
  // (whites/neutrals/blacks) are weighted purely by lightness.
  function scWeights(r,g,b){
    const max=Math.max(r,g,b), min=Math.min(r,g,b);
    const L = (max+min)/2/255;
    const sat = max===0 ? 0 : (max-min)/max;
    const hue = rgbToHue(r,g,b);
    const w = {};
    for(const k in SC_HUE_CENTER){
      const hueW = Math.max(0, 1 - hueDist(hue, SC_HUE_CENTER[k])/60);
      w[k] = hueW * sat;
    }
    w.white = Math.max(0, Math.min(1, (L-0.5)/0.5));
    w.black = Math.max(0, Math.min(1, (0.5-L)/0.5));
    // Neutrals means desaturated grays, not just "medium lightness" — without the
    // (1-sat) factor a fully saturated mid-lightness color (pure red, pure
    // yellow, ...) would incorrectly get full weight here too.
    w.neutral = Math.max(0, 1 - Math.abs(L-0.5)*2) * (1-sat);
    return w;
  }
  function scAggregate(r,g,b,valuesOverride){
    const values = valuesOverride || scValues;
    const w = scWeights(r,g,b);
    let c=0,m=0,y=0,k=0;
    for(const range of SC_RANGES){
      const wt = w[range];
      if(!wt) continue;
      const v = values[range];
      c += wt*v.c; m += wt*v.m; y += wt*v.y; k += wt*v.k;
    }
    return [
      Math.max(-100,Math.min(100,c)),
      Math.max(-100,Math.min(100,m)),
      Math.max(-100,Math.min(100,y)),
      Math.max(-100,Math.min(100,k))
    ];
  }
  // "Relative" method (matches Photoshop's default): a positive adjustment pulls
  // the channel down proportional to its current value; a negative one pulls it
  // up proportional to its remaining headroom.
  function scAdjustChannel(val, delta){
    return delta>=0 ? (val - val*delta) : (val - (255-val)*delta);
  }
  function runSCPreview(){
    beginEdit();
    previewAdjustment((data)=>{
      for(let i=0;i<data.length;i+=4){
        const r=data[i], g=data[i+1], b=data[i+2];
        const [c,m,y,k] = scAggregate(r,g,b);
        let R = scAdjustChannel(r, c/100);
        let G = scAdjustChannel(g, m/100);
        let B = scAdjustChannel(b, y/100);
        const dk = k/100;
        if(dk>=0){ R*=(1-dk); G*=(1-dk); B*=(1-dk); }
        else { R += (255-R)*(-dk); G += (255-G)*(-dk); B += (255-B)*(-dk); }
        data[i]=R; data[i+1]=G; data[i+2]=B;
      }
      return data;
    });
    if(previewTargetLayerId!=null){
      const t = layers.find(l=>l.id===previewTargetLayerId);
      if(t) t.adjustmentParams = {scValues: JSON.parse(JSON.stringify(scValues))};
    }
  }
  function syncSCInputs(){
    const v = scValues[scCurrentRange];
    scC.value=v.c; scCNum.value=v.c;
    scM.value=v.m; scMNum.value=v.m;
    scY.value=v.y; scYNum.value=v.y;
    scK.value=v.k; scKNum.value=v.k;
  }
  function bindSCChannel(rangeInput, numInput, channel){
    function apply(v){
      v = Math.max(-100, Math.min(100, Math.round(v)));
      scValues[scCurrentRange][channel] = v;
      rangeInput.value = v;
      numInput.value = v;
      sessionDirty = true;
      runSCPreview();
    }
    rangeInput.addEventListener('input', ()=> apply(parseInt(rangeInput.value,10)));
    numInput.addEventListener('input', ()=>{
      const n = parseInt(numInput.value,10);
      if(!isNaN(n)) apply(n);
    });
  }
  bindSCChannel(scC, scCNum, 'c');
  bindSCChannel(scM, scMNum, 'm');
  bindSCChannel(scY, scYNum, 'y');
  bindSCChannel(scK, scKNum, 'k');
  scRangeSelect.addEventListener('change', ()=>{
    scCurrentRange = scRangeSelect.value;
    syncSCInputs();
  });
  function resetSCInputs(){
    resetSCValues();
    scCurrentRange = 'red';
    scRangeSelect.value = 'red';
    syncSCInputs();
  }
  function applySCAction(){ commitEdit(); resetSCInputs(); }
  function cancelSCAction(){ cancelEdit(); resetSCInputs(); }

  // ---------- Levels ----------
  const lvInB=document.getElementById('lvInB'), lvInW=document.getElementById('lvInW'), lvGamma=document.getElementById('lvGamma');
  const lvOutB=document.getElementById('lvOutB'), lvOutW=document.getElementById('lvOutW');
  function runLevelsPreview(){
    beginEdit();
    const inB=parseInt(lvInB.value,10), inW=parseInt(lvInW.value,10), gamma=parseInt(lvGamma.value,10)/100;
    const outB=parseInt(lvOutB.value,10), outW=parseInt(lvOutW.value,10);
    const lut = new Uint8ClampedArray(256);
    for(let v=0;v<256;v++){
      let x = (v-inB)/Math.max(1,(inW-inB));
      x = Math.min(1,Math.max(0,x));
      x = Math.pow(x, 1/gamma);
      lut[v] = outB + x*(outW-outB);
    }
    previewAdjustment((data)=>{
      for(let i=0;i<data.length;i+=4){
        data[i]=lut[data[i]]; data[i+1]=lut[data[i+1]]; data[i+2]=lut[data[i+2]];
      }
      return data;
    });
    if(previewTargetLayerId!=null){
      const t = layers.find(l=>l.id===previewTargetLayerId);
      if(t) t.adjustmentParams = {inB:parseInt(lvInB.value,10), inW:parseInt(lvInW.value,10), gamma:parseInt(lvGamma.value,10), outB:parseInt(lvOutB.value,10), outW:parseInt(lvOutW.value,10)};
    }
  }
  [lvInB,lvInW,lvGamma,lvOutB,lvOutW].forEach(el=>{
    el.addEventListener('input', ()=>{
      document.getElementById('lvInBVal').textContent=lvInB.value;
      document.getElementById('lvInWVal').textContent=lvInW.value;
      document.getElementById('lvGammaVal').textContent=(parseInt(lvGamma.value,10)/100).toFixed(2);
      document.getElementById('lvOutBVal').textContent=lvOutB.value;
      document.getElementById('lvOutWVal').textContent=lvOutW.value;
      runLevelsPreview();
    });
  });
  function resetLevelsInputs(params){
    const p = params || {inB:0, inW:255, gamma:100, outB:0, outW:255};
    lvInB.value=p.inB; lvInW.value=p.inW; lvGamma.value=p.gamma; lvOutB.value=p.outB; lvOutW.value=p.outW;
    document.getElementById('lvInBVal').textContent=p.inB;
    document.getElementById('lvInWVal').textContent=p.inW;
    document.getElementById('lvGammaVal').textContent=(p.gamma/100).toFixed(2);
    document.getElementById('lvOutBVal').textContent=p.outB;
    document.getElementById('lvOutWVal').textContent=p.outW;
  }
  function applyLevelsAction(){ commitEdit(); resetLevelsInputs(); }
  function cancelLevelsAction(){ cancelEdit(); resetLevelsInputs(); }

  // ---------- Curves ----------
  const curveCanvas = document.getElementById('curveCanvas');
  const cctx = curveCanvas.getContext('2d');
  const CURVE_W = curveCanvas.width, CURVE_H = curveCanvas.height;
  let curvePoints = [[0,0],[255,255]];
  let draggingPointIdx = -1;

  // Curve-value space is always 0..255 on both axes; screen space is the
  // canvas's own (possibly non-square) pixel buffer, CURVE_W × CURVE_H.
  function curveToScreen(p){ return [p[0]*(CURVE_W/255), CURVE_H-(p[1]/255)*CURVE_H]; }
  function screenToCurve(x,y){
    return [
      Math.min(255,Math.max(0, x*(255/CURVE_W))),
      Math.min(255,Math.max(0, 255-(y/CURVE_H)*255))
    ];
  }
  // The canvas is displayed at width:100% (CSS size can differ from its
  // CURVE_W×CURVE_H pixel buffer), so pointer coordinates need the same
  // buffer/rect scale correction canvasPos() already applies for the main image.
  function curvePointerPos(e){
    const rect = curveCanvas.getBoundingClientRect();
    const scaleX = curveCanvas.width/rect.width;
    const scaleY = curveCanvas.height/rect.height;
    return [ (e.clientX-rect.left)*scaleX, (e.clientY-rect.top)*scaleY ];
  }

  function buildLUT(pointsOverride){
    const pts = [...(pointsOverride||curvePoints)].sort((a,b)=>a[0]-b[0]);
    const lut = new Uint8ClampedArray(256);
    // With only the two default endpoints, stay a straight line (no curvature)
    // until the user actually adds a third point to bend it.
    if(pts.length<=2){
      const [x0,y0]=pts[0], [x1,y1]=pts[pts.length-1];
      for(let x=0;x<256;x++){
        const t = x1===x0 ? 0 : Math.min(1,Math.max(0,(x-x0)/(x1-x0)));
        lut[x] = y0 + (y1-y0)*t;
      }
      return lut;
    }
    // Monotonic cubic Hermite spline (Fritsch–Carlson): unlike a plain
    // Catmull-Rom spline, tangents are derived from — and then clamped
    // against — each segment's own secant slope, so a segment never
    // overshoots into a sharp kink or an unnaturally sharp bend the way
    // Catmull-Rom can depending on how its neighbors happen to be placed.
    // This makes every added point bend smoothly and consistently.
    const n = pts.length;
    const xs = pts.map(p=>p[0]), ys = pts.map(p=>p[1]);
    const dx = new Array(n-1), m = new Array(n-1);
    for(let i=0;i<n-1;i++){
      dx[i] = Math.max(1e-6, xs[i+1]-xs[i]);
      m[i] = (ys[i+1]-ys[i])/dx[i];
    }
    const tang = new Array(n);
    tang[0] = m[0];
    tang[n-1] = m[n-2];
    for(let i=1;i<n-1;i++){
      if(m[i-1]===0 || m[i]===0 || (m[i-1]<0)!==(m[i]<0)){
        tang[i] = 0;
      } else {
        const w1 = 2*dx[i]+dx[i-1], w2 = dx[i]+2*dx[i-1];
        tang[i] = (w1+w2)/(w1/m[i-1] + w2/m[i]);
      }
    }
    for(let i=0;i<n-1;i++){
      if(m[i]===0){ tang[i]=0; tang[i+1]=0; continue; }
      const a = tang[i]/m[i], b = tang[i+1]/m[i];
      if(a<0) tang[i]=0;
      if(b<0) tang[i+1]=0;
      const s = a*a+b*b;
      if(s>9){
        const scale = 3/Math.sqrt(s);
        tang[i] = scale*a*m[i];
        tang[i+1] = scale*b*m[i];
      }
    }
    let seg = 0;
    for(let x=0;x<256;x++){
      while(seg<n-2 && x>xs[seg+1]) seg++;
      const h = dx[seg];
      let t = (x-xs[seg])/h;
      t = Math.min(1,Math.max(0,t));
      const t2=t*t, t3=t2*t;
      const h00=2*t3-3*t2+1, h10=t3-2*t2+t, h01=-2*t3+3*t2, h11=t3-t2;
      lut[x] = h00*ys[seg] + h10*h*tang[seg] + h01*ys[seg+1] + h11*h*tang[seg+1];
    }
    return lut;
  }
  function drawCurveEditor(){
    cctx.clearRect(0,0,CURVE_W,CURVE_H);
    cctx.fillStyle='#101214'; cctx.fillRect(0,0,CURVE_W,CURVE_H);
    cctx.strokeStyle='#2c3137'; cctx.lineWidth=1;
    for(let i=1;i<4;i++){
      const gx=i*CURVE_W/4, gy=i*CURVE_H/4;
      cctx.beginPath(); cctx.moveTo(gx,0); cctx.lineTo(gx,CURVE_H); cctx.stroke();
      cctx.beginPath(); cctx.moveTo(0,gy); cctx.lineTo(CURVE_W,gy); cctx.stroke();
    }
    // Always show the original identity line (no adjustment) as a guide,
    // regardless of how the actual curve below has been bent.
    cctx.save();
    cctx.strokeStyle='rgba(231,233,236,.35)'; cctx.lineWidth=1; cctx.setLineDash([4,3]);
    cctx.beginPath();
    const [gx0,gy0] = curveToScreen([0,0]), [gx1,gy1] = curveToScreen([255,255]);
    cctx.moveTo(gx0,gy0); cctx.lineTo(gx1,gy1);
    cctx.stroke();
    cctx.restore();

    const lut = buildLUT();
    cctx.strokeStyle='#4fd1c5'; cctx.lineWidth=2;
    cctx.beginPath();
    for(let x=0;x<256;x++){
      const [sx,sy] = curveToScreen([x,lut[x]]);
      if(x===0) cctx.moveTo(sx,sy); else cctx.lineTo(sx,sy);
    }
    cctx.stroke();
    cctx.fillStyle='#e7e9ec';
    for(const p of curvePoints){
      const [sx,sy]=curveToScreen(p);
      cctx.beginPath(); cctx.arc(sx,sy,4,0,Math.PI*2); cctx.fill();
    }
    // Plain numeric readout of the point coordinates — lets the user report
    // back exactly what they set (e.g. to request a new default) without
    // needing dev tools.
    const readout = document.getElementById('curvePointsReadout');
    if(readout){
      const sorted = [...curvePoints].sort((a,b)=>a[0]-b[0]);
      readout.textContent = '포인트: ' + sorted.map(p=>`(${Math.round(p[0])}, ${Math.round(p[1])})`).join(' → ');
    }
    return lut;
  }
  function runCurvePreview(){
    beginEdit();
    sessionDirty = true;
    const lut = drawCurveEditor();
    previewAdjustment((data)=>{
      for(let i=0;i<data.length;i+=4){
        data[i]=lut[data[i]]; data[i+1]=lut[data[i+1]]; data[i+2]=lut[data[i+2]];
      }
      return data;
    });
    if(previewTargetLayerId!=null){
      const t = layers.find(l=>l.id===previewTargetLayerId);
      if(t) t.adjustmentParams = {points: JSON.parse(JSON.stringify(curvePoints))};
    }
  }
  curveCanvas.addEventListener('pointerdown', e=>{
    const [x,y] = curvePointerPos(e);
    let found=-1, best=16;
    curvePoints.forEach((p,idx)=>{
      const [sx,sy]=curveToScreen(p);
      const d = Math.hypot(sx-x,sy-y);
      if(d<best){best=d;found=idx;}
    });
    if(found>=0){ draggingPointIdx=found; }
    else{
      const [cx,cy] = screenToCurve(x,y);
      curvePoints.push([cx,cy]);
      draggingPointIdx = curvePoints.length-1;
    }
    curveCanvas.setPointerCapture(e.pointerId);
    runCurvePreview();
  });
  // The two edge anchors (x=0 and x=255) must stay identified by VALUE, not by
  // array position — a newly added point is always pushed to the end of
  // curvePoints, so "last index" stops meaning "the right edge" the moment a
  // third point exists. Using the current min/max-x indices keeps the real
  // endpoints x-locked regardless of insertion order.
  function curveEdgeIndices(){
    let minIdx=0, maxIdx=0;
    curvePoints.forEach((p,idx)=>{
      if(p[0]<curvePoints[minIdx][0]) minIdx=idx;
      if(p[0]>curvePoints[maxIdx][0]) maxIdx=idx;
    });
    return [minIdx, maxIdx];
  }
  curveCanvas.addEventListener('pointermove', e=>{
    if(draggingPointIdx<0) return;
    const [x,y] = curvePointerPos(e);
    const [cx,cy] = screenToCurve(x,y);
    const [minIdx,maxIdx] = curveEdgeIndices();
    if(draggingPointIdx===minIdx) curvePoints[draggingPointIdx]=[0,cy];
    else if(draggingPointIdx===maxIdx) curvePoints[draggingPointIdx]=[255,cy];
    else curvePoints[draggingPointIdx]=[cx,cy];
    runCurvePreview();
  });
  curveCanvas.addEventListener('pointerup', ()=>{ draggingPointIdx=-1; });
  curveCanvas.addEventListener('dblclick', e=>{
    if(curvePoints.length<=2) return;
    const [x,y] = curvePointerPos(e);
    let found=-1, best=16;
    curvePoints.forEach((p,idx)=>{
      const [sx,sy]=curveToScreen(p);
      const d = Math.hypot(sx-x,sy-y);
      if(d<best){best=d;found=idx;}
    });
    const [minIdx,maxIdx] = curveEdgeIndices();
    if(found>=0 && found!==minIdx && found!==maxIdx){
      curvePoints.splice(found,1);
      sessionDirty = true;
      runCurvePreview();
    }
  });
  document.getElementById('resetCurveBtn').addEventListener('click', ()=>{
    curvePoints=[[0,0],[255,255]];
    runCurvePreview();
  });
  function applyCurveAction(){ commitEdit(); curvePoints=[[0,0],[255,255]]; drawCurveEditor(); }
  function cancelCurveAction(){ cancelEdit(); curvePoints=[[0,0],[255,255]]; drawCurveEditor(); }
  drawCurveEditor();

  // ---------- Menu → tool mapping ----------
  // There's no standalone tool tab/row: opening the menu that needs a tool arms it
  // directly (lasso for selection); menus that don't touch the canvas arm 'none'.
  // 크롭 is handled separately since it shows/hides the crop-frame overlay, not a tool.
  const MENU_TOOL = {
    'group-draw': 'draw',
    'group-bgremove': 'bg-sub',
    'group-selection': 'lasso',
    'group-resize': 'none',
    'group-effects': 'none',
    'group-sc': 'none',
    'group-levels': 'none',
    'group-curve': 'none'
  };
  function onMenuOpen(id){
    if(id==='group-crop'){
      setTool('none');
      showCropFrame();
    } else {
      if(id==='group-resize') syncResizeInputs();
      if(id==='group-sc'){
        const params = beginAdjustmentSession('sc', '선택색상');
        if(params){ scValues = JSON.parse(JSON.stringify(params.scValues)); scCurrentRange='red'; scRangeSelect.value='red'; }
        syncSCInputs();
      }
      if(id==='group-levels'){
        const params = beginAdjustmentSession('levels', '레벨');
        resetLevelsInputs(params);
      }
      if(id==='group-curve'){
        const params = beginAdjustmentSession('curve', '곡선');
        curvePoints = params ? JSON.parse(JSON.stringify(params.points)) : [[0,0],[255,255]];
        drawCurveEditor();
      }
      if(id==='group-draw'){
        strokeUndoStack = []; strokeRedoStack = [];
        updateDrawHistoryButtons();
      }
      if(id==='group-selection') applyDefaultFeather();
      const tool = MENU_TOOL[id];
      if(tool) setTool(tool);
      if(id==='group-bgremove') runAutoBgDetect();
      if(id==='group-effects'){
        showEffectGrid();
        renderEffectThumbnails();
      }
    }
  }
  function onMenuClose(id){
    if(id==='group-crop') hideCropFrame();
    if(id==='group-sc' || id==='group-levels' || id==='group-curve') endAdjustmentSession();
  }

  // Every menu commits/discards as one bundled undo step via the header's
  // 적용/취소, instead of each panel having its own apply/cancel buttons.
  const MENU_SESSION = {
    'group-draw': { commit: applyDrawAction, cancel: cancelDrawAction },
    'group-bgremove': { commit: applyBgRemoveAction, cancel: cancelBgRemoveAction },
    'group-selection': { commit: applySelectionAction, cancel: cancelSelectionAction },
    'group-crop': { commit: applyCropAction, cancel: cancelCropAction },
    'group-resize': { commit: applyResizeAction, cancel: cancelResizeAction },
    'group-effects': { commit: applyEffectsAction, cancel: cancelEffectsAction },
    'group-sc': { commit: applySCAction, cancel: cancelSCAction },
    'group-levels': { commit: applyLevelsAction, cancel: cancelLevelsAction },
    'group-curve': { commit: applyCurveAction, cancel: cancelCurveAction }
  };

  let activeMenuId = null;

  function enterMenu(id){
    activeMenuId = id;
    beginEdit();
    onMenuOpen(id);
    document.body.classList.add('editing-mode');
    document.body.classList.toggle('crop-editing', id==='group-crop');
    document.body.classList.toggle('draw-editing', id==='group-draw');
    updateLockedLayerWarning();
  }
  // Visually closes whichever menu is active (deactivates its mobile tab /
  // collapses its desktop section) and returns the header/tab bar to normal.
  function closeMenuUI(){
    if(mobileTabBar){
      mobileTabBar.querySelectorAll('.tab-btn.active').forEach(b=>b.classList.remove('active'));
    }
    sideGroups.querySelectorAll(':scope > .mobile-active').forEach(el=>el.classList.remove('mobile-active'));
    if(activeMenuId){
      const group = document.getElementById(activeMenuId);
      if(group) group.classList.add('collapsed');
    }
    document.body.classList.remove('editing-mode');
    document.body.classList.remove('crop-editing');
    document.body.classList.remove('draw-editing');
    activeMenuId = null;
    setTool('none');
    updateLockedLayerWarning();
  }
  function applyActiveMenu(){
    if(!activeMenuId) return;
    endPeek(); // never commit/close while the canvas is showing the "before" peek
    const wasForcedSquareCrop = forcedCropActive && activeMenuId==='group-crop';
    const session = MENU_SESSION[activeMenuId];
    if(session) session.commit();
    onMenuClose(activeMenuId);
    closeMenuUI();
    if(wasForcedSquareCrop){
      endForcedCropLock();
      runProfileAutomationPipeline();
    }
  }
  function cancelActiveMenu(confirmFirst){
    if(!activeMenuId) return;
    if(forcedCropActive) return; // no escape without a square crop — see startForcedSquareCrop
    endPeek();
    // Skip the confirm entirely when nothing was actually changed in this
    // session — there's nothing to lose, so asking would just be noise.
    if(confirmFirst && sessionDirty && !window.confirm('변경 사항을 삭제할까요?')) return;
    const session = MENU_SESSION[activeMenuId];
    if(session) session.cancel();
    onMenuClose(activeMenuId);
    closeMenuUI();
  }
  menuApplyBtn.addEventListener('click', ()=> applyActiveMenu());
  menuCancelBtn.addEventListener('click', ()=> cancelActiveMenu(true));

  // ---------- Desktop accordion ----------
  // Every group keeps the `open` attribute permanently (see note in the mobile CSS:
  // browsers hide a closed <details>'s content with a UA !important rule that no
  // author style can override, which broke the mobile tab panels). Collapse/expand
  // is instead driven entirely by our own `.collapsed` class. Only one section is
  // ever the "active" editing session at a time — expanding a different one while
  // one is already open silently keeps (applies) whatever was pending in it first.
  document.querySelectorAll('#sideGroups > .group > summary').forEach(summary=>{
    summary.addEventListener('click', e=>{
      e.preventDefault();
      const group = summary.parentElement;
      if(group.id===activeMenuId){
        applyActiveMenu();
        return;
      }
      if(activeMenuId) applyActiveMenu();
      document.querySelectorAll('#sideGroups > .group').forEach(g=> g.classList.add('collapsed'));
      group.classList.remove('collapsed');
      enterMenu(group.id);
    });
  });

  // ---------- Mobile bottom menu bar ----------
  // The tab bar is only visible when no menu is active (see the editing-mode CSS),
  // so a tab tap here always means "open a fresh menu" — closing always goes
  // through the header's 적용/취소 first.
  if(mobileTabBar){
    const tabButtons = mobileTabBar.querySelectorAll('.tab-btn');
    tabButtons.forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const targetEl = document.getElementById(btn.dataset.target);
        if(!targetEl) return;
        btn.classList.add('active');
        targetEl.classList.add('mobile-active');
        targetEl.classList.remove('collapsed');
        enterMenu(btn.dataset.target);
      });
    });
  }

  // ---------- Download ----------
  downloadBtn.addEventListener('click', ()=>{
    mainCanvas.toBlob(blob=>{
      const file = new File([blob], 'edited-image.png', {type:'image/png'});
      // On iOS Safari, a plain <a download> link opens a Quick Look preview
      // page instead of saving — the user then has to tap the share icon and
      // pick "이미지 저장" themselves. navigator.share() with a File opens
      // that same share sheet directly, skipping the preview page entirely.
      if(navigator.canShare && navigator.canShare({files:[file]})){
        navigator.share({files:[file]}).catch(()=>{});
        return;
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'edited-image.png';
      a.click();
      URL.revokeObjectURL(a.href);
    }, 'image/png');
  });

})();
</script>
</body>
</html>
